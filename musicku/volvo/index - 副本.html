<!DOCTYPE html>
<html>
<head>
	<meta http-equiv="content-type" content="text/html; charset=utf-8"/>
	<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
	<title>h5旋转式幻灯片轮播插件 - 代码库</title>
	<link rel="stylesheet" href="css/dmaku.css">
	<!--[if IE]><link rel="stylesheet" href="css/ie.css"><![endif]-->
	<!--[if lte IE 9]><script type="text/javascript" src="js/ie.js"></script><![endif]-->
	<script type="text/javascript" src="js/dmaku.js"></script>
	<style type="text/css">
		body{ background: #F5F6F8; }
		.slider-container {padding-top: 20px;}
		.slider-container .csslider1 {position: relative;	display: block;	margin: 0 auto !important;}
	</style>
</head>
<!--/************************************************************
 *																*
 * 						      代码库							*
 *                        www.dmaku.com							*
 *       		  努力创建完善、持续更新插件以及模板			*
 * 																*
**************************************************************-->
<body id="scrollheader">
    <div id="rt-page-surround">       
        <!-- slider -->
        <section id="rt-showcase-surround">
            <div id="rt-showcase" class="slider-container rt-overlay-dark">
                <div class="rt-container slider-container">
                    <div class="rt-grid-12 rt-alpha rt-omega">
						<div class='csslider1 autoplay '>
							<input name="cs_anchor1" id='cs_slide1_0' type="radio" class='cs_anchor slide'>
							<input name="cs_anchor1" id='cs_slide1_1' type="radio" class='cs_anchor slide'>
							<input name="cs_anchor1" id='cs_slide1_2' type="radio" class='cs_anchor slide'>
							<input name="cs_anchor1" id='cs_slide1_3' type="radio" class='cs_anchor slide'>
							<input name="cs_anchor1" id='cs_play1' type="radio" class='cs_anchor' checked>
							<input name="cs_anchor1" id='cs_pause1_0' type="radio" class='cs_anchor pause'>
							<input name="cs_anchor1" id='cs_pause1_1' type="radio" class='cs_anchor pause'>
							<input name="cs_anchor1" id='cs_pause1_2' type="radio" class='cs_anchor pause'>
							<input name="cs_anchor1" id='cs_pause1_3' type="radio" class='cs_anchor pause'>
							
							<ul>
								<div style="width: 100%; visibility: hidden; font-size: 0px; line-height: 0;">
									<img src="images/images/road_forest_trees_tree_trip_nature_leaves_season.jpg" style="width: 100%;">
								</div>
								<li class='num0 img'>
									<img src='images/images/road_forest_trees_tree_trip_nature_leaves_season.jpg' alt='Road in park' title='Road in park' />
								</li>
								<li class='num1 img'>
									<img src='images/images/squantz_pond_connecticut_landscape_scenic_fall.jpg' alt='Squantz pond' title='Squantz pond' />
								</li>
								<li class='num2 img'>
									<img src='images/images/winter_snow_ice_forest_trees_white.jpg' alt='Ice trees' title='Ice trees' />
								</li>
								<li class='num3 img'>
									<img src='images/images/autumn_fog_forest.jpg' alt='Forest in fog' title='Forest in fog' />
								</li>
							
							</ul>							
							<div class='cs_play_pause'>
								<label class='cs_play' for='cs_play1'><span><i></i></span></label>
								<label class='cs_pause num0' for='cs_pause1_0'><span><i></i></span></label>
								<label class='cs_pause num1' for='cs_pause1_1'><span><i></i></span></label>
								<label class='cs_pause num2' for='cs_pause1_2'><span><i></i></span></label>
								<label class='cs_pause num3' for='cs_pause1_3'><span><i></i></span></label>
								
							</div>
							<div class='cs_arrowprev'>
								<label class='num0' for='cs_slide1_0'><span><i></i></span></label>
								<label class='num1' for='cs_slide1_1'><span><i></i></span></label>
								<label class='num2' for='cs_slide1_2'><span><i></i></span></label>
								<label class='num3' for='cs_slide1_3'><span><i></i></span></label>
							</div>
							<div class='cs_arrownext'>
								<label class='num0' for='cs_slide1_0'><span><i></i></span></label>
								<label class='num1' for='cs_slide1_1'><span><i></i></span></label>
								<label class='num2' for='cs_slide1_2'><span><i></i></span></label>
								<label class='num3' for='cs_slide1_3'><span><i></i></span></label>
							</div>
							
							<div class='cs_bullets'>
								<label class='num0' for='cs_slide1_0'>
									<span class='cs_point'></span>
									<span class='cs_thumb'><img src='images/tooltips/road_forest_trees_tree_trip_nature_leaves_season.jpg' alt='Road in park' title='Road in park' /></span>
								</label>
								<label class='num1' for='cs_slide1_1'>
									<span class='cs_point'></span>
									<span class='cs_thumb'><img src='images/tooltips/squantz_pond_connecticut_landscape_scenic_fall.jpg' alt='Squantz pond' title='Squantz pond' /></span>
								</label>
								<label class='num2' for='cs_slide1_2'>
									<span class='cs_point'></span>
									<span class='cs_thumb'><img src='images/tooltips/winter_snow_ice_forest_trees_white.jpg' alt='Ice trees' title='Ice trees' /></span>
								</label>
								<label class='num3' for='cs_slide1_3'>
									<span class='cs_point'></span>
									<span class='cs_thumb'><img src='images/tooltips/autumn_fog_forest.jpg' alt='Forest in fog' title='Forest in fog' /></span>
								</label>
							</div>

						</div>
                    </div>
                    <div class="clear"></div>
                </div>
            </div>
        </section>
        <!-- /slider -->
 </div>
</body>

</html>
