<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="initial-scale=1,user-scalable=no,maximum-scale=1,width=device-width">
    <title>古典风格滑块特效 · 音乐居中</title>
    <!-- 外部依赖 -->
    <script src="script/jquery.min.js"></script>
    <script src="script/jquery.seven.min.js"></script>
    <script src="script/jquery.easing.min.js"></script>
    <link href="css/style.css" rel="stylesheet" />
    <link href="css/sevenslider.css" rel="stylesheet" />
    <link href="css/skins/fullwidth.css" rel="stylesheet" />
    <link rel="stylesheet" type="text/css" href="css/demo.css" />
    <!-- 引入 music.js -->
    <script src="music.js"></script>
    <style>
        /* 全局重置 + 古典暗调 */
        * { margin:0; padding:0; list-style:none; box-sizing:border-box; }
        body {
            overflow:hidden;
            background:#000;
            color:#fff;
            font-size:13px;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        .box {
            height:100vh;
            min-height:520px;
            display:flex;
            justify-content:center;
            align-items:center;
            flex-direction:column;
            background:#000;
        }
        .content {
            position:relative;
            width:100%;
            height:100%;
            background:#000;
        }
        .content li {
            position:absolute;
            top:0;left:0;
            width:100%;height:100%;
        }
        /* 七滑块容器 — z-index 置于底层 */
        .seven_container {
            position:absolute;
            top:0;left:0;
            width:100%;
            height:100%;
            z-index:1;
        }
        /* 播放器容器 — 绝对居中，毛玻璃 + 尺寸加大（宽640px） */
        .music-player {
            position:absolute;
            top:50%;
            left:50%;
            transform:translate(-50%, -50%);
            width:640px;
            max-width:92vw;
            padding:30px 36px 24px 36px;
            background: rgba(10, 10, 20, 0.4);
            backdrop-filter: blur(12px) saturate(180%);
            -webkit-backdrop-filter: blur(12px) saturate(180%);
            border-radius:32px;
            border:1px solid rgba(255,255,255,0.15);
            box-shadow:0 16px 48px rgba(0,0,0,0.7);
            pointer-events:auto;
            color:#f0f0f0;
            text-align:center;
            transition:0.3s ease;
            z-index:20;  /* 保证在滑块之上 */
        }
        /* 歌曲名称 */
        .music-player .song-name {
            font-size:26px;
            font-weight:500;
            letter-spacing:1px;
            margin-bottom:16px;
            text-shadow:0 2px 8px rgba(0,0,0,0.6);
            white-space:nowrap;
            overflow:hidden;
            text-overflow:ellipsis;
            color:#fff;
            background:rgba(0,0,0,0.25);
            padding:10px 20px;
            border-radius:50px;
            backdrop-filter:blur(4px);
            display:inline-block;
            max-width:100%;
        }
        /* 进度条容器 */
        .music-player .progress-container {
            display:flex;
            align-items:center;
            gap:12px;
            width:100%;
            margin-bottom:20px;
            padding:0 4px;
        }
        .music-player .progress-bar-track {
            flex:1;
            height:4px;
            background:rgba(255,255,255,0.20);
            border-radius:4px;
            cursor:pointer;
            position:relative;
            transition:height 0.15s;
        }
        .music-player .progress-bar-track:hover {
            height:6px;
            background:rgba(255,255,255,0.30);
        }
        .music-player .progress-bar-fill {
            height:100%;
            width:0%;
            background:linear-gradient(90deg, #f0c060, #ffd700);
            border-radius:4px;
            transition:width 0.05s linear;
            box-shadow:0 0 12px rgba(255,215,0,0.25);
        }
        .music-player .progress-time {
            font-size:13px;
            color:rgba(255,255,255,0.70);
            min-width:42px;
            text-align:center;
            font-variant-numeric:tabular-nums;
            letter-spacing:0.3px;
        }
        /* 控制按钮组 — 模式按钮在下一首右侧 */
        .player-controls {
            display:flex;
            justify-content:center;
            align-items:center;
            gap:20px;
            margin-top:4px;
        }
        .player-controls button {
            background:rgba(30,30,50,0.4);
            backdrop-filter:blur(8px);
            -webkit-backdrop-filter:blur(8px);
            border:1px solid rgba(255,255,255,0.1);
            border-radius:60px;
            color:#fff;
            font-size:26px;
            width:60px;
            height:60px;
            display:flex;
            align-items:center;
            justify-content:center;
            cursor:pointer;
            transition:all 0.2s ease;
            box-shadow:0 4px 16px rgba(0,0,0,0.4);
        }
        .player-controls button:hover {
            background:rgba(255,255,255,0.25);
            transform:scale(1.05);
            border-color:rgba(255,255,255,0.4);
        }
        .player-controls button:active { transform:scale(0.92); }
        .player-controls .play-btn {
            width:76px;
            height:76px;
            font-size:34px;
            background:rgba(255,215,0,0.25);
            border-color:rgba(255,215,0,0.3);
        }
        .player-controls .play-btn:hover { background:rgba(255,215,0,0.4); }
        /* 模式按钮 — 在下一首右侧，只显示图标 */
        .player-controls .mode-btn {
            font-size:22px;
            width:60px;
            height:60px;
            background:rgba(200,180,100,0.15);
            border-color:rgba(255,215,0,0.15);
            letter-spacing:1px;
        }
        .player-controls .mode-btn:hover {
            background:rgba(200,180,100,0.30);
            border-color:rgba(255,215,0,0.30);
        }
        /* 列表按钮 */
        .player-controls .list-btn {
            font-size:22px;
            background:rgba(100,150,220,0.15);
            border-color:rgba(100,180,255,0.15);
        }
        .player-controls .list-btn:hover {
            background:rgba(100,180,255,0.30);
            border-color:rgba(100,180,255,0.30);
        }

        /* ===== 音乐列表 ===== */
        .music-list-wrapper {
            position:absolute;
            top:calc(50% + 190px);
            left:50%;
            transform:translateX(-50%);
            width:400px;
            max-width:80vw;
            max-height:180px;
            z-index:19;
            pointer-events:none;
        }
        .music-list {
            pointer-events:auto;
            background:rgba(10,10,20,0.55);
            backdrop-filter:blur(16px) saturate(180%);
            -webkit-backdrop-filter:blur(16px) saturate(180%);
            border-radius:20px;
            padding:10px 8px;
            width:100%;
            max-height:180px;
            overflow-y:auto;
            border:1px solid rgba(255,255,255,0.08);
            box-shadow:0 12px 40px rgba(0,0,0,0.6);
            color:#eef4f8;
            display:none;
        }
        .music-list.active { display:block; }
        .music-list .list-item {
            padding:6px 18px;
            border-radius:30px;
            cursor:pointer;
            transition:0.12s;
            font-size:15px;
            white-space:nowrap;
            overflow:hidden;
            text-overflow:ellipsis;
            color:rgba(255,255,255,0.75);
        }
        .music-list .list-item:hover {
            background:rgba(255,255,255,0.10);
            color:#fff;
        }
        .music-list .list-item.active-track {
            background:rgba(255,215,0,0.20);
            color:#ffd700;
            font-weight:500;
        }
        .music-list::-webkit-scrollbar {
            width:4px;
            background:transparent;
        }
        .music-list::-webkit-scrollbar-thumb {
            background:rgba(255,255,255,0.20);
            border-radius:10px;
        }

        /* 底部装饰栏 (原样保留) */
        .bottom-bar {
            position:fixed;
            width:100%;
            height:39px;
            z-index:4;
            left:0;
            bottom:-3px;
        }
        .bottom-icons {
            position:fixed;
            width:50px;
            height:50px;
            z-index:7;
            left:0;
            bottom:-3px;
            background:transparent;
        }
        /* 响应式适配 */
        @media (max-width:800px) {
            .music-player { width:80vw; padding:24px 20px; }
            .music-player .song-name { font-size:20px; padding:8px 14px; }
            .player-controls button { width:48px; height:48px; font-size:20px; }
            .player-controls .play-btn { width:60px; height:60px; font-size:26px; }
            .player-controls .mode-btn { width:48px; height:48px; font-size:18px; }
            .player-controls .list-btn { width:48px; height:48px; font-size:18px; }
            .music-player .progress-time { font-size:11px; min-width:34px; }
            .music-list-wrapper { width:70vw; top:calc(50% + 170px); max-height:150px; }
            .music-list { max-height:150px; }
        }
        @media (max-width:500px) {
            .music-player { width:92vw; padding:16px 12px; }
            .music-player .song-name { font-size:16px; }
            .player-controls { gap:12px; }
            .player-controls button { width:40px; height:40px; font-size:16px; }
            .player-controls .play-btn { width:50px; height:50px; font-size:20px; }
            .player-controls .mode-btn { width:40px; height:40px; font-size:15px; }
            .player-controls .list-btn { width:40px; height:40px; font-size:15px; }
            .music-player .progress-container { gap:8px; }
            .music-player .progress-time { font-size:10px; min-width:28px; }
            .music-list-wrapper { width:80vw; top:calc(50% + 150px); max-height:130px; }
            .music-list { max-height:130px; }
            .music-list .list-item { font-size:13px; padding:4px 12px; }
        }
    </style>
</head>
<body bgcolor="#000000">

<!-- 滑块区域 (全屏) -->
<div class="seven_container" style="z-index:1;">
    <div id="seven_viewport">
        <div class="seven_slider">
            <div class="seven_slide"><a class="seven_slide_title">云梦仙岛</a><img src="img/f1.jpg" alt="云梦仙岛" /></div>
            <div class="seven_slide"><a class="seven_slide_title">净念禅院</a><img src="img/f2.jpg" alt="净念禅院" /></div>
            <div class="seven_slide"><a class="seven_slide_title">天音阁</a><img src="img/f3.jpg" alt="天音阁" /></div>
        </div>
    </div>
    <a id="left_btn" class="seven_nav">Previous Slide</a>
    <a id="right_btn" class="seven_nav right_btn">Next Slide</a>
</div>

<!-- 音乐播放器 (绝对居中) -->
<div class="music-player" id="musicPlayer">
    <div class="song-name" id="songName">🎵 加载中...</div>
    <!-- 进度条 -->
    <div class="progress-container">
        <span class="progress-time" id="currentTime">0:00</span>
        <div class="progress-bar-track" id="progressTrack">
            <div class="progress-bar-fill" id="progressFill"></div>
        </div>
        <span class="progress-time" id="totalTime">0:00</span>
    </div>
    <!-- 控制区：上一首 | 播放/暂停 | 下一首 | 模式按钮 | 列表按钮 -->
    <div class="player-controls">
        <button id="prevBtn" title="上一首">⏮</button>
        <button id="playBtn" class="play-btn" title="播放/暂停">▶</button>
        <button id="nextBtn" title="下一首">⏭</button>
        <button id="modeBtn" class="mode-btn" title="切换播放模式">🔁</button>
        <button id="listToggleBtn" class="list-btn" title="显示/隐藏歌单">📋</button>
    </div>
    <!-- 模式状态文字已移除 -->
</div>

<!-- 音乐列表 -->
<div class="music-list-wrapper">
    <div class="music-list" id="musicList"></div>
</div>

<!-- 七滑块初始化脚本 -->
<script>
    $(document).ready(function(){
        var tb = $(".seven_container").sevenslider({
            width:774,
            height:550,
            fullwidth:true,
            animation:0,
            automation:true,
            autointerval:3,
            progress:true,
            progresstype:"linear",
            bullet:true,
            carousel:false,
            circular:true,
            responsive:true,
            swipe:true,
            keyboard:true,
            skin:"fullwidth",
            lightbox:true
        });
    });
</script>

<!-- 音乐播放器逻辑 (使用 music.js 中的 MUSIC_DATA) -->
<script>
    (function() {
        'use strict';

        // 从全局获取歌单数据 (由 music.js 定义)
        const playlist = window.MUSIC_DATA || [];

        if (playlist.length === 0) {
            document.getElementById('songName').textContent = '⚠️ 无歌单数据';
            console.warn('music.js 未加载或 MUSIC_DATA 为空');
            return;
        }

        // DOM 元素
        const songNameEl = document.getElementById('songName');
        const playBtn = document.getElementById('playBtn');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const modeBtn = document.getElementById('modeBtn');
        const listToggleBtn = document.getElementById('listToggleBtn');
        const musicListEl = document.getElementById('musicList');

        // 进度元素
        const progressFill = document.getElementById('progressFill');
        const progressTrack = document.getElementById('progressTrack');
        const currentTimeEl = document.getElementById('currentTime');
        const totalTimeEl = document.getElementById('totalTime');

        // 状态
        let currentIndex = 0;
        let isPlaying = false;
        let mode = 'loop'; // 'loop', 'single', 'random'
        const audio = new Audio();
        audio.volume = 0.7;

        // --- 辅助函数 ---
        function formatTime(sec) {
            if (isNaN(sec) || sec < 0) sec = 0;
            const mins = Math.floor(sec / 60);
            const secs = Math.floor(sec % 60);
            return mins + ':' + (secs < 10 ? '0' : '') + secs;
        }

        function updateProgress() {
            if (audio.duration && !isNaN(audio.duration)) {
                const percent = (audio.currentTime / audio.duration) * 100;
                progressFill.style.width = Math.min(percent, 100) + '%';
                currentTimeEl.textContent = formatTime(audio.currentTime);
                totalTimeEl.textContent = formatTime(audio.duration);
            } else {
                progressFill.style.width = '0%';
                currentTimeEl.textContent = '0:00';
                totalTimeEl.textContent = '0:00';
            }
        }

        // --- 列表渲染 ---
        function renderList() {
            if (!musicListEl) return;
            musicListEl.innerHTML = '';
            playlist.forEach((item, idx) => {
                const div = document.createElement('div');
                div.className = 'list-item' + (idx === currentIndex ? ' active-track' : '');
                div.textContent = (idx + 1) + '. ' + (item.name || '未知歌曲');
                div.dataset.index = idx;
                div.addEventListener('click', function() {
                    const index = parseInt(this.dataset.index);
                    if (!isNaN(index) && index >= 0 && index < playlist.length) {
                        currentIndex = index;
                        playCurrentSong();
                        updateListActive();
                    }
                });
                musicListEl.appendChild(div);
            });
        }

        function updateListActive() {
            const items = musicListEl.querySelectorAll('.list-item');
            items.forEach((item, idx) => {
                if (idx === currentIndex) {
                    item.classList.add('active-track');
                } else {
                    item.classList.remove('active-track');
                }
            });
        }

        function toggleList() {
            musicListEl.classList.toggle('active');
        }

        // --- 播放核心 ---
        function playCurrentSong() {
            const song = playlist[currentIndex];
            if (!song || !song.url) {
                console.warn('歌曲URL无效，尝试下一首');
                nextSong();
                return;
            }
            if (audio.src !== song.url) {
                audio.src = song.url;
                audio.load();
            }
            songNameEl.textContent = song.name || '未知歌曲';
            audio.addEventListener('loadedmetadata', updateProgress);
            audio.play().then(() => {
                isPlaying = true;
                playBtn.textContent = '⏸';
                updateProgress();
            }).catch(err => {
                console.warn('播放失败:', err.message);
                nextSong();
            });
            updateListActive();
        }

        function pauseSong() {
            audio.pause();
            isPlaying = false;
            playBtn.textContent = '▶';
        }

        function togglePlay() {
            if (isPlaying) {
                pauseSong();
            } else {
                if (audio.ended || !audio.src) {
                    playCurrentSong();
                } else {
                    audio.play().then(() => {
                        isPlaying = true;
                        playBtn.textContent = '⏸';
                        updateProgress();
                    }).catch(() => {
                        playCurrentSong();
                    });
                }
            }
        }

        function nextSong() {
            if (mode === 'random') {
                randomSong();
                return;
            }
            currentIndex = (currentIndex + 1) % playlist.length;
            playCurrentSong();
        }

        function prevSong() {
            if (mode === 'random') {
                randomSong();
                return;
            }
            currentIndex = (currentIndex - 1 + playlist.length) % playlist.length;
            playCurrentSong();
        }

        function randomSong() {
            let newIndex;
            if (playlist.length <= 1) {
                newIndex = 0;
            } else {
                do {
                    newIndex = Math.floor(Math.random() * playlist.length);
                } while (newIndex === currentIndex);
            }
            currentIndex = newIndex;
            playCurrentSong();
        }

        function toggleMode() {
            if (mode === 'loop') {
                mode = 'single';
                modeBtn.textContent = '🔂';
            } else if (mode === 'single') {
                mode = 'random';
                modeBtn.textContent = '🎲';
            } else {
                mode = 'loop';
                modeBtn.textContent = '🔁';
            }
        }

        // --- 音频事件 ---
        audio.addEventListener('timeupdate', updateProgress);
        audio.addEventListener('ended', function() {
            if (mode === 'single') {
                audio.currentTime = 0;
                audio.play().catch(() => {});
                updateProgress();
            } else {
                nextSong();
            }
        });

        // 点击进度条跳转
        progressTrack.addEventListener('click', function(e) {
            if (!audio.duration || isNaN(audio.duration)) return;
            const rect = this.getBoundingClientRect();
            const ratio = (e.clientX - rect.left) / rect.width;
            const seekTime = ratio * audio.duration;
            audio.currentTime = seekTime;
            updateProgress();
        });

        // --- 初始化 ---
        function initPlayer() {
            if (playlist.length > 0) {
                const first = playlist[0];
                songNameEl.textContent = first.name || '未知歌曲';
                audio.src = first.url;
                audio.load();
                audio.addEventListener('loadedmetadata', updateProgress);
            } else {
                songNameEl.textContent = '⚠️ 无歌单';
            }
            modeBtn.textContent = '🔁';
            playBtn.textContent = '▶';
            isPlaying = false;
            renderList();
            updateListActive();
            updateProgress();
        }

        // --- 事件绑定 ---
        playBtn.addEventListener('click', togglePlay);
        prevBtn.addEventListener('click', prevSong);
        nextBtn.addEventListener('click', nextSong);
        modeBtn.addEventListener('click', toggleMode);
        listToggleBtn.addEventListener('click', toggleList);

        // 键盘快捷键
        document.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
            if (e.code === 'Space') {
                e.preventDefault();
                togglePlay();
            } else if (e.code === 'ArrowRight') {
                e.preventDefault();
                nextSong();
            } else if (e.code === 'ArrowLeft') {
                e.preventDefault();
                prevSong();
            } else if (e.code === 'KeyM') {
                toggleMode();
            } else if (e.code === 'KeyL') {
                toggleList();
            }
        });

        // 点击外部关闭列表
        document.addEventListener('click', (e) => {
            const list = document.getElementById('musicList');
            const toggleBtn = document.getElementById('listToggleBtn');
            if (list && list.classList.contains('active')) {
                const target = e.target;
                if (!list.contains(target) && target !== toggleBtn && !toggleBtn.contains(target)) {
                    list.classList.remove('active');
                }
            }
        });

        initPlayer();
        window.__music = { togglePlay, nextSong, prevSong, toggleMode, playlist, currentIndex, audio };
    })();
</script>

</body>
</html>
