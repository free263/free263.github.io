      background: rgba(10, 10, 20, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.15);

    /* ===== 进度条 (新增) ===== */
    .progress-wrap {
      display: flex;

    .progress-track {
      flex: 1;
      height: 5px;

      cursor: pointer;
      position: relative;
      transition: height 0.15s;

      height: 8px;
      background: rgba(255, 255, 255, 0.3);

    .progress-fill {
      width: 0%;

      transition: width 0.05s linear;

      right: -5px;
      top: -3px;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
      opacity: 0;
      transition: opacity 0.2s;

  <!-- 内联音乐播放器逻辑 (使用Audio API) -->
  <script>
    (function() {
      // 从 music.js 读取数据
      const playlist = window.MUSIC_DATA || [
        { name: '示例歌曲1', url: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3' },
        { name: '示例歌曲2', url: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3' }
      ];

      // DOM 元素
      const songNameEl = document.getElementById('songName');
      const playBtn = document.getElementById('playBtn');
      const prevBtn = document.getElementById('prevBtn');
      const nextBtn = document.getElementById('nextBtn');
      const modeIndicator = document.getElementById('modeIndicator');
      const listToggleBtn = document.getElementById('listToggleBtn');
      const musicListContainer = document.getElementById('musicListContainer');
      const musicListUl = document.getElementById('musicList');
      const progressFill = document.getElementById('progressFill');
      const progressTrack = document.getElementById('progressTrack');
      const currentTimeEl = document.getElementById('currentTime');
      const totalTimeEl = document.getElementById('totalTime');

      // 状态
      let currentIndex = 0;
      let isPlaying = false;
      let mode = 'loop'; // 'loop', 'single', 'random'
      let audio = new Audio();
      let isUserInteracted = false;

      // 辅助函数
      function formatTime(seconds) {
        if (isNaN(seconds) || seconds === Infinity) return '0:00';
        const m = Math.floor(seconds / 60);
        const s = Math.floor(seconds % 60);
        return m + ':' + (s < 10 ? '0' : '') + s;
      }

      function updateProgress() {
        if (!audio.duration || isNaN(audio.duration)) {
          progressFill.style.width = '0%';
          currentTimeEl.textContent = '0:00';
          totalTimeEl.textContent = '0:00';
          return;
        }
        const percent = (audio.currentTime / audio.duration) * 100;
        progressFill.style.width = Math.min(percent, 100) + '%';
        currentTimeEl.textContent = formatTime(audio.currentTime);
        totalTimeEl.textContent = formatTime(audio.duration);
      }

      function formatName(name) {
        if (!name) return '未知歌曲';
        return name.replace(/\.[^.]+$/, '');
      }

      function loadSong(index) {
        const song = playlist[index];
        if (!song) return;
        audio.src = song.url;
        audio.load();
        songNameEl.textContent = '🎵 ' + formatName(song.name);
        // 高亮列表
        const items = musicListUl.querySelectorAll('li');
        items.forEach((li, i) => {
          li.classList.toggle('active', i === index);
        });
        // 重置进度
        progressFill.style.width = '0%';
        currentTimeEl.textContent = '0:00';
        totalTimeEl.textContent = '0:00';
        if (isPlaying) {
          audio.play().catch(() => {});
        }
        updatePlayButton();
      }

      function updatePlayButton() {
        playBtn.textContent = audio.paused ? '▶' : '⏸';
      }

      function togglePlay() {
        if (!playlist.length) return;
        if (audio.paused) {
          audio.play().then(() => {
            isPlaying = true;
            updatePlayButton();
          }).catch(() => {
            isPlaying = false;
            updatePlayButton();
          });
        } else {
          audio.pause();
          isPlaying = false;
          updatePlayButton();
        }
      }

      function nextSong() {
        if (!playlist.length) return;
        if (mode === 'random') {
          let newIndex;
          do {
            newIndex = Math.floor(Math.random() * playlist.length);
          } while (playlist.length > 1 && newIndex === currentIndex);
          currentIndex = newIndex;
        } else {
          currentIndex = (currentIndex + 1) % playlist.length;
        }
        loadSong(currentIndex);
        if (isPlaying) {
          audio.play().catch(() => {});
        }
        updateModeIndicator();
      }

      function prevSong() {
        if (!playlist.length) return;
        if (mode === 'random') {
          let newIndex;
          do {
            newIndex = Math.floor(Math.random() * playlist.length);
          } while (playlist.length > 1 && newIndex === currentIndex);
          currentIndex = newIndex;
        } else {
          currentIndex = (currentIndex - 1 + playlist.length) % playlist.length;
        }
        loadSong(currentIndex);
        if (isPlaying) {
          audio.play().catch(() => {});
        }
        updateModeIndicator();
      }

      function toggleMode() {
        if (mode === 'loop') mode = 'single';
        else if (mode === 'single') mode = 'random';
        else if (mode === 'random') mode = 'loop';
        updateModeIndicator();
      }

      function updateModeIndicator() {
        const map = {
          'loop': '🔁 列表循环',
          'single': '🔂 单曲循环',
          'random': '🎲 随机播放'
        };
        modeIndicator.textContent = map[mode] || '🔁 列表循环';
      }

      // 渲染列表
      function renderList() {
        musicListUl.innerHTML = '';
        playlist.forEach((song, idx) => {
          const li = document.createElement('li');
          li.textContent = formatName(song.name);
          li.dataset.index = idx;
          if (idx === currentIndex) li.classList.add('active');
          li.addEventListener('click', function(e) {
            const index = parseInt(this.dataset.index, 10);
            if (!isNaN(index) && index !== currentIndex) {
              currentIndex = index;
              loadSong(currentIndex);
              if (isPlaying) {
                audio.play().catch(() => {});
              } else {
                isPlaying = true;
                audio.play().catch(() => {});
                updatePlayButton();
              }
            } else if (index === currentIndex) {
              togglePlay();
            }
            // 点击后自动关闭列表（移动端友好）
            musicListContainer.classList.remove('open');
            listToggleBtn.textContent = '📋';
          });
          musicListUl.appendChild(li);
        });
      }

      // 进度条点击跳转
      function handleProgressClick(e) {
        const rect = progressTrack.getBoundingClientRect();
        const x = (e.clientX - rect.left) / rect.width;
        if (audio.duration && !isNaN(audio.duration)) {
          audio.currentTime = x * audio.duration;
          updateProgress();
        }
      }

      // 绑定事件
      playBtn.addEventListener('click', function(e) {
        e.stopPropagation();
        if (!playlist.length) return;
        if (!audio.src) loadSong(0);
        togglePlay();
      });

      prevBtn.addEventListener('click', function(e) {
        e.stopPropagation();
        prevSong();
      });

      nextBtn.addEventListener('click', function(e) {
        e.stopPropagation();
        nextSong();
      });

      modeIndicator.addEventListener('click', function(e) {
        e.stopPropagation();
        toggleMode();
      });

      listToggleBtn.addEventListener('click', function(e) {
        e.stopPropagation();
        const isOpen = musicListContainer.classList.toggle('open');
        listToggleBtn.textContent = isOpen ? '✕' : '📋';
      });

      // 进度条交互
      progressTrack.addEventListener('click', handleProgressClick);
      progressTrack.addEventListener('mousedown', function(e) {
        const moveHandler = (ev) => {
          ev.preventDefault();
          handleProgressClick(ev);
        };
        const upHandler = () => {
          document.removeEventListener('mousemove', moveHandler);
          document.removeEventListener('mouseup', upHandler);
        };
        document.addEventListener('mousemove', moveHandler);
        document.addEventListener('mouseup', upHandler);
      });

      // 音频事件
      audio.addEventListener('timeupdate', updateProgress);
      audio.addEventListener('loadedmetadata', function() {
        totalTimeEl.textContent = formatTime(audio.duration);
        updateProgress();
      });
      audio.addEventListener('ended', function() {
        if (mode === 'single') {
          audio.currentTime = 0;
          audio.play().catch(() => {});
        } else {
          nextSong();
        }
      });

      // 点击页面空白关闭列表
      document.addEventListener('click', function(e) {
        const player = document.getElementById('musicPlayer');
        if (player && !player.contains(e.target) && musicListContainer.classList.contains('open')) {
          musicListContainer.classList.remove('open');
          listToggleBtn.textContent = '📋';
        }
      });

      // 键盘快捷键
      document.addEventListener('keydown', (e) => {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
        if (e.code === 'Space') {
          e.preventDefault();
          playBtn.click();
        } else if (e.code === 'ArrowRight') {
          e.preventDefault();
          nextBtn.click();
        } else if (e.code === 'ArrowLeft') {
          e.preventDefault();
          prevBtn.click();
        } else if (e.code === 'KeyM') {
          modeIndicator.click();
        }
      });

      // 初始化
      if (playlist.length) {
        renderList();
        loadSong(0);
        audio.pause();
        isPlaying = false;
        updatePlayButton();
        updateModeIndicator();
      } else {
        songNameEl.textContent = '🎵 无音乐数据';
      }

      console.log('🎵 音乐播放器已初始化 (带进度条+列表)');
    })();
  </script>

</body>
</html>
