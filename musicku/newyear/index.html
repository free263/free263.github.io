﻿<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Hello, 2020 happy new year</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0,minimum-scale=1.0,maximum-scale=1.0, user-scalable=no">
<link rel="stylesheet" type="text/css" href="css/style.css">
<link rel="stylesheet" type="text/css" href="https://at.alicdn.com/t/font_1191451_h720mljzrsc.css">
<link rel="stylesheet" href="css/bootstrap.css">
<script src="js/bootstrap.min.js"></script>
<script src="js/jquery.min.js"></script>
<script src="js/jweixin-1.4.0.js"></script> 
<script src="js/app.js"></script>
<style>
/* ===== 只修改播放器相关样式，其余完全保留 ===== */
.music {
    width: 100%;
    max-width: 400px;
    margin: 20px auto;
    padding: 0 10px;
    position: relative;
}
/* 播放器主体 - 圆弧横条 */
.player-bar {
    background: rgba(0, 0, 0, 0.35);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    border-radius: 60px;
    padding: 8px 16px 8px 20px;
    display: flex;
    align-items: center;
    gap: 8px;
    border: 1px solid rgba(255, 255, 255, 0.15);
    box-shadow: 0 8px 20px rgba(0,0,0,0.3);
    flex-wrap: nowrap;
    min-height: 56px;
}
/* 控制按钮组 - 图标纯白色 */
.controls {
    display: flex;
    align-items: center;
    gap: 4px;
    flex-shrink: 0;
}
.controls button {
    background: rgba(255, 255, 255, 0.10);
    border: none;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    color: #ffffff !important;
    font-size: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: 0.2s;
    border: 1px solid rgba(255, 255, 255, 0.08);
    flex-shrink: 0;
}
.controls button i {
    color: #ffffff !important;
}
.controls button:hover {
    background: rgba(255, 255, 255, 0.25);
    transform: scale(1.05);
}
.controls button#prevBtn i {
    font-size: 18px;
}
.controls button.play-btn {
    width: 44px;
    height: 44px;
    font-size: 22px;
    background: rgba(255, 255, 255, 0.18);
    border-color: rgba(255, 255, 255, 0.25);
}
.controls button.play-btn i {
    font-size: 24px;
}
.controls button#nextBtn i {
    font-size: 18px;
}
/* 进度区域 */
.progress-area {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 80px;
}
.time-label {
    color: rgba(255, 255, 255, 0.85);
    font-size: 12px;
    font-variant-numeric: tabular-nums;
    min-width: 32px;
    text-align: center;
    flex-shrink: 0;
}
.track-progress {
    flex: 1;
    height: 4px;
    -webkit-appearance: none;
    appearance: none;
    background: rgba(255, 255, 255, 0.25);
    border-radius: 10px;
    outline: none;
    cursor: pointer;
    min-width: 40px;
}
.track-progress::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 2px 8px rgba(0,0,0,0.4);
    border: 2px solid #fe30ae;
    transition: 0.1s;
}
.track-progress::-moz-range-thumb {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: #fff;
    border: 2px solid #fe30ae;
    cursor: pointer;
}
/* 右侧模式按钮 */
.mode-area {
    display: flex;
    align-items: center;
    flex-shrink: 0;
}
.mode-btn {
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 30px;
    color: #fff;
    padding: 4px 12px;
    font-size: 12px;
    cursor: pointer;
    transition: 0.2s;
    display: flex;
    align-items: center;
    gap: 4px;
    white-space: nowrap;
}
.mode-btn:hover {
    background: rgba(255, 255, 255, 0.15);
}
.mode-btn i {
    font-size: 14px;
    color: #fff;
}
/* 歌曲名称 - 在播放器上方 */
.song-title {
    color: #fff;
    font-size: 14px;
    padding: 0 12px 6px 12px;
    text-align: center;
    text-shadow: 0 2px 8px rgba(0,0,0,0.5);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 100%;
    font-weight: 500;
}
/* 列表容器 - 点击歌单展开 */
.playlist-toggle {
    background: rgba(255, 255, 255, 0.08);
    border: none;
    border-radius: 30px;
    color: rgba(255, 255, 255, 0.7);
    font-size: 12px;
    padding: 2px 14px;
    cursor: pointer;
    transition: 0.2s;
    margin-top: 4px;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    backdrop-filter: blur(2px);
}
.playlist-toggle:hover {
    background: rgba(255, 255, 255, 0.18);
    color: #fff;
}
.playlist-toggle i {
    color: rgba(255, 255, 255, 0.8);
}
.playlist-container {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.3s ease, opacity 0.25s ease;
    opacity: 0;
    background: rgba(0, 0, 0, 0.2);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    border-radius: 20px;
    margin-top: 6px;
    border: 1px solid rgba(255, 255, 255, 0.05);
}
.playlist-container.open {
    max-height: 220px;
    opacity: 1;
    padding: 6px 4px;
    overflow-y: auto;
}
.playlist-container ul {
    list-style: none;
    padding: 0 4px;
    margin: 0;
}
.playlist-container li {
    display: flex;
    align-items: center;
    padding: 8px 14px;
    border-radius: 30px;
    color: rgba(255, 255, 255, 0.85);
    font-size: 13px;
    cursor: pointer;
    transition: 0.15s;
    gap: 10px;
}
.playlist-container li:hover {
    background: rgba(255, 255, 255, 0.08);
}
.playlist-container li.active {
    background: rgba(255, 255, 255, 0.15);
    color: #fff;
    font-weight: 500;
}
.playlist-container li .status-icon {
    margin-left: auto;
    font-size: 12px;
    opacity: 0.6;
}
/* 隐藏原来的audio控件 */
.music audio {
    display: none !important;
}
.music marquee {
    display: none !important;
}
/* 响应式调整 */
@media (max-width: 480px) {
    .player-bar {
        padding: 6px 10px;
        gap: 4px;
        flex-wrap: nowrap;
    }
    .controls button {
        width: 30px;
        height: 30px;
        font-size: 13px;
    }
    .controls button#prevBtn i,
    .controls button#nextBtn i {
        font-size: 14px;
    }
    .controls button.play-btn {
        width: 38px;
        height: 38px;
        font-size: 18px;
    }
    .controls button.play-btn i {
        font-size: 20px;
    }
    .time-label {
        font-size: 10px;
        min-width: 26px;
    }
    .mode-btn {
        font-size: 10px;
        padding: 2px 8px;
    }
    .song-title {
        font-size: 12px;
        padding: 0 8px 4px 8px;
    }
}
</style>
</head>
<body>

<div class="key">
	<div class="iocnBox"><i class="iconfont icon-delete"></i></div>
	<div class="empty">清空</div>
	<textarea placeholder="在此述说新年寄语..." rows="1" class="van-field__control"></textarea>
	<div class="buts">发送</div>
</div>
<div class="today">
	<div class="clock">
		<div class="pos SS"></div>
		<div class="pos MM"></div>
		<div class="pos HH"></div>
		<div class="spot"></div>
	</div>
	<div class="time"></div>
	<div class="sydate"></div>
</div>
<div class="Barrage"></div>
<div class="message">发送弹幕</div>

<!-- ===== 修改后的播放器部分 ===== -->
<div class="music">
    <!-- 隐藏的原生audio，由JS控制 -->
    <audio class="play" id="indexVideo" controls autoplay>
        <source src="mp3/akon.mp3" type="audio/mpeg">
        您的浏览器不支持 audio 元素。
    </audio>
    
    <!-- 歌曲名称 -->
    <div class="song-title" id="nowPlayingTitle">🎵 加载中...</div>
    
    <!-- 圆弧横条播放器 -->
    <div class="player-bar">
        <!-- 控制按钮 -->
        <div class="controls">
            <button id="prevBtn" aria-label="上一首"><i class="iconfont icon-left"></i></button>
            <button class="play-btn" id="playBtn" aria-label="播放/暂停"><i class="iconfont icon-play"></i></button>
            <button id="nextBtn" aria-label="下一首"><i class="iconfont icon-right"></i></button>
        </div>
        
        <!-- 进度条 + 时间 -->
        <div class="progress-area">
            <span class="time-label" id="currentTime">0:00</span>
            <input type="range" class="track-progress" id="progressSlider" min="0" max="100" value="0" step="0.1">
            <span class="time-label" id="totalTime">0:00</span>
        </div>
        
        <!-- 模式切换 -->
        <div class="mode-area">
            <button class="mode-btn" id="modeBtn"><i class="iconfont icon-loop"></i> <span id="modeLabel">顺序</span></button>
        </div>
    </div>
    
    <!-- 歌单切换按钮 & 列表 -->
    <div style="text-align: center; margin-top: 6px;">
        <button class="playlist-toggle" id="toggleListBtn"><i class="iconfont icon-music"></i> 歌单</button>
    </div>
    <div class="playlist-container" id="playlistContainer">
        <ul id="playlistUl"></ul>
    </div>
</div>

<!-- 引入 music.js -->
<script src="music.js"></script>
<script>
// ===== 播放器控制脚本（使用 MUSIC_DATA） =====
(function() {
    // ---------- 从 MUSIC_DATA 读取歌单 ----------
    const playlist = window.MUSIC_DATA || [];
    if (playlist.length === 0) {
        document.getElementById('nowPlayingTitle').textContent = '⚠️ 无歌单数据';
        console.warn('music.js 未加载或 MUSIC_DATA 为空');
        return;
    }

    // ---------- DOM 引用 ----------
    const audio = document.getElementById('indexVideo');
    const playBtn = document.getElementById('playBtn');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const progressSlider = document.getElementById('progressSlider');
    const currentTimeLabel = document.getElementById('currentTime');
    const totalTimeLabel = document.getElementById('totalTime');
    const nowPlayingTitle = document.getElementById('nowPlayingTitle');
    const playlistUl = document.getElementById('playlistUl');
    const toggleListBtn = document.getElementById('toggleListBtn');
    const playlistContainer = document.getElementById('playlistContainer');
    const modeBtn = document.getElementById('modeBtn');
    const modeLabel = document.getElementById('modeLabel');

    // ---------- 状态 ----------
    let currentIndex = 0;
    let isDragging = false;
    let playMode = 'list'; // 'list', 'single', 'random'
    let isListOpen = false;

    // ---------- 辅助函数 ----------
    function formatTime(sec) {
        if (!sec || isNaN(sec)) return '0:00';
        const m = Math.floor(sec / 60);
        const s = Math.floor(sec % 60);
        return m + ':' + (s < 10 ? '0' : '') + s;
    }

    function updatePlayButton() {
        const icon = playBtn.querySelector('i');
        if (!audio.paused) {
            icon.className = 'iconfont icon-pause';
        } else {
            icon.className = 'iconfont icon-play';
        }
    }

    function loadSong(index) {
        const song = playlist[index];
        if (!song) return;
        audio.src = song.url;
        audio.load();
        nowPlayingTitle.textContent = '🎵 ' + (song.name || '未知歌曲');
        progressSlider.value = 0;
        currentTimeLabel.textContent = '0:00';
        document.querySelectorAll('#playlistUl li').forEach((li, i) => {
            li.classList.toggle('active', i === index);
            const status = li.querySelector('.status-icon');
            if (status) status.textContent = (i === index && !audio.paused) ? '▶' : (i === index ? '⏸' : '');
        });
    }

    function togglePlay() {
        if (audio.paused) {
            audio.play().catch(e => console.warn('播放失败:', e));
        } else {
            audio.pause();
        }
        updatePlayButton();
        document.querySelectorAll('#playlistUl li').forEach((li, i) => {
            const status = li.querySelector('.status-icon');
            if (status) status.textContent = (i === currentIndex && !audio.paused) ? '▶' : (i === currentIndex ? '⏸' : '');
        });
    }

    function prevSong() {
        if (playlist.length === 0) return;
        if (playMode === 'random') {
            let newIdx = Math.floor(Math.random() * playlist.length);
            while (newIdx === currentIndex && playlist.length > 1) newIdx = Math.floor(Math.random() * playlist.length);
            currentIndex = newIdx;
        } else {
            currentIndex = (currentIndex - 1 + playlist.length) % playlist.length;
        }
        loadSong(currentIndex);
        audio.play().catch(() => {});
        updatePlayButton();
    }

    function nextSong() {
        if (playlist.length === 0) return;
        if (playMode === 'random') {
            let newIdx = Math.floor(Math.random() * playlist.length);
            while (newIdx === currentIndex && playlist.length > 1) newIdx = Math.floor(Math.random() * playlist.length);
            currentIndex = newIdx;
        } else {
            currentIndex = (currentIndex + 1) % playlist.length;
        }
        loadSong(currentIndex);
        audio.play().catch(() => {});
        updatePlayButton();
    }

    function cycleMode() {
        const modes = ['list', 'single', 'random'];
        const labels = ['顺序', '单曲', '随机'];
        let idx = modes.indexOf(playMode);
        idx = (idx + 1) % modes.length;
        playMode = modes[idx];
        modeLabel.textContent = labels[idx];
        const icon = modeBtn.querySelector('i');
        if (playMode === 'list') icon.className = 'iconfont icon-loop';
        else if (playMode === 'single') icon.className = 'iconfont icon-single';
        else if (playMode === 'random') icon.className = 'iconfont icon-random';
    }

    function renderPlaylist() {
        playlistUl.innerHTML = '';
        playlist.forEach((item, idx) => {
            const li = document.createElement('li');
            li.dataset.index = idx;
            const isActive = (idx === currentIndex);
            li.innerHTML = `
                <span>${item.name || '未知歌曲'}</span>
                <span class="status-icon">${isActive ? (audio.paused ? '⏸' : '▶') : ''}</span>
            `;
            if (isActive) li.classList.add('active');
            li.addEventListener('click', () => {
                if (idx !== currentIndex) {
                    currentIndex = idx;
                    loadSong(currentIndex);
                    audio.play().catch(() => {});
                    updatePlayButton();
                } else {
                    togglePlay();
                }
            });
            playlistUl.appendChild(li);
        });
    }

    function updateProgress() {
        if (isDragging) return;
        if (audio.duration && !isNaN(audio.duration)) {
            const percent = (audio.currentTime / audio.duration) * 100;
            progressSlider.value = percent;
            currentTimeLabel.textContent = formatTime(audio.currentTime);
            totalTimeLabel.textContent = formatTime(audio.duration);
        } else {
            totalTimeLabel.textContent = '0:00';
        }
    }

    function init() {
        currentIndex = 0;
        loadSong(0);
        renderPlaylist();
        updatePlayButton();
        modeLabel.textContent = '顺序';
        modeBtn.querySelector('i').className = 'iconfont icon-loop';
        audio.pause();
        updatePlayButton();
        // 初始进度显示
        totalTimeLabel.textContent = '0:00';
        currentTimeLabel.textContent = '0:00';
        progressSlider.value = 0;
    }

    // ---------- 事件绑定 ----------
    playBtn.addEventListener('click', togglePlay);
    prevBtn.addEventListener('click', prevSong);
    nextBtn.addEventListener('click', nextSong);

    progressSlider.addEventListener('input', function(e) {
        isDragging = true;
        if (audio.duration) {
            const val = parseFloat(e.target.value);
            const time = (val / 100) * audio.duration;
            audio.currentTime = time;
            currentTimeLabel.textContent = formatTime(time);
        }
    });
    progressSlider.addEventListener('change', function() {
        isDragging = false;
    });

    audio.addEventListener('timeupdate', updateProgress);
    audio.addEventListener('loadedmetadata', function() {
        totalTimeLabel.textContent = formatTime(audio.duration);
        progressSlider.value = 0;
    });
    audio.addEventListener('ended', function() {
        if (playMode === 'single') {
            audio.currentTime = 0;
            audio.play().catch(() => {});
            return;
        }
        nextSong();
    });
    audio.addEventListener('play', function() {
        updatePlayButton();
        document.querySelectorAll('#playlistUl li').forEach((li, i) => {
            const status = li.querySelector('.status-icon');
            if (status) status.textContent = (i === currentIndex) ? '▶' : '';
        });
    });
    audio.addEventListener('pause', function() {
        updatePlayButton();
        document.querySelectorAll('#playlistUl li').forEach((li, i) => {
            const status = li.querySelector('.status-icon');
            if (status) status.textContent = (i === currentIndex) ? '⏸' : '';
        });
    });

    modeBtn.addEventListener('click', cycleMode);

    toggleListBtn.addEventListener('click', function() {
        isListOpen = !isListOpen;
        playlistContainer.classList.toggle('open', isListOpen);
        toggleListBtn.innerHTML = isListOpen ? '<i class="iconfont icon-close"></i> 收起' : '<i class="iconfont icon-music"></i> 歌单';
    });

    init();
    console.log('🎵 播放器初始化完成，共 ' + playlist.length + ' 首歌曲');
})();
</script>
</body>
</html>
