    <!-- ===== 视差滚动脚本（原有） ===== -->
    <script>
        function castParallax() {
            var opThresh = 350;
            var opFactor = 750;

            window.addEventListener("scroll", function(event) {
                var top = this.pageYOffset;
                var layers = document.getElementsByClassName("parallax");
                var layer, speed, yPos;
                for (var i = 0; i < layers.length; i++) {
                    layer = layers[i];
                    speed = layer.getAttribute('data-speed');
                    var yPos = -(top * speed / 100);
                    layer.setAttribute('style', 'transform: translate3d(0px, ' + yPos + 'px, 0px)');
                }
            });
        }
        document.body.onload = castParallax();
    </script>

    <!-- ===== 播放器脚本 ===== -->
    <script>
        (function() {
            // ----- 获取音乐数据 -----
            var MUSIC_DATA = [];
            if (typeof window.MUSIC_DATA !== 'undefined' && window.MUSIC_DATA && window.MUSIC_DATA.length > 0) {
                MUSIC_DATA = window.MUSIC_DATA;
                console.log('✅ 已加载 music.js 数据，共 ' + MUSIC_DATA.length + ' 首');
            } else if (typeof MUSIC_DATA !== 'undefined' && MUSIC_DATA && MUSIC_DATA.length > 0) {
                MUSIC_DATA = MUSIC_DATA;
                console.log('✅ 已加载 MUSIC_DATA，共 ' + MUSIC_DATA.length + ' 首');
            } else {
                MUSIC_DATA = [
                    { name: '🎵 示例 · 山间', url: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3' },
                    { name: '🎵 示例 · 云海', url: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3' },
                    { name: '🎵 示例 · 林风', url: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3' },
                    { name: '🎵 示例 · 溪流', url: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-4.mp3' },
                    { name: '🎵 示例 · 落日', url: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-5.mp3' }
                ];
                console.warn('⚠️ music.js 未加载或数据为空，使用备用示例音乐（' + MUSIC_DATA.length + ' 首）');
                document.getElementById('nowPlaying').textContent = '🎵 使用示例音乐';
            }

            // ----- DOM 引用 -----
            const audio = new Audio();
            let currentIndex = 0;
            let isPlaying = false;
            let mode = 'order';
            let isDragging = false;

            const playBtn = document.getElementById('playBtn');
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');
            const modeBtn = document.getElementById('modeBtn');
            const nowPlayingEl = document.getElementById('nowPlaying');
            const progressSlider = document.getElementById('progressSlider');
            const currentTimeDisplay = document.getElementById('currentTimeDisplay');
            const durationDisplay = document.getElementById('durationDisplay');
            const playlistPopup = document.getElementById('playlistPopup');
            const listToggleBtn = document.getElementById('listToggleBtn');
            const errorTip = document.getElementById('errorTip');

            function hideError() { errorTip.style.display = 'none'; }

            function showError(msg) {
                errorTip.textContent = msg || '⚠️ 播放失败，请点击播放按钮重试';
                errorTip.style.display = 'block';
            }

            // ----- 渲染列表 -----
            function renderPlaylist() {
                if (!playlistPopup) return;
                playlistPopup.innerHTML = '';
                if (!MUSIC_DATA || MUSIC_DATA.length === 0) {
                    const div = document.createElement('div');
                    div.className = 'playlist-item';
                    div.textContent = '暂无音乐';
                    playlistPopup.appendChild(div);
                    return;
                }
                MUSIC_DATA.forEach((item, idx) => {
                    const div = document.createElement('div');
                    div.className = 'playlist-item' + (idx === currentIndex ? ' active' : '');
                    const displayName = item.name || '未命名歌曲';
                    div.innerHTML = `
                        <span class="index">${idx+1}</span>
                        <span class="name">${displayName}</span>
                        <span class="status-icon">${idx === currentIndex ? (isPlaying ? '▶' : '⏸') : ''}</span>
                    `;
                    div.addEventListener('click', (e) => {
                        e.stopPropagation();
                        if (idx === currentIndex && isPlaying) {
                            togglePlay();
                        } else {
                            currentIndex = idx;
                            playCurrent();
                        }
                        playlistPopup.classList.remove('show');
                    });
                    playlistPopup.appendChild(div);
                });
            }

            function updatePlaylistActive() {
                const items = playlistPopup.querySelectorAll('.playlist-item');
                items.forEach((el, idx) => {
                    el.classList.toggle('active', idx === currentIndex);
                    const icon = el.querySelector('.status-icon');
                    if (icon) {
                        icon.textContent = (idx === currentIndex && isPlaying) ? '▶' : (idx === currentIndex ? '⏸' :
                        '');
                    }
                });
            }

            // ----- 播放核心 -----
            function playCurrent() {
                hideError();
                if (!MUSIC_DATA || MUSIC_DATA.length === 0) {
                    nowPlayingEl.textContent = '⚠️ 暂无音乐';
                    return;
                }
                const track = MUSIC_DATA[currentIndex];
                if (!track || !track.url) {
                    nowPlayingEl.textContent = '⚠️ 无效曲目';
                    showError('曲目链接无效');
                    return;
                }

                if (audio.src && audio.src.includes(encodeURIComponent(track.url))) {
                    audio.play().then(() => {
                        isPlaying = true;
                        updateUI();
                    }).catch(err => {
                        showError('播放失败，请重试');
                        isPlaying = false;
                        updateUI();
                    });
                    nowPlayingEl.textContent = `🎵 ${track.name || '未命名'}`;
                    updatePlaylistActive();
                    return;
                }

                audio.src = track.url;
                audio.load();
                audio.play().then(() => {
                    isPlaying = true;
                    updateUI();
                }).catch(err => {
                    showError('播放失败，请点击播放按钮重试');
                    isPlaying = false;
                    updateUI();
                });
                nowPlayingEl.textContent = `🎵 ${track.name || '未命名'}`;
                updatePlaylistActive();
            }

            function togglePlay() {
                hideError();
                if (!MUSIC_DATA || MUSIC_DATA.length === 0) return;
                if (!audio.src || audio.ended) {
                    playCurrent();
                    return;
                }
                if (audio.paused) {
                    audio.play().then(() => {
                        isPlaying = true;
                        updateUI();
                        hideError();
                    }).catch(e => {
                        showError('播放失败，请重试');
                        isPlaying = false;
                        updateUI();
                    });
                } else {
                    audio.pause();
                    isPlaying = false;
                    updateUI();
                }
                updatePlaylistActive();
            }

            function nextTrack() {
                hideError();
                if (!MUSIC_DATA || MUSIC_DATA.length === 0) return;
                if (mode === 'random') {
                    let newIdx = Math.floor(Math.random() * MUSIC_DATA.length);
                    while (MUSIC_DATA.length > 1 && newIdx === currentIndex) {
                        newIdx = Math.floor(Math.random() * MUSIC_DATA.length);
                    }
                    currentIndex = newIdx;
                } else {
                    currentIndex = (currentIndex + 1) % MUSIC_DATA.length;
                }
                playCurrent();
            }

            function prevTrack() {
                hideError();
                if (!MUSIC_DATA || MUSIC_DATA.length === 0) return;
                if (mode === 'random') {
                    let newIdx = Math.floor(Math.random() * MUSIC_DATA.length);
                    while (MUSIC_DATA.length > 1 && newIdx === currentIndex) {
                        newIdx = Math.floor(Math.random() * MUSIC_DATA.length);
                    }
                    currentIndex = newIdx;
                } else {
                    currentIndex = (currentIndex - 1 + MUSIC_DATA.length) % MUSIC_DATA.length;
                }
                playCurrent();
            }

            function updateUI() {
                playBtn.textContent = isPlaying ? '⏸' : '▶';
                const modeMap = { 'order': '🔁 顺序', 'loop': '🔂 单曲', 'random': '🎲 随机' };
                modeBtn.textContent = modeMap[mode] || '🔁 顺序';
                updatePlaylistActive();

                if (audio.duration && !isNaN(audio.duration) && isFinite(audio.duration)) {
                    const percent = (audio.currentTime / audio.duration) * 100;
                    if (!isDragging) progressSlider.value = percent;
                    durationDisplay.textContent = formatTime(audio.duration);
                } else {
                    durationDisplay.textContent = '0:00';
                }
                currentTimeDisplay.textContent = formatTime(audio.currentTime);
            }

            function formatTime(sec) {
                if (!sec || isNaN(sec) || !isFinite(sec)) return '0:00';
                const m = Math.floor(sec / 60);
                const s = Math.floor(sec % 60);
                return `${m}:${s.toString().padStart(2, '0')}`;
            }

            function cycleMode() {
                const modes = ['order', 'loop', 'random'];
                const idx = modes.indexOf(mode);
                mode = modes[(idx + 1) % modes.length];
                updateUI();
            }

            // ----- 事件绑定 -----
            playBtn.addEventListener('click', togglePlay);
            prevBtn.addEventListener('click', prevTrack);
            nextBtn.addEventListener('click', nextTrack);
            modeBtn.addEventListener('click', cycleMode);

            progressSlider.addEventListener('input', function() {
                isDragging = true;
                if (audio.duration && !isNaN(audio.duration) && isFinite(audio.duration)) {
                    const val = parseFloat(this.value);
                    const newTime = (val / 100) * audio.duration;
                    currentTimeDisplay.textContent = formatTime(newTime);
                }
            });
            progressSlider.addEventListener('change', function() {
                isDragging = false;
                if (audio.duration && !isNaN(audio.duration) && isFinite(audio.duration)) {
                    const val = parseFloat(this.value);
                    audio.currentTime = (val / 100) * audio.duration;
                }
                updateUI();
            });

            audio.addEventListener('timeupdate', function() {
                if (!isDragging && audio.duration && !isNaN(audio.duration) && isFinite(audio.duration)) {
                    const percent = (audio.currentTime / audio.duration) * 100;
                    progressSlider.value = percent;
                    currentTimeDisplay.textContent = formatTime(audio.currentTime);
                    durationDisplay.textContent = formatTime(audio.duration);
                }
            });

            audio.addEventListener('ended', function() {
                if (mode === 'loop') {
                    audio.currentTime = 0;
                    audio.play().catch(() => {});
                } else {
                    nextTrack();
                }
                setTimeout(updateUI, 100);
            });

            audio.addEventListener('loadedmetadata', function() { updateUI(); });

            audio.addEventListener('error', function(e) {
                showError('加载失败，请检查网络或链接');
                isPlaying = false;
                updateUI();
            });

            listToggleBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                playlistPopup.classList.toggle('show');
                if (playlistPopup.classList.contains('show')) renderPlaylist();
            });
            document.addEventListener('click', function(e) {
                if (!e.target.closest('.player-container')) {
                    playlistPopup.classList.remove('show');
                }
            });

            // ----- 初始化 -----
            if (MUSIC_DATA && MUSIC_DATA.length > 0) {
                currentIndex = 0;
                const firstTrack = MUSIC_DATA[0];
                nowPlayingEl.textContent = `🎵 ${firstTrack.name || '未命名'}`;
                audio.src = firstTrack.url;
                audio.load();

                setTimeout(() => {
                    audio.play().then(() => {
                        isPlaying = true;
                        updateUI();
                        hideError();
                    }).catch(() => {
                        isPlaying = false;
                        updateUI();
                        nowPlayingEl.textContent = `🎵 ${firstTrack.name || '未命名'} (点击播放)`;
                    });
                }, 300);

                renderPlaylist();
                updateUI();
            } else {
                nowPlayingEl.textContent = '🎵 无音乐数据';
                renderPlaylist();
                updateUI();
            }

            console.log('🎵 播放器已初始化，音乐数量:', MUSIC_DATA ? MUSIC_DATA.length : 0);
            window.__player = { audio, currentIndex, playCurrent, togglePlay, nextTrack, prevTrack, MUSIC_DATA };
        })();
    </script>

</body>
</html>
