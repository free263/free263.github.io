<!DOCTYPE html>
<html lang="en" >
<head>
<meta charset="UTF-8">
<title>CSS3卡通鲨鱼船底游动特效 + 音乐播放器</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="css/style.css">

<style>
/* 保持原有样式不变，补充播放器样式 + 进度条 */
body {
  margin: 0;
  padding: 0;
  min-height: 100vh;
  background: #1a2a3a; /* 深海背景色 */
  overflow: hidden;
  position: relative;
}
html, body {
  width: 100%;
  height: 100%;
}

/* 原动画元素使用绝对定位，已在 style.css 中定义，无需额外调整 */

/* 播放器容器 - 绝对定位居中 */
.player-wrapper {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 90%;
  max-width: 340px;
  z-index: 20;
  pointer-events: none;
}
.player-card {
  background: rgba(20, 20, 30, 0.45);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-radius: 28px;
  padding: 18px 18px 20px;
  box-shadow: 0 12px 30px rgba(0, 0, 0, 0.6);
  border: 1px solid rgba(255, 255, 255, 0.15);
  color: #f0f0f0;
  font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  pointer-events: auto;
  transition: all 0.2s;
  text-align: center;
}
.player-card .song-name {
  font-size: 1rem;
  font-weight: 500;
  letter-spacing: 0.3px;
  margin-bottom: 8px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  padding: 0 4px;
  color: #fff;
  text-shadow: 0 1px 4px rgba(0,0,0,0.3);
}

/* ----- 进度条样式 ----- */
.progress-wrapper {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  margin-bottom: 12px;
  font-size: 0.7rem;
  color: rgba(255,255,255,0.7);
}
.progress-bar-bg {
  flex: 1;
  height: 4px;
  background: rgba(255,255,255,0.2);
  border-radius: 20px;
  cursor: pointer;
  position: relative;
  transition: height 0.1s;
}
.progress-bar-bg:hover {
  height: 6px;
  background: rgba(255,255,255,0.3);
}
.progress-fill {
  width: 0%;
  height: 100%;
  background: linear-gradient(90deg, #f9d976, #f39f86);
  border-radius: 20px;
  transition: width 0.05s linear;
  box-shadow: 0 0 8px rgba(243, 159, 134, 0.4);
}
.time-current, .time-duration {
  min-width: 32px;
  font-variant-numeric: tabular-nums;
  font-size: 0.65rem;
}
/* ----- 控件 ----- */
.player-controls {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  margin-bottom: 6px;
}
.player-controls button {
  background: rgba(255, 255, 255, 0.08);
  border: none;
  border-radius: 40px;
  width: 40px;
  height: 40px;
  font-size: 20px;
  color: #f0f0f0;
  cursor: pointer;
  backdrop-filter: blur(4px);
  background: rgba(255, 255, 255, 0.1);
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
  transition: 0.2s;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  line-height: 1;
}
.player-controls button:hover {
  background: rgba(255, 255, 255, 0.25);
  transform: scale(1.02);
}
.player-controls button:active {
  transform: scale(0.94);
}
.player-controls .play-btn {
  width: 52px;
  height: 52px;
  font-size: 26px;
  background: rgba(255, 215, 100, 0.2);
  border: 1px solid rgba(255, 215, 100, 0.2);
}
.player-controls .play-btn:hover {
  background: rgba(255, 215, 100, 0.35);
}
.mode-area {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  font-size: 0.8rem;
  color: #ccc;
  margin-top: 2px;
}
.mode-area span {
  background: rgba(255,255,255,0.06);
  padding: 2px 14px;
  border-radius: 40px;
  font-size: 0.75rem;
  letter-spacing: 0.5px;
  border: 1px solid rgba(255,255,255,0.05);
  cursor: pointer;
  transition: 0.2s;
  user-select: none;
}
.mode-area span:hover {
  background: rgba(255,255,255,0.15);
}
.mode-area .mode-label {
  background: transparent;
  border: none;
  padding: 0 6px;
  cursor: default;
}
.mode-area .mode-label:hover {
  background: transparent;
}

.list-toggle {
  margin-top: 10px;
}
.list-toggle button {
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 30px;
  padding: 4px 18px;
  color: #ddd;
  font-size: 0.75rem;
  cursor: pointer;
  backdrop-filter: blur(2px);
  transition: 0.2s;
}
.list-toggle button:hover {
  background: rgba(255,255,255,0.15);
}
.music-list-container {
  margin-top: 12px;
  max-height: 160px;
  overflow-y: auto;
  border-radius: 16px;
  background: rgba(0, 0, 0, 0.25);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  padding: 6px 4px;
  scrollbar-width: thin;
  scrollbar-color: rgba(255,255,255,0.2) transparent;
  display: none;
}
.music-list-container.show {
  display: block;
}
.music-list-container::-webkit-scrollbar {
  width: 4px;
}
.music-list-container::-webkit-scrollbar-track {
  background: transparent;
}
.music-list-container::-webkit-scrollbar-thumb {
  background: rgba(255,255,255,0.2);
  border-radius: 10px;
}
.music-list-item {
  padding: 6px 12px;
  border-radius: 30px;
  font-size: 0.8rem;
  color: #ddd;
  cursor: pointer;
  transition: 0.15s;
  display: flex;
  align-items: center;
  gap: 6px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.music-list-item:hover {
  background: rgba(255,255,255,0.1);
  color: #fff;
}
.music-list-item.active {
  background: rgba(255, 215, 100, 0.2);
  color: #ffd764;
  font-weight: 500;
}
.music-list-item .index-badge {
  opacity: 0.5;
  font-size: 0.65rem;
  margin-right: 4px;
  min-width: 24px;
  text-align: right;
}
.music-list-item .item-name {
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
}
@media (max-width: 480px) {
  .player-card {
    padding: 14px 12px 16px;
  }
  .player-controls {
    gap: 8px;
  }
  .player-controls button {
    width: 34px;
    height: 34px;
    font-size: 16px;
  }
  .player-controls .play-btn {
    width: 44px;
    height: 44px;
    font-size: 22px;
  }
  .progress-wrapper { font-size: 0.6rem; gap: 0.3rem; }
}
</style>
</head>
<body>

<!-- 原动画元素 (保持不变) -->
<div class="boat"></div>
<div class="can">BEANS</div>
<div class="shark"></div>
<div class="bubbles"></div>

<!-- 音乐播放器 (毛玻璃居中) -->
<div class="player-wrapper">
  <div class="player-card">
    <div class="song-name" id="songNameDisplay">🎵 点击播放</div>

    <!-- 进度条 -->
    <div class="progress-wrapper">
      <span class="time-current" id="timeCurrent">0:00</span>
      <div class="progress-bar-bg" id="progressBarBg">
        <div class="progress-fill" id="progressFill" style="width:0%;"></div>
      </div>
      <span class="time-duration" id="timeDuration">0:00</span>
    </div>

    <div class="player-controls">
      <button id="prevBtn" title="上一首">⏮</button>
      <button class="play-btn" id="playBtn" title="播放/暂停">▶</button>
      <button id="nextBtn" title="下一首">⏭</button>
    </div>

    <div class="mode-area">
      <span class="mode-label" id="modeLabel">🔁 顺序</span>
      <span id="modeToggleBtn" title="切换模式">🔄</span>
    </div>

    <div class="list-toggle">
      <button id="toggleListBtn">📋 歌单</button>
    </div>

    <!-- 音乐列表 -->
    <div class="music-list-container" id="musicListContainer"></div>
  </div>
</div>

<!-- 引入 music.js -->
<script src="music.js"></script>
<script>
(function() {
  const audio = new Audio();
  let currentIndex = 0;
  let isPlaying = false;
  let playMode = 'order'; // 'order', 'shuffle', 'loop'
  let progressRAF = null;

  const listContainer = document.getElementById('musicListContainer');
  const songNameDisplay = document.getElementById('songNameDisplay');
  const playBtn = document.getElementById('playBtn');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const modeToggleBtn = document.getElementById('modeToggleBtn');
  const modeLabel = document.getElementById('modeLabel');
  const toggleListBtn = document.getElementById('toggleListBtn');

  // 进度条元素
  const progressFill = document.getElementById('progressFill');
  const timeCurrent = document.getElementById('timeCurrent');
  const timeDuration = document.getElementById('timeDuration');
  const progressBarBg = document.getElementById('progressBarBg');

  const musicData = typeof MUSIC_DATA !== 'undefined' ? MUSIC_DATA : [];

  // ----- 辅助函数 -----
  function formatSongName(item) {
    return item.name || '未知歌曲';
  }
  function formatTime(seconds) {
    if (isNaN(seconds) || !isFinite(seconds)) return '0:00';
    const m = Math.floor(seconds / 60);
    const s = Math.floor(seconds % 60);
    return m + ':' + (s < 10 ? '0' : '') + s;
  }

  function updateProgress() {
    if (!audio.duration || isNaN(audio.duration)) {
      progressFill.style.width = '0%';
      timeCurrent.textContent = '0:00';
      timeDuration.textContent = '0:00';
      return;
    }
    const pct = (audio.currentTime / audio.duration) * 100;
    progressFill.style.width = Math.min(pct, 100) + '%';
    timeCurrent.textContent = formatTime(audio.currentTime);
    timeDuration.textContent = formatTime(audio.duration);
  }

  function startProgressLoop() {
    if (progressRAF) cancelAnimationFrame(progressRAF);
    function tick() {
      updateProgress();
      progressRAF = requestAnimationFrame(tick);
    }
    tick();
  }
  function stopProgressLoop() {
    if (progressRAF) {
      cancelAnimationFrame(progressRAF);
      progressRAF = null;
    }
  }

  // ----- 核心控制 -----
  function loadSong(index) {
    if (!musicData.length) return;
    const safeIndex = (index + musicData.length) % musicData.length;
    currentIndex = safeIndex;
    const item = musicData[safeIndex];
    audio.src = item.url;
    audio.load();
    songNameDisplay.textContent = '🎵 ' + formatSongName(item);
    // 重置进度显示
    progressFill.style.width = '0%';
    timeCurrent.textContent = '0:00';
    if (audio.duration) timeDuration.textContent = formatTime(audio.duration);
    else timeDuration.textContent = '0:00';
    updateListActive();
    if (isPlaying) {
      audio.play().catch(() => {});
      startProgressLoop();
    } else {
      stopProgressLoop();
    }
  }

  function playPause() {
    if (!musicData.length) return;
    if (audio.paused) {
      audio.play().catch(() => {});
      isPlaying = true;
      playBtn.textContent = '⏸';
      startProgressLoop();
    } else {
      audio.pause();
      isPlaying = false;
      playBtn.textContent = '▶';
      stopProgressLoop();
    }
  }

  function prevSong() {
    if (!musicData.length) return;
    let newIndex = currentIndex - 1;
    if (newIndex < 0) newIndex = musicData.length - 1;
    loadSong(newIndex);
    if (!isPlaying) {
      isPlaying = true;
      playBtn.textContent = '⏸';
      audio.play().catch(() => {});
      startProgressLoop();
    } else {
      audio.play().catch(() => {});
    }
  }

  function nextSong() {
    if (!musicData.length) return;
    let newIndex;
    if (playMode === 'shuffle') {
      newIndex = Math.floor(Math.random() * musicData.length);
      if (musicData.length > 1 && newIndex === currentIndex) {
        newIndex = (currentIndex + 1) % musicData.length;
      }
    } else {
      newIndex = (currentIndex + 1) % musicData.length;
    }
    loadSong(newIndex);
    if (!isPlaying) {
      isPlaying = true;
      playBtn.textContent = '⏸';
      audio.play().catch(() => {});
      startProgressLoop();
    } else {
      audio.play().catch(() => {});
    }
  }

  function toggleMode() {
    if (playMode === 'order') {
      playMode = 'shuffle';
      modeLabel.textContent = '🎲 随机';
    } else if (playMode === 'shuffle') {
      playMode = 'loop';
      modeLabel.textContent = '🔂 单曲循环';
    } else {
      playMode = 'order';
      modeLabel.textContent = '🔁 顺序';
    }
    audio.loop = (playMode === 'loop');
  }

  function renderList() {
    if (!listContainer) return;
    listContainer.innerHTML = '';
    if (!musicData.length) {
      listContainer.innerHTML = '<div style="padding:10px;color:#aaa;font-size:0.8rem;">暂无歌曲</div>';
      return;
    }
    musicData.forEach((item, idx) => {
      const div = document.createElement('div');
      div.className = 'music-list-item';
      if (idx === currentIndex) div.classList.add('active');
      div.innerHTML = `
        <span class="index-badge">${idx+1}</span>
        <span class="item-name">${formatSongName(item)}</span>
      `;
      div.addEventListener('click', function(e) {
        e.stopPropagation();
        if (idx === currentIndex && isPlaying) {
          playPause();
          return;
        }
        loadSong(idx);
        if (!isPlaying) {
          isPlaying = true;
          playBtn.textContent = '⏸';
          audio.play().catch(() => {});
          startProgressLoop();
        } else {
          audio.play().catch(() => {});
        }
      });
      listContainer.appendChild(div);
    });
  }

  function updateListActive() {
    const items = listContainer.querySelectorAll('.music-list-item');
    items.forEach((el, idx) => {
      el.classList.toggle('active', idx === currentIndex);
    });
    const activeItem = listContainer.querySelector('.music-list-item.active');
    if (activeItem) {
      activeItem.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    }
  }

  function toggleList() {
    listContainer.classList.toggle('show');
    if (listContainer.classList.contains('show')) {
      updateListActive();
    }
  }

  // ----- 事件绑定 -----
  playBtn.addEventListener('click', playPause);
  prevBtn.addEventListener('click', prevSong);
  nextBtn.addEventListener('click', nextSong);
  modeToggleBtn.addEventListener('click', toggleMode);
  toggleListBtn.addEventListener('click', toggleList);

  // 进度条点击跳转
  progressBarBg.addEventListener('click', function(e) {
    if (!audio.duration || isNaN(audio.duration)) return;
    const rect = this.getBoundingClientRect();
    const pct = (e.clientX - rect.left) / rect.width;
    audio.currentTime = pct * audio.duration;
    updateProgress();
  });

  audio.addEventListener('ended', function() {
    if (playMode === 'loop') return;
    nextSong();
  });

  audio.addEventListener('loadedmetadata', function() {
    timeDuration.textContent = formatTime(audio.duration);
    updateProgress();
  });

  // 初始化
  function initPlayer() {
    if (musicData.length) {
      loadSong(0);
      isPlaying = false;
      playBtn.textContent = '▶';
      audio.pause();
      stopProgressLoop();
    } else {
      songNameDisplay.textContent = '🎵 无音乐';
    }
    renderList();
    modeLabel.textContent = '🔁 顺序';
    audio.loop = false;
    // 点击外部关闭歌单
    document.addEventListener('click', function(e) {
      const wrapper = document.querySelector('.player-wrapper');
      if (wrapper && !wrapper.contains(e.target)) {
        if (listContainer.classList.contains('show')) {
          listContainer.classList.remove('show');
        }
      }
    });
    // 初始进度
    timeDuration.textContent = '0:00';
    timeCurrent.textContent = '0:00';
    progressFill.style.width = '0%';
  }

  initPlayer();
})();
</script>
</body>
</html>
