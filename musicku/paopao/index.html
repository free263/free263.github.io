    .content li {

    /* 播放器容器 – 毛玻璃半透明 + 居中 */
    .music-player {

      display: flex;

      margin-bottom: 14px;
      font-size: 0.7rem;
      color: rgba(255,255,255,0.7);

      flex: 1;
      height: 4px;

      height: 6px;

      background: rgba(200, 200, 255, 0.25);

      cursor: pointer;

    }
    .list-toggle button:hover {

    .music-list-container {

      width: 4px;

      background: transparent;

    .music-list-item {
      padding: 6px 12px;

    }

    function nextSong() {
      if (!musicData.length) return;
      let newIndex;
      if (mode === 'shuffle') {
        newIndex = Math.floor(Math.random() * musicData.length);
        if (musicData.length > 1 && newIndex === currentIndex) {
          newIndex = (currentIndex + 1) % musicData.length;
        }
      } else {
        newIndex = (currentIndex + 1) % musicData.length;
      }
      loadSong(newIndex);
      if (!isPlaying) {
        isPlaying = true;
        playBtn.textContent = '⏸';
        audio.play().catch(() => {});
        startProgressLoop();
      } else {
        audio.play().catch(() => {});
      }
    }

    function toggleMode() {
      const modes = ['loop', 'single', 'shuffle'];
      const icons = ['🔁', '🔂', '🎲'];
      let idx = modes.indexOf(mode);
      idx = (idx + 1) % modes.length;
      mode = modes[idx];
      modeBtn.textContent = icons[idx];
      audio.loop = (mode === 'single');
    }

    // 渲染列表
    function renderList() {
      if (!listContainer) return;
      listContainer.innerHTML = '';
      if (!musicData.length) {
        listContainer.innerHTML = '<div style="padding:10px;color:#aaa;font-size:0.8rem;">暂无歌曲</div>';
        return;
      }
      musicData.forEach((item, idx) => {
        const div = document.createElement('div');
        div.className = 'music-list-item';
        if (idx === currentIndex) div.classList.add('active');
        div.innerHTML = `
          <span class="index-badge">${idx+1}</span>
          <span class="item-name">${formatSongName(item)}</span>
        `;
        div.addEventListener('click', function(e) {
          e.stopPropagation();
          if (idx === currentIndex && isPlaying) {
            playPause();
            return;
          }
          loadSong(idx);
          if (!isPlaying) {
            isPlaying = true;
            playBtn.textContent = '⏸';
            audio.play().catch(() => {});
            startProgressLoop();
          } else {
            audio.play().catch(() => {});
          }
        });
        listContainer.appendChild(div);
      });
    }

    function updateListActive() {
      const items = listContainer.querySelectorAll('.music-list-item');
      items.forEach((el, idx) => {
        el.classList.toggle('active', idx === currentIndex);
      });
      const activeItem = listContainer.querySelector('.music-list-item.active');
      if (activeItem) {
        activeItem.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
      }
    }

    function toggleList() {
      listOpen = !listOpen;
      listContainer.classList.toggle('show', listOpen);
      if (listOpen) updateListActive();
    }

    // ----- 事件绑定 -----
    playBtn.addEventListener('click', playPause);
    prevBtn.addEventListener('click', prevSong);
    nextBtn.addEventListener('click', nextSong);
    modeBtn.addEventListener('click', toggleMode);
    toggleListBtn.addEventListener('click', toggleList);

    // 进度条点击跳转
    progressBarBg.addEventListener('click', function(e) {
      if (!audio.duration || isNaN(audio.duration)) return;
      const rect = this.getBoundingClientRect();
      const pct = (e.clientX - rect.left) / rect.width;
      audio.currentTime = pct * audio.duration;
      updateProgress();
    });

    audio.addEventListener('loadedmetadata', function() {
      timeDuration.textContent = formatTime(audio.duration);
      updateProgress();
    });

    audio.addEventListener('ended', function() {
      if (mode === 'single') {
        audio.currentTime = 0;
        audio.play().catch(() => {});
        startProgressLoop();
        return;
      }
      nextSong();
    });

    // 点击外部关闭列表
    document.addEventListener('click', function(e) {
      const player = document.getElementById('musicPlayer');
      if (player && !player.contains(e.target)) {
        if (listContainer.classList.contains('show')) {
          listContainer.classList.remove('show');
          listOpen = false;
        }
      }
    });

    // 键盘快捷键
    document.addEventListener('keydown', function(e) {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
      if (e.key === ' ' || e.key === 'Space') {
        e.preventDefault();
        playPause();
      } else if (e.key === 'ArrowRight') {
        e.preventDefault();
        nextSong();
      } else if (e.key === 'ArrowLeft') {
        e.preventDefault();
        prevSong();
      }
    });

    // 初始化
    function initPlayer() {
      if (musicData.length) {
        loadSong(0);
        isPlaying = false;
        playBtn.textContent = '▶';
        audio.pause();
        stopProgressLoop();
      } else {
        songNameEl.textContent = '🎵 无音乐数据';
      }
      renderList();
      modeBtn.textContent = '🔁';
      mode = 'loop';
      audio.loop = false;
      timeDuration.textContent = '0:00';
      timeCurrent.textContent = '0:00';
      progressFill.style.width = '0%';
    }

    initPlayer();
    console.log('🎵 音乐播放器已启动，共 ' + musicData.length + ' 首歌曲');
  })();
</script>

</body></html>
