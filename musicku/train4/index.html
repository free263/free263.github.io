    <style>

            -webkit-animation: train-2 1000ms infinite linear;
                    animation: train-2 1000ms infinite linear;

        @media (prefers-reduced-motion) {

            background-image: radial-gradient(circle at 50% 100%, transparent 60%, #8b4513 60.5%), radial-gradient(circle at 50% 100%, transparent 60%, #cd853f 60.5%), linear-gradient(#cd853f, #cd853f), linear-gradient(to left, transparent 20%, #555 20%, #555 30%, transparent 30%, transparent 40%, #555 40%, #555 50%, transparent 50%, transparent 60%, #555 60%, #555 70%, transparent 70%, transparent 80%, #555 80%, #555 90%, transparent 90%), linear-gradient(to left, transparent 20%, #333 20%, #333 30%, transparent 30%, transparent 40%, #333 40%, #333 50%, transparent 50%, transparent 60%, #333 60%, #333 70%, transparent 70%, transparent 80%, #333 80%, #333 90%, transparent 90%), linear-gradient(to left, transparent 10%, #ffd700 10%), linear-gradient(to left, transparent 10%, #ffd700 10%), linear-gradient(to left, transparent 10%, #dc143c 10%), linear-gradient(to left, transparent 10%, #444 10%), linear-gradient(to left, transparent 45%, #444 45%, #444 65%, transparent 65%), radial-gradient(circle at 0.7em 50%, #333 0.4em, transparent 0.4em), radial-gradient(circle at 1.6em 50%, #333 0.4em, transparent 0.4em), radial-gradient(circle at 5.5em 50%, #333 0.4em, transparent 0.4em), radial-gradient(circle at 4.6em 50%, #333 0.4em, transparent 0.4em), radial-gradient(circle at right 15em top 45%, #ffffe0 3em, rgba(255,255,224,0) 3em), linear-gradient(-50deg, #6a5acd 30%, transparent 30%), linear-gradient(50deg, #6a5acd 40%, transparent 40%);
            background-size: 6em 3em, 6em 3em, 100% 0.4em, 7em 0.5em, 7em 1.2em, 7em 0.1em, 7em 0.1em, 7em 3em, 100% 0.2em, 7em 0.5em, 7em 2em, 7em 2em, 7em 2em, 7em 2em, 100% 35em, 100% 12em, 100% 10em;
            background-position: 100% 100%, right -0.5em bottom 0, right 0 bottom 3em, left 10em bottom 5.6em, left 10em bottom 4.9em, left 10em bottom 6.5em, left 10em bottom 4.5em, left 10em bottom 3.8em, left 0 bottom 3.8em, left 10em bottom 3.6em, left 10em bottom 2.7em, left 10em bottom 2.7em, left 10em bottom 2.7em, left 10em bottom 2.7em, 0 100%, right 9em bottom 0, 0 100%;
            -webkit-animation: train-1 1000ms infinite linear;

        }
        @media (prefers-reduced-motion) {
            #train:after {
                -webkit-animation: none;
                        animation: none;

        }
        @-webkit-keyframes train-1 {
            from {
                background-position: 100% 100%, right -0.5em bottom 0, right 0 bottom 3em, left 10em bottom 5.6em, left 10em bottom 4.9em, left 10em bottom 6.5em, left 10em bottom 4.5em, left 10em bottom 3.8em, left 0 bottom 3.8em, left 10em bottom 3.6em, left 10em bottom 2.7em, left 10em bottom 2.7em, left 10em bottom 2.7em, left 10em bottom 2.7em, 0 100%, right 9em bottom 0, 0 100%;

            }
            to {
                background-position: 100% 100%, right -0.5em bottom 0, right 0 bottom 3em, left 17em bottom 5.6em, left 17em bottom 4.9em, left 17em bottom 6.5em, left 17em bottom 4.5em, left 17em bottom 3.8em, left 7em bottom 3.8em, left 17em bottom 3.6em, left 17em bottom 2.7em, left 17em bottom 2.7em, left 17em bottom 2.7em, left 17em bottom 2.7em, 0 100%, right 9em bottom 0, 0 100%;

        @-webkit-keyframes train-2 {

        /* ---------- 音乐播放器 毛玻璃 最上层 居中 - 间距拉开 ---------- */
        .music-player {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 9999;
            width: 420px;
            max-width: 92vw;
            padding: 84px 24px 72px;
            background: rgba(20, 25, 40, 0.35);
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            border-radius: 56px;
            box-shadow: 0 30px 70px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.05);
            color: #f0f0f5;
            transition: all 0.2s ease;
            user-select: none;
            pointer-events: auto;
            text-align: left;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .player-title {
            text-align: center;
            font-size: 1.8rem;
            font-weight: 500;
            letter-spacing: 0.5px;
            padding: 0 6px 28px 6px;   /* 下边距增大，与进度条拉开距离 */
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            margin-bottom: 28px;        /* 与进度条拉开距离 */

        .player-title span {

        .player-title .song-name {

        }

        /* ===== 进度条区域 ===== */
        .player-progress {
            width: 100%;
            margin: 0 0 28px 0;         /* 下边距增大，与按钮拉开距离 */
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .player-progress .time-label {
            font-size: 1.1rem;
            color: rgba(255, 255, 255, 0.5);
            font-variant-numeric: tabular-nums;
            min-width: 3.2rem;
            text-align: center;
            font-weight: 400;
            letter-spacing: 0.3px;
        }
        .player-progress .time-label:first-child {
            text-align: right;
        }
        .player-progress .time-label:last-child {
            text-align: left;
        }
        .progress-track {
            flex: 1;
            height: 6px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 4px;
            cursor: pointer;
            position: relative;
            transition: height 0.2s;
            min-width: 40px;
        }
        .progress-track:hover {
            height: 10px;
            background: rgba(255, 255, 255, 0.15);
        }
        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #f9d976, #f39c12);
            border-radius: 4px;
            pointer-events: none;
            transition: width 0.05s linear;
            box-shadow: 0 0 14px rgba(243, 156, 18, 0.4);
        }

        /* 按钮容器 - 间距拉大 */
        .player-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 28px;               /* 按钮间距从18px增大到28px */
            flex-wrap: wrap;
            margin-top: 6px;
        }
        /* 按钮尺寸缩小为原来的50% */
        .ctrl-btn {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: #e8e8f0;
            width: 33px;
            height: 33px;

            display: flex;
            align-items: center;

        }
        .ctrl-btn:hover {

        }
        .ctrl-btn:active { transform: scale(0.94); }
        .ctrl-btn.play-btn {

            height: 43px;
            font-size: 1.4rem;
            background: rgba(255, 215, 100, 0.12);
            border-color: rgba(255, 215, 100, 0.2);

        }
        .ctrl-btn.play-btn:hover {

        .mode-btn {
            font-size: 0.6rem;

            border-color: rgba(255, 255, 255, 0.05);
            gap: 4px;
            height: 33px;
        }
        .mode-btn .mode-icon { margin-right: 4px; font-size: 0.7rem; }
        .mode-btn.active-mode {
            color: #ffe28c;
            border-color: rgba(255, 215, 100, 0.2);
            background: rgba(255, 215, 100, 0.08);
        }
        .list-toggle {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            color: #b0b0c8;
            width: 33px;
            height: 33px;
            border-radius: 30px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(4px);
        }
        .list-toggle:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
        }

        /* 播放列表 - 与按钮拉开距离 */
        .playlist-container {
            margin-top: 28px;          /* 与按钮拉开距离 */
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.35s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.25s;
            opacity: 0;
            border-radius: 28px;
            background: rgba(0, 0, 0, 0.25);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.03);
        }
        .playlist-container.open {
            max-height: 360px;
            opacity: 1;
            padding: 14px 6px 14px 14px;
            overflow-y: auto;
        }
        .playlist-container::-webkit-scrollbar {
            width: 4px;
        }
        .playlist-container::-webkit-scrollbar-track {
            background: rgba(255,255,255,0.02);
            border-radius: 10px;
        }
        .playlist-container::-webkit-scrollbar-thumb {
            background: rgba(255, 215, 100, 0.25);
            border-radius: 10px;
        }

        .playlist-item {
            display: flex;
            align-items: center;
            padding: 12px 20px;
            border-radius: 40px;
            margin-bottom: 4px;
            cursor: pointer;
            transition: 0.15s;
            color: #c0c0d8;
            font-size: 1.2rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .playlist-item:hover {
            background: rgba(255, 255, 255, 0.06);
            color: #fff;
        }
        .playlist-item.active-song {
            background: rgba(255, 215, 100, 0.1);
            color: #ffe28c;
            font-weight: 500;

        .playlist-item .index-num {

        @media (max-width: 480px) {
            .music-player { padding: 60px 16px 48px; border-radius: 36px; }
            .ctrl-btn { width: 25px; height: 25px; font-size: 0.7rem; }
            .ctrl-btn.play-btn { width: 32px; height: 32px; font-size: 1.1rem; }
            .player-title { font-size: 1.2rem; padding-bottom: 18px; margin-bottom: 18px; }
            .player-progress { margin-bottom: 18px; }
            .player-controls { gap: 18px; }
            .playlist-container { margin-top: 18px; }
            .playlist-item { font-size: 1rem; padding: 10px 14px; }
            .list-toggle { width: 25px; height: 25px; font-size: 0.7rem; }
            .mode-btn { font-size: 0.5rem; padding: 0 8px; height: 25px; }
            .mode-btn .mode-icon { font-size: 0.6rem; }
        }
    </style>

<body>

    <!-- 火车容器 (原样) -->
    <div id="train"></div>

    <!-- 音乐播放器 (毛玻璃，最上层居中，间距已拉开) -->
    <div class="music-player" id="musicPlayer">
        <div class="player-title" id="nowPlaying">
            <span>🎵</span> <span class="song-name" id="songNameDisplay">未选择</span>
        </div>

        <!-- 进度条 (歌曲名称下方) -->
        <div class="player-progress">
            <span class="time-label" id="timeCurrent">0:00</span>
            <div class="progress-track" id="progressTrack">
                <div class="progress-fill" id="progressFill" style="width:0%;"></div>
            </div>
            <span class="time-label" id="timeDuration">0:00</span>
        </div>

        <div class="player-controls">
            <button class="ctrl-btn" id="prevBtn" aria-label="上一首">⏮</button>
            <button class="ctrl-btn play-btn" id="playBtn" aria-label="播放/暂停">▶</button>
            <button class="ctrl-btn" id="nextBtn" aria-label="下一首">⏭</button>
            <button class="ctrl-btn mode-btn" id="modeBtn" aria-label="播放模式">
                <span class="mode-icon">🔁</span> <span id="modeLabel">列表循环</span>
            </button>
            <button class="list-toggle" id="listToggleBtn" aria-label="播放列表">📋</button>
        </div>

        <div class="playlist-container" id="playlistContainer">
            <div id="playlistItems"></div>
        </div>
    </div>

    <!-- 音乐数据 -->
    <script src="./music.js"></script>
    <script>
        (function() {
            // 安全检测 MUSIC_DATA
            if (typeof MUSIC_DATA === 'undefined' || !Array.isArray(MUSIC_DATA) || MUSIC_DATA.length === 0) {
                console.warn('MUSIC_DATA 未加载，使用占位数据');
                window.MUSIC_DATA = [
                    { name: '示例 · 起风了', url: 'https://www.example.com/dummy1.mp3' },
                    { name: '示例 · 光年之外', url: 'https://www.example.com/dummy2.mp3' }
                ];
            }

            const songNameDisplay = document.getElementById('songNameDisplay');
            const playBtn = document.getElementById('playBtn');
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');
            const modeBtn = document.getElementById('modeBtn');
            const modeLabel = document.getElementById('modeLabel');
            const listToggleBtn = document.getElementById('listToggleBtn');
            const playlistContainer = document.getElementById('playlistContainer');
            const playlistItems = document.getElementById('playlistItems');

            // 进度条 DOM
            const progressFill = document.getElementById('progressFill');
            const progressTrack = document.getElementById('progressTrack');
            const timeCurrent = document.getElementById('timeCurrent');
            const timeDuration = document.getElementById('timeDuration');

            let currentIndex = 0;
            let isPlaying = false;
            let mode = 'loop';
            let audio = null;
            let isPlaylistOpen = false;

            // ---------- 辅助函数 ----------
            function formatTime(seconds) {
                if (isNaN(seconds) || seconds === Infinity || seconds < 0) return '0:00';
                const mins = Math.floor(seconds / 60);
                const secs = Math.floor(seconds % 60);
                return mins + ':' + (secs < 10 ? '0' : '') + secs;
            }

            function updateProgress() {
                if (!audio || !audio.duration || isNaN(audio.duration)) {
                    progressFill.style.width = '0%';
                    timeCurrent.textContent = '0:00';
                    timeDuration.textContent = '0:00';
                    return;
                }
                const percent = (audio.currentTime / audio.duration) * 100;
                progressFill.style.width = Math.min(percent, 100) + '%';
                timeCurrent.textContent = formatTime(audio.currentTime);
                timeDuration.textContent = formatTime(audio.duration);
            }

            // 进度条点击跳转
            progressTrack.addEventListener('click', function(e) {
                if (!audio || !audio.duration || isNaN(audio.duration)) return;
                const rect = this.getBoundingClientRect();
                const clickX = e.clientX - rect.left;
                const ratio = Math.min(1, Math.max(0, clickX / rect.width));
                audio.currentTime = ratio * audio.duration;
                updateProgress();
            });

            function renderPlaylist() {
                const list = window.MUSIC_DATA || [];
                playlistItems.innerHTML = list.map((item, idx) => {
                    const activeClass = (idx === currentIndex) ? 'active-song' : '';
                    return `<div class="playlist-item ${activeClass}" data-index="${idx}">
                                <span class="index-num">${String(idx + 1).padStart(2, '0')}</span>
                                ${item.name || '未命名'}
                            </div>`;
                }).join('');
                document.querySelectorAll('.playlist-item').forEach(el => {
                    el.addEventListener('click', function() {
                        const index = parseInt(this.dataset.index, 10);
                        if (!isNaN(index) && index >= 0 && index < (window.MUSIC_DATA || []).length) {
                            playIndex(index);
                        }
                    });
                });
            }

            function updatePlaylistActive() {
                document.querySelectorAll('.playlist-item').forEach((el, idx) => {
                    el.classList.toggle('active-song', idx === currentIndex);
                });
            }

            function playIndex(index) {
                const list = window.MUSIC_DATA || [];
                if (!list.length || index < 0 || index >= list.length) return;
                currentIndex = index;
                const song = list[currentIndex];
                if (!song || !song.url) return;

                if (audio) {
                    audio.pause();
                    audio.src = '';
                    audio = null;
                }

                audio = new Audio(song.url);
                audio.preload = 'metadata';
                songNameDisplay.textContent = song.name || '未知歌曲';
                updatePlaylistActive();

                audio.play().then(() => {
                    isPlaying = true;
                    playBtn.textContent = '⏸';
                    updateProgress();
                }).catch(() => {
                    isPlaying = false;
                    playBtn.textContent = '▶';
                });

                audio.addEventListener('ended', handleSongEnd);
                audio.addEventListener('timeupdate', updateProgress);
                audio.addEventListener('loadedmetadata', function() {
                    timeDuration.textContent = formatTime(audio.duration);
                    updateProgress();
                });
                audio.addEventListener('pause', () => {
                    if (isPlaying) {
                        isPlaying = false;
                        playBtn.textContent = '▶';
                    }
                });
                audio.addEventListener('play', () => {
                    isPlaying = true;
                    playBtn.textContent = '⏸';
                });
            }

            function handleSongEnd() {
                const list = window.MUSIC_DATA || [];
                if (!list.length) return;
                if (mode === 'single') {
                    if (audio) { audio.currentTime = 0; audio.play().catch(() => {}); }
                    return;
                }
                if (mode === 'random') {
                    let newIndex = Math.floor(Math.random() * list.length);
                    while (list.length > 1 && newIndex === currentIndex) {
                        newIndex = Math.floor(Math.random() * list.length);
                    }
                    playIndex(newIndex);
                } else {
                    const next = (currentIndex + 1) % list.length;
                    playIndex(next);
                }
            }

            function togglePlay() {
                if (!audio) {
                    const list = window.MUSIC_DATA || [];
                    if (list.length) playIndex(currentIndex);
                    return;
                }
                if (isPlaying) {
                    audio.pause();
                    isPlaying = false;
                    playBtn.textContent = '▶';
                } else {
                    audio.play().then(() => {
                        isPlaying = true;
                        playBtn.textContent = '⏸';
                    }).catch(() => {
                        isPlaying = false;
                        playBtn.textContent = '▶';
                    });
                }
            }

            function cycleMode() {
                const modes = ['loop', 'random', 'single'];
                const icons = ['🔁', '🎲', '🔂'];
                const labels = ['列表循环', '随机播放', '单曲循环'];
                let idx = modes.indexOf(mode);
                idx = (idx + 1) % modes.length;
                mode = modes[idx];
                modeLabel.textContent = labels[idx];
                document.querySelector('.mode-icon').textContent = icons[idx];
                modeBtn.classList.toggle('active-mode', mode !== 'loop');
            }

            function togglePlaylist() {
                isPlaylistOpen = !isPlaylistOpen;
                playlistContainer.classList.toggle('open', isPlaylistOpen);
                listToggleBtn.textContent = isPlaylistOpen ? '✕' : '📋';
            }

            function prevSong() {
                const list = window.MUSIC_DATA || [];
                if (!list.length) return;
                if (mode === 'random') {
                    let newIndex = Math.floor(Math.random() * list.length);
                    while (list.length > 1 && newIndex === currentIndex) {
                        newIndex = Math.floor(Math.random() * list.length);
                    }
                    playIndex(newIndex);
                } else {
                    const prev = (currentIndex - 1 + list.length) % list.length;
                    playIndex(prev);
                }
            }

            function nextSong() {
                const list = window.MUSIC_DATA || [];
                if (!list.length) return;
                if (mode === 'random') {
                    let newIndex = Math.floor(Math.random() * list.length);
                    while (list.length > 1 && newIndex === currentIndex) {
                        newIndex = Math.floor(Math.random() * list.length);
                    }
                    playIndex(newIndex);
                } else {
                    const next = (currentIndex + 1) % list.length;
                    playIndex(next);
                }
            }

            function init() {
                renderPlaylist();
                const list = window.MUSIC_DATA || [];
                if (list.length) {
                    songNameDisplay.textContent = list[0].name || '未知歌曲';
                    currentIndex = 0;
                    audio = new Audio(list[0].url);
                    audio.preload = 'metadata';
                    audio.addEventListener('timeupdate', updateProgress);
                    audio.addEventListener('loadedmetadata', function() {
                        timeDuration.textContent = formatTime(audio.duration);
                        updateProgress();
                    });
                    audio.addEventListener('ended', handleSongEnd);
                } else {
                    songNameDisplay.textContent = '无歌曲';
                }

                playBtn.addEventListener('click', togglePlay);
                prevBtn.addEventListener('click', prevSong);
                nextBtn.addEventListener('click', nextSong);
                modeBtn.addEventListener('click', cycleMode);
                listToggleBtn.addEventListener('click', togglePlaylist);

                modeLabel.textContent = '列表循环';
                document.querySelector('.mode-icon').textContent = '🔁';
                updatePlaylistActive();
                updateProgress();

                if (audio) {
                    audio.onerror = () => {
                        songNameDisplay.textContent = '⚠️ 加载失败';
                    };
                }
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }
        })();
    </script>
</body>
</html>
