<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>火车动画 · 毛玻璃音乐播放器</title>
    <!-- 完全保留原火车样式 (style.css) 和重置 (reset.min.css) 合并 -->
    <style>
        /* reset.min.css 原样 */
        html,body,div,span,applet,object,iframe,h1,h2,h3,h4,h5,h6,p,blockquote,pre,a,abbr,acronym,address,big,cite,code,del,dfn,em,img,ins,kbd,q,s,samp,small,strike,strong,sub,sup,tt,var,b,u,i,center,dl,dt,dd,ol,ul,li,fieldset,form,label,legend,table,caption,tbody,tfoot,thead,tr,th,td,article,aside,canvas,details,embed,figure,figcaption,footer,header,hgroup,menu,nav,output,ruby,section,summary,time,mark,audio,video{margin:0;padding:0;border:0;font-size:100%;font:inherit;vertical-align:baseline}article,aside,details,figcaption,figure,footer,header,hgroup,menu,nav,section{display:block}body{line-height:1}ol,ul{list-style:none}blockquote,q{quotes:none}blockquote:before,blockquote:after,q:before,q:after{content:'';content:none}table{border-collapse:collapse;border-spacing:0}

        /* style.css 原样 (火车) */
        body {
            height: 100vh;
            position: relative;
            background-color: #9370db;
            text-align: center;
            overflow: hidden;
        }
        div {
            position: absolute;
        }
        div:before,
        div:after {
            display: block;
            content: '';
            position: absolute;
        }
        #train {
            width: 60%;
            height: 100%;
            top: auto;
            left: auto;
            right: 0;
            bottom: 0;
            background-repeat: no-repeat, no-repeat, repeat-x, repeat-x, repeat-x, repeat, repeat, repeat, repeat, repeat, no-repeat;
            background-image: linear-gradient(to right, #ccc 11em, #999 11em, #999 12em, transparent 12em), linear-gradient(to bottom, #dc143c 20%, #ffd700 20%, #ffd700 40%, #20b2aa 40%, #20b2aa 60%, #1e90ff 60%, #1e90ff 80%, #da70d6 80%), linear-gradient(to left, #aaa 2%, #555 2%), linear-gradient(to left, #888 2%, #333 2%), linear-gradient(to left, #444 2%, #c0c0c0 2%), radial-gradient(circle at 40% 20%, rgba(255,255,255,0.4) 0.1em, rgba(255,255,255,0) 0.11em), radial-gradient(circle at 80% 30%, rgba(255,255,255,0.4) 0.1em, rgba(255,255,255,0) 0.11em), radial-gradient(circle at 20% 60%, rgba(255,255,255,0.4) 0.1em, rgba(255,255,255,0) 0.11em), radial-gradient(circle at 60% 50%, rgba(255,255,255,0.8) 0.1em, rgba(255,255,255,0) 0.11em), radial-gradient(circle at 50% 50%, rgba(255,255,255,0.6) 0.1em, rgba(255,255,255,0) 0.11em), linear-gradient(black, black);
            background-size: 100% 100%, 100% 1.5em, 7em 0.5em, 7em 1.3em, 7em 3em, 50% 55%, 50% 60%, 50% 60%, 50% 60%, 90% 100%, 100% 100%;
            background-position: 0 0, right 0 bottom 1.8em, right 2em bottom 5.9em, right 2em bottom 5em, right 2em bottom 3.8em, 9em 0, 9em 0, 9em 0, 9em 0, 9em 0, 0 0;
            -webkit-animation: train-2 1000ms infinite linear;
                    animation: train-2 1000ms infinite linear;
        }
        @media (prefers-reduced-motion) {
            #train {
                -webkit-animation: none;
                        animation: none;
            }
        }
        @media screen and (max-width: 700px) {
            #train {
                font-size: 12px;
            }
        }
        @media screen and (max-width: 450px) {
            #train {
                width: 70%;
                font-size: 10px;
            }
        }
        @media screen and (min-width: 950px) and (min-height: 600px) {
            #train {
                font-size: 20px;
            }
        }
        #train:before {
            width: 8em;
            height: 15em;
            left: 1em;
            bottom: 0;
            background-color: #483d8b;
            border-radius: 5em 5em 0 0;
            box-shadow: inset 1.2em 0 0 rgba(255,255,255,0.2);
        }
        #train:after {
            width: 120%;
            height: 100%;
            right: 100%;
            margin-right: -9em;
            background-repeat: repeat-x;
            background-image: radial-gradient(circle at 50% 100%, transparent 60%, #8b4513 60.5%), radial-gradient(circle at 50% 100%, transparent 60%, #cd853f 60.5%), linear-gradient(#cd853f, #cd853f), linear-gradient(to left, transparent 20%, #555 20%, #555 30%, transparent 30%, transparent 40%, #555 40%, #555 50%, transparent 50%, transparent 60%, #555 60%, #555 70%, transparent 70%, transparent 80%, #555 80%, #555 90%, transparent 90%), linear-gradient(to left, transparent 20%, #333 20%, #333 30%, transparent 30%, transparent 40%, #333 40%, #333 50%, transparent 50%, transparent 60%, #333 60%, #333 70%, transparent 70%, transparent 80%, #333 80%, #333 90%, transparent 90%), linear-gradient(to left, transparent 10%, #ffd700 10%), linear-gradient(to left, transparent 10%, #ffd700 10%), linear-gradient(to left, transparent 10%, #dc143c 10%), linear-gradient(to left, transparent 10%, #444 10%), linear-gradient(to left, transparent 45%, #444 45%, #444 65%, transparent 65%), radial-gradient(circle at 0.7em 50%, #333 0.4em, transparent 0.4em), radial-gradient(circle at 1.6em 50%, #333 0.4em, transparent 0.4em), radial-gradient(circle at 5.5em 50%, #333 0.4em, transparent 0.4em), radial-gradient(circle at 4.6em 50%, #333 0.4em, transparent 0.4em), radial-gradient(circle at right 15em top 45%, #ffffe0 3em, rgba(255,255,224,0) 3em), linear-gradient(-50deg, #6a5acd 30%, transparent 30%), linear-gradient(50deg, #6a5acd 40%, transparent 40%);
            background-size: 6em 3em, 6em 3em, 100% 0.4em, 7em 0.5em, 7em 1.2em, 7em 0.1em, 7em 0.1em, 7em 3em, 100% 0.2em, 7em 0.5em, 7em 2em, 7em 2em, 7em 2em, 7em 2em, 100% 35em, 100% 12em, 100% 10em;
            background-position: 100% 100%, right -0.5em bottom 0, right 0 bottom 3em, left 10em bottom 5.6em, left 10em bottom 4.9em, left 10em bottom 6.5em, left 10em bottom 4.5em, left 10em bottom 3.8em, left 0 bottom 3.8em, left 10em bottom 3.6em, left 10em bottom 2.7em, left 10em bottom 2.7em, left 10em bottom 2.7em, left 10em bottom 2.7em, 0 100%, right 9em bottom 0, 0 100%;
            -webkit-animation: train-1 1000ms infinite linear;
                    animation: train-1 1000ms infinite linear;
        }
        @media (prefers-reduced-motion) {
            #train:after {
                -webkit-animation: none;
                        animation: none;
            }
        }
        @-webkit-keyframes train-1 {
            from {
                background-position: 100% 100%, right -0.5em bottom 0, right 0 bottom 3em, left 10em bottom 5.6em, left 10em bottom 4.9em, left 10em bottom 6.5em, left 10em bottom 4.5em, left 10em bottom 3.8em, left 0 bottom 3.8em, left 10em bottom 3.6em, left 10em bottom 2.7em, left 10em bottom 2.7em, left 10em bottom 2.7em, left 10em bottom 2.7em, 0 100%, right 9em bottom 0, 0 100%;
            }
            to {
                background-position: 100% 100%, right -0.5em bottom 0, right 0 bottom 3em, left 17em bottom 5.6em, left 17em bottom 4.9em, left 17em bottom 6.5em, left 17em bottom 4.5em, left 17em bottom 3.8em, left 7em bottom 3.8em, left 17em bottom 3.6em, left 17em bottom 2.7em, left 17em bottom 2.7em, left 17em bottom 2.7em, left 17em bottom 2.7em, 0 100%, right 9em bottom 0, 0 100%;
            }
        }
        @keyframes train-1 {
            from {
                background-position: 100% 100%, right -0.5em bottom 0, right 0 bottom 3em, left 10em bottom 5.6em, left 10em bottom 4.9em, left 10em bottom 6.5em, left 10em bottom 4.5em, left 10em bottom 3.8em, left 0 bottom 3.8em, left 10em bottom 3.6em, left 10em bottom 2.7em, left 10em bottom 2.7em, left 10em bottom 2.7em, left 10em bottom 2.7em, 0 100%, right 9em bottom 0, 0 100%;
            }
            to {
                background-position: 100% 100%, right -0.5em bottom 0, right 0 bottom 3em, left 17em bottom 5.6em, left 17em bottom 4.9em, left 17em bottom 6.5em, left 17em bottom 4.5em, left 17em bottom 3.8em, left 7em bottom 3.8em, left 17em bottom 3.6em, left 17em bottom 2.7em, left 17em bottom 2.7em, left 17em bottom 2.7em, left 17em bottom 2.7em, 0 100%, right 9em bottom 0, 0 100%;
            }
        }
        @-webkit-keyframes train-2 {
            from {
                background-position: 0 0, right 0 bottom 1.8em, right 2em bottom 5.9em, right 2em bottom 5em, right 2em bottom 3.8em, 9em 0, 9em 0, 9em 0, 9em 0, 9em 0, 0 0;
            }
            to {
                background-position: 0 0, right 0 bottom 1.8em, right -5em bottom 5.9em, right -5em bottom 5em, right -5em bottom 3.8em, 9em 0, 9em 0, 9em 0, 9em 0, 9em 0, 0 0;
            }
        }
        @keyframes train-2 {
            from {
                background-position: 0 0, right 0 bottom 1.8em, right 2em bottom 5.9em, right 2em bottom 5em, right 2em bottom 3.8em, 9em 0, 9em 0, 9em 0, 9em 0, 9em 0, 0 0;
            }
            to {
                background-position: 0 0, right 0 bottom 1.8em, right -5em bottom 5.9em, right -5em bottom 5em, right -5em bottom 3.8em, 9em 0, 9em 0, 9em 0, 9em 0, 9em 0, 0 0;
            }
        }

        /* ---------- 音乐播放器 毛玻璃 最上层 居中 ---------- */
        .music-player {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 9999;
            width: 420px;
            max-width: 92vw;
            padding: 28px 24px 24px;
            background: rgba(20, 25, 40, 0.35);
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            border-radius: 56px;
            box-shadow: 0 30px 70px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.05);
            color: #f0f0f5;
            transition: all 0.2s ease;
            user-select: none;
            pointer-events: auto;
            text-align: left;
        }

        .player-title {
            text-align: center;
            font-size: 1.05rem;
            font-weight: 500;
            letter-spacing: 0.3px;
            padding: 0 6px 14px 6px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            margin-bottom: 16px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: rgba(255, 255, 255, 0.92);
            text-shadow: 0 2px 6px rgba(0,0,0,0.3);
        }
        .player-title span {
            opacity: 0.6;
            font-weight: 300;
            margin-right: 6px;
        }
        .player-title .song-name {
            opacity: 1;
            font-weight: 500;
        }

        .player-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .ctrl-btn {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: #e8e8f0;
            width: 44px;
            height: 44px;
            border-radius: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
            cursor: pointer;
            transition: all 0.2s;
            backdrop-filter: blur(4px);
            background: rgba(255, 255, 255, 0.03);
            box-shadow: 0 4px 14px rgba(0,0,0,0.3);
            outline: none;
        }
        .ctrl-btn:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.15);
            transform: scale(1.02);
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }
        .ctrl-btn:active { transform: scale(0.94); }
        .ctrl-btn.play-btn {
            width: 58px;
            height: 58px;
            font-size: 2rem;
            background: rgba(255, 215, 100, 0.12);
            border-color: rgba(255, 215, 100, 0.2);
            color: #ffe28c;
        }
        .ctrl-btn.play-btn:hover {
            background: rgba(255, 215, 100, 0.22);
        }
        .mode-btn {
            font-size: 0.85rem;
            letter-spacing: 0.2px;
            width: auto;
            padding: 0 14px;
            background: rgba(255, 255, 255, 0.03);
            color: #b0b0c8;
            border-color: rgba(255, 255, 255, 0.05);
            gap: 4px;
        }
        .mode-btn .mode-icon { margin-right: 4px; }
        .mode-btn.active-mode {
            color: #ffe28c;
            border-color: rgba(255, 215, 100, 0.2);
            background: rgba(255, 215, 100, 0.08);
        }
        .list-toggle {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            color: #b0b0c8;
            width: 44px;
            height: 44px;
            border-radius: 40px;
            font-size: 1.2rem;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(4px);
        }
        .list-toggle:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
        }

        .playlist-container {
            margin-top: 14px;
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.35s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.25s;
            opacity: 0;
            border-radius: 28px;
            background: rgba(0, 0, 0, 0.25);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.03);
        }
        .playlist-container.open {
            max-height: 280px;
            opacity: 1;
            padding: 10px 4px 10px 10px;
            overflow-y: auto;
        }
        .playlist-container::-webkit-scrollbar {
            width: 3px;
        }
        .playlist-container::-webkit-scrollbar-track {
            background: rgba(255,255,255,0.02);
            border-radius: 10px;
        }
        .playlist-container::-webkit-scrollbar-thumb {
            background: rgba(255, 215, 100, 0.25);
            border-radius: 10px;
        }

        .playlist-item {
            display: flex;
            align-items: center;
            padding: 8px 14px;
            border-radius: 30px;
            margin-bottom: 2px;
            cursor: pointer;
            transition: 0.15s;
            color: #c0c0d8;
            font-size: 0.9rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .playlist-item:hover {
            background: rgba(255, 255, 255, 0.06);
            color: #fff;
        }
        .playlist-item.active-song {
            background: rgba(255, 215, 100, 0.1);
            color: #ffe28c;
            font-weight: 500;
        }
        .playlist-item .index-num {
            opacity: 0.4;
            margin-right: 12px;
            font-size: 0.7rem;
            min-width: 24px;
        }

        .player-progress {
            margin-top: 14px;
            height: 2px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 10px;
            width: 100%;
            position: relative;
        }
        .player-progress .bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #ffd764, #f7b731);
            border-radius: 10px;
            transition: width 0.25s;
        }

        @media (max-width: 480px) {
            .music-player { padding: 20px 16px; border-radius: 36px; }
            .ctrl-btn { width: 38px; height: 38px; font-size: 1rem; }
            .ctrl-btn.play-btn { width: 50px; height: 50px; font-size: 1.6rem; }
            .player-title { font-size: 0.9rem; }
        }
    </style>
</head>
<body>

    <!-- 火车容器 (原样) -->
    <div id="train"></div>

    <!-- 音乐播放器 (毛玻璃，最上层居中) -->
    <div class="music-player" id="musicPlayer">
        <div class="player-title" id="nowPlaying">
            <span>🎵</span> <span class="song-name" id="songNameDisplay">未选择</span>
        </div>

        <div class="player-controls">
            <button class="ctrl-btn" id="prevBtn" aria-label="上一首">⏮</button>
            <button class="ctrl-btn play-btn" id="playBtn" aria-label="播放/暂停">▶</button>
            <button class="ctrl-btn" id="nextBtn" aria-label="下一首">⏭</button>
            <button class="ctrl-btn mode-btn" id="modeBtn" aria-label="播放模式">
                <span class="mode-icon">🔁</span> <span id="modeLabel">列表循环</span>
            </button>
            <button class="list-toggle" id="listToggleBtn" aria-label="播放列表">📋</button>
        </div>

        <div class="player-progress"><div class="bar" id="progressBar" style="width:0%"></div></div>

        <div class="playlist-container" id="playlistContainer">
            <div id="playlistItems"></div>
        </div>
    </div>

    <!-- 音乐数据 -->
    <script src="./music.js"></script>
    <script>
        (function() {
            // 安全检测 MUSIC_DATA
            if (typeof MUSIC_DATA === 'undefined' || !Array.isArray(MUSIC_DATA) || MUSIC_DATA.length === 0) {
                console.warn('MUSIC_DATA 未加载，使用占位数据');
                window.MUSIC_DATA = [
                    { name: '示例 · 起风了', url: 'https://www.example.com/dummy1.mp3' },
                    { name: '示例 · 光年之外', url: 'https://www.example.com/dummy2.mp3' }
                ];
            }

            const songNameDisplay = document.getElementById('songNameDisplay');
            const playBtn = document.getElementById('playBtn');
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');
            const modeBtn = document.getElementById('modeBtn');
            const modeLabel = document.getElementById('modeLabel');
            const listToggleBtn = document.getElementById('listToggleBtn');
            const playlistContainer = document.getElementById('playlistContainer');
            const playlistItems = document.getElementById('playlistItems');
            const progressBar = document.getElementById('progressBar');

            let currentIndex = 0;
            let isPlaying = false;
            let mode = 'loop';
            let audio = null;
            let isPlaylistOpen = false;

            function renderPlaylist() {
                const list = window.MUSIC_DATA || [];
                playlistItems.innerHTML = list.map((item, idx) => {
                    const activeClass = (idx === currentIndex) ? 'active-song' : '';
                    return `<div class="playlist-item ${activeClass}" data-index="${idx}">
                                <span class="index-num">${String(idx + 1).padStart(2, '0')}</span>
                                ${item.name || '未命名'}
                            </div>`;
                }).join('');
                document.querySelectorAll('.playlist-item').forEach(el => {
                    el.addEventListener('click', function() {
                        const index = parseInt(this.dataset.index, 10);
                        if (!isNaN(index) && index >= 0 && index < (window.MUSIC_DATA || []).length) {
                            playIndex(index);
                        }
                    });
                });
            }

            function updatePlaylistActive() {
                document.querySelectorAll('.playlist-item').forEach((el, idx) => {
                    el.classList.toggle('active-song', idx === currentIndex);
                });
            }

            function playIndex(index) {
                const list = window.MUSIC_DATA || [];
                if (!list.length || index < 0 || index >= list.length) return;
                currentIndex = index;
                const song = list[currentIndex];
                if (!song || !song.url) return;

                if (audio) {
                    audio.pause();
                    audio.src = '';
                    audio = null;
                }

                audio = new Audio(song.url);
                audio.preload = 'metadata';
                songNameDisplay.textContent = song.name || '未知歌曲';
                updatePlaylistActive();

                audio.play().then(() => {
                    isPlaying = true;
                    playBtn.textContent = '⏸';
                    updateProgress();
                }).catch(() => {
                    isPlaying = false;
                    playBtn.textContent = '▶';
                });

                audio.addEventListener('ended', handleSongEnd);
                audio.addEventListener('timeupdate', updateProgress);
                audio.addEventListener('pause', () => {
                    if (isPlaying) {
                        isPlaying = false;
                        playBtn.textContent = '▶';
                    }
                });
                audio.addEventListener('play', () => {
                    isPlaying = true;
                    playBtn.textContent = '⏸';
                });
            }

            function handleSongEnd() {
                const list = window.MUSIC_DATA || [];
                if (!list.length) return;
                if (mode === 'single') {
                    if (audio) { audio.currentTime = 0; audio.play().catch(() => {}); }
                    return;
                }
                if (mode === 'random') {
                    let newIndex = Math.floor(Math.random() * list.length);
                    while (list.length > 1 && newIndex === currentIndex) {
                        newIndex = Math.floor(Math.random() * list.length);
                    }
                    playIndex(newIndex);
                } else {
                    const next = (currentIndex + 1) % list.length;
                    playIndex(next);
                }
            }

            function updateProgress() {
                if (!audio || !audio.duration) {
                    progressBar.style.width = '0%';
                    return;
                }
                const percent = (audio.currentTime / audio.duration) * 100;
                progressBar.style.width = Math.min(percent, 100) + '%';
            }

            function togglePlay() {
                if (!audio) {
                    const list = window.MUSIC_DATA || [];
                    if (list.length) playIndex(currentIndex);
                    return;
                }
                if (isPlaying) {
                    audio.pause();
                    isPlaying = false;
                    playBtn.textContent = '▶';
                } else {
                    audio.play().then(() => {
                        isPlaying = true;
                        playBtn.textContent = '⏸';
                    }).catch(() => {
                        isPlaying = false;
                        playBtn.textContent = '▶';
                    });
                }
            }

            function cycleMode() {
                const modes = ['loop', 'random', 'single'];
                const icons = ['🔁', '🎲', '🔂'];
                const labels = ['列表循环', '随机播放', '单曲循环'];
                let idx = modes.indexOf(mode);
                idx = (idx + 1) % modes.length;
                mode = modes[idx];
                modeLabel.textContent = labels[idx];
                document.querySelector('.mode-icon').textContent = icons[idx];
                modeBtn.classList.toggle('active-mode', mode !== 'loop');
            }

            function togglePlaylist() {
                isPlaylistOpen = !isPlaylistOpen;
                playlistContainer.classList.toggle('open', isPlaylistOpen);
                listToggleBtn.textContent = isPlaylistOpen ? '✕' : '📋';
            }

            function prevSong() {
                const list = window.MUSIC_DATA || [];
                if (!list.length) return;
                if (mode === 'random') {
                    let newIndex = Math.floor(Math.random() * list.length);
                    while (list.length > 1 && newIndex === currentIndex) {
                        newIndex = Math.floor(Math.random() * list.length);
                    }
                    playIndex(newIndex);
                } else {
                    const prev = (currentIndex - 1 + list.length) % list.length;
                    playIndex(prev);
                }
            }

            function nextSong() {
                const list = window.MUSIC_DATA || [];
                if (!list.length) return;
                if (mode === 'random') {
                    let newIndex = Math.floor(Math.random() * list.length);
                    while (list.length > 1 && newIndex === currentIndex) {
                        newIndex = Math.floor(Math.random() * list.length);
                    }
                    playIndex(newIndex);
                } else {
                    const next = (currentIndex + 1) % list.length;
                    playIndex(next);
                }
            }

            function init() {
                renderPlaylist();
                const list = window.MUSIC_DATA || [];
                if (list.length) {
                    songNameDisplay.textContent = list[0].name || '未知歌曲';
                    currentIndex = 0;
                    audio = new Audio(list[0].url);
                    audio.preload = 'metadata';
                    audio.addEventListener('timeupdate', updateProgress);
                    audio.addEventListener('ended', handleSongEnd);
                } else {
                    songNameDisplay.textContent = '无歌曲';
                }

                playBtn.addEventListener('click', togglePlay);
                prevBtn.addEventListener('click', prevSong);
                nextBtn.addEventListener('click', nextSong);
                modeBtn.addEventListener('click', cycleMode);
                listToggleBtn.addEventListener('click', togglePlaylist);

                modeLabel.textContent = '列表循环';
                document.querySelector('.mode-icon').textContent = '🔁';
                updatePlaylistActive();

                if (audio) {
                    audio.onerror = () => {
                        songNameDisplay.textContent = '⚠️ 加载失败';
                    };
                }
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }
        })();
    </script>
</body>
</html>
