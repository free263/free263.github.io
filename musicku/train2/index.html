<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS3列车动画 · 音乐播放器 (进度条)</title>
    <link rel="stylesheet" href="css/style.css" />
    <style>
        /* 保留原有全部样式，同时增加音乐播放器毛玻璃样式 + 进度条 */
        * {
            margin: 0;
            padding: 0;
            list-style: none;
        }
        body {
            overflow-x: hidden;
            overflow-y: hidden;
            background-color: #000;
            font-size: 13px;
            color: #ffffff;
        }
        .box {
            height: 100vh;
            min-height: 520px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            background-color: #000;
        }
        .content {
            position: relative;
            width: 100%;
            height: 100%;
            background-color: #000;
        }
        .content li {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        .wrapper {
            margin: 0px auto;
            padding: 20px;
            border: 1px solid #CCC;
            background: #333;
            width: 980px;
            font-size: 12px;
        }
        .fish {
            position: absolute;
            z-index: 2;
            background-color: transparent;
            pointer-events: none;
        }
        /* 播放器容器 – 毛玻璃半透明 + 居中 */
        .music-player {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 640px;
            padding: 30px 36px;
            background: rgba(20, 20, 30, 0.45);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 32px;
            border: 1px solid rgba(255, 255, 255, 0.25);
            box-shadow: 0 16px 48px rgba(0, 0, 0, 0.7);
            pointer-events: auto;
            color: #f0f0f0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            transition: 0.3s ease;
            text-align: center;
            backdrop-filter: blur(12px) saturate(180%);
            -webkit-backdrop-filter: blur(12px) saturate(180%);
            background: rgba(10, 10, 20, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
        .music-player .song-name {
            font-size: 26px;
            font-weight: 500;
            letter-spacing: 1px;
            margin-bottom: 12px;
            text-shadow: 0 2px 8px rgba(0,0,0,0.6);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: #fff;
            background: rgba(0,0,0,0.25);
            padding: 10px 20px;
            border-radius: 50px;
            backdrop-filter: blur(4px);
            display: inline-block;
            max-width: 100%;
        }

        /* ===== 进度条 (音乐名称下方) ===== */
        .player-progress {
            width: 100%;
            margin: 0 0 16px 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .player-progress .time-label {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.6);
            font-variant-numeric: tabular-nums;
            min-width: 44px;
            text-align: center;
            font-weight: 300;
            letter-spacing: 0.3px;
        }
        .player-progress .time-label:first-child {
            text-align: right;
        }
        .player-progress .time-label:last-child {
            text-align: left;
        }
        .progress-track {
            flex: 1;
            height: 4px;
            background: rgba(255, 255, 255, 0.12);
            border-radius: 4px;
            cursor: pointer;
            position: relative;
            transition: height 0.2s;
            min-width: 60px;
        }
        .progress-track:hover {
            height: 6px;
            background: rgba(255, 255, 255, 0.2);
        }
        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #f9d976, #f39c12);
            border-radius: 4px;
            pointer-events: none;
            transition: width 0.05s linear;
            box-shadow: 0 0 10px rgba(243, 156, 18, 0.3);
        }

        .player-controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 28px;
            margin-top: 6px;
        }
        .player-controls button {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 60px;
            color: #fff;
            font-size: 26px;
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 16px rgba(0,0,0,0.4);
            background: rgba(30, 30, 50, 0.4);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.1);
        }
        .player-controls button:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: scale(1.05);
            border-color: rgba(255,255,255,0.4);
        }
        .player-controls button:active {
            transform: scale(0.92);
        }
        .player-controls .play-btn {
            width: 76px;
            height: 76px;
            font-size: 34px;
            background: rgba(255, 215, 0, 0.25);
            border-color: rgba(255, 215, 0, 0.3);
        }
        .player-controls .play-btn:hover {
            background: rgba(255, 215, 0, 0.4);
        }
        .mode-indicator {
            font-size: 18px;
            background: rgba(0,0,0,0.3);
            padding: 8px 20px;
            border-radius: 40px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255,255,255,0.1);
            margin-top: 18px;
            display: inline-block;
            letter-spacing: 1.5px;
            color: #ddd;
            cursor: pointer;
            transition: 0.2s;
        }
        .mode-indicator:hover {
            background: rgba(255,255,255,0.15);
        }
        .bottom-bar {
            position: absolute;
            width: 100%;
            height: 39px;
            z-index: 4;
            left: 0;
            bottom: -3px;
        }
        .bottom-icons {
            position: absolute;
            width: 50px;
            height: 50px;
            z-index: 7;
            left: 0;
            bottom: -3px;
            background-color: transparent;
        }

        /* 列车动画容器位置 */
        .center {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: 1;
            left: 0;
            top: 0;
        }

        @media (max-width: 800px) {
            .music-player {
                width: 80vw;
                padding: 24px 20px;
            }
            .music-player .song-name {
                font-size: 20px;
                padding: 8px 14px;
            }
            .player-controls button {
                width: 48px;
                height: 48px;
                font-size: 20px;
            }
            .player-controls .play-btn {
                width: 60px;
                height: 60px;
                font-size: 26px;
            }
            .mode-indicator {
                font-size: 15px;
                padding: 6px 14px;
            }
            .player-progress .time-label {
                font-size: 12px;
                min-width: 36px;
            }
        }
        @media (max-width: 500px) {
            .music-player {
                width: 92vw;
                padding: 16px 12px;
            }
            .music-player .song-name {
                font-size: 16px;
            }
            .player-controls {
                gap: 14px;
            }
            .player-controls button {
                width: 40px;
                height: 40px;
                font-size: 16px;
            }
            .player-controls .play-btn {
                width: 50px;
                height: 50px;
                font-size: 20px;
            }
            .player-progress .time-label {
                font-size: 10px;
                min-width: 30px;
            }
        }
    </style>
</head>
<body>

    <!-- 播放器容器 -->
    <div class="fish" style="position:absolute; width:1350px; height:500px; z-index:2; left: 20px; top: 50px; background-color:transparent;">
        <div class="music-player" id="musicPlayer">
            <div class="song-name" id="songName">🎵 梦幻泡泡</div>

            <!-- 进度条 -->
            <div class="player-progress">
                <span class="time-label" id="timeCurrent">0:00</span>
                <div class="progress-track" id="progressTrack">
                    <div class="progress-fill" id="progressFill" style="width:0%;"></div>
                </div>
                <span class="time-label" id="timeDuration">0:00</span>
            </div>

            <div class="player-controls">
                <button id="prevBtn" title="上一首">⏮</button>
                <button id="playBtn" class="play-btn" title="播放/暂停">▶</button>
                <button id="nextBtn" title="下一首">⏭</button>
            </div>
            <div class="mode-indicator" id="modeIndicator">🔁 列表循环</div>
        </div>
    </div>

    <!-- 底部和按钮 (保留) -->
    <div style="position:absolute; width:100%; height:39; z-index:4; left:0px; bottom: -3px;">
        <table style="border-collapse:collapse;width:100%; height:39;">
            <tr>
                <td align="left"><img src="./images/bottom-left.jpg" width="109" height="39" border="0" alt=""></td>
                <td align="center" width="100%" height="39" border="0" background="./images/bottom-center.jpg"></td>
                <td align="right"><img src="./images/bottom-right.jpg" width="273" height="39" border="0" alt=""></td>
            </tr>
        </table>
    </div>

    <div class="fish" style="position:absolute; width:50; height:50; z-index:7; left: 0px; bottom: -3px; background-color:transparent;">
        <table>
            <tr>
                <td><a href="#"><img src="./computer/space.gif" width="40" height="50" border="0" alt=""></a></td>
                <td width="20">&nbsp;</td>
                <td><a href="#"><img src="./computer/space.gif" width="40" height="50" border="0" alt=""></a></td>
                <td width="1050">&nbsp;</td>
                <td><a href="#"><img src="./computer/space.gif" width="15" height="50" border="0" alt=""></a></td>
                <td width="10">&nbsp;</td>
                <td><a href="#"><img src="./computer/space.gif" width="15" height="50" border="0" alt=""></a></td>
                <td width="7">&nbsp;</td>
                <td><a href="#"><img src="./computer/space.gif" width="15" height="50" border="0" alt=""></a></td>
                <td width="6">&nbsp;</td>
                <td><a href="#"><img src="./computer/space.gif" width="15" height="50" border="0" alt=""></a></td>
                <td width="4">&nbsp;</td>
                <td><a href="#"><img src="./computer/space.gif" width="15" height="50" border="0" alt=""></a></td>
            </tr>
        </table>
    </div>

    <!-- 列车动画 -->
    <div class="center" style="position:absolute; width:100%; height:100%; z-index:1; left:0px; top:0px;">
        <div class="mountains"></div>
        <div class="train">
            <div class="engine-front">
                <div class="chimney">
                    <div class="smoke"></div>
                    <div class="smoke smoke-2"></div>
                    <div class="smoke smoke-3"></div>
                    <div class="smoke smoke-4"></div>
                </div>
            </div>
            <div class="engine-body"></div>
            <div class="compartment">
                <div class="compartment-window"></div>
            </div>
            <div class="compartment compartment-two">
                <div class="compartment-window"></div>
            </div>
            <div class="compartment compartment-three">
                <div class="compartment-window"></div>
            </div>
            <div class="wheel-holder">
                <div class="wheel"></div>
                <div class="wheel wheel-2">
                    <div class="wheel-joint"></div>
                    <div class="wheel-joint wheel-joint-2"></div>
                </div>
                <div class="wheel wheel-3"></div>
                <div class="wheel wheel-4"></div>
                <div class="wheel wheel-5"></div>
                <div class="wheel wheel-6"></div>
                <div class="wheel wheel-7"></div>
                <div class="wheel wheel-8"></div>
                <div class="wheel wheel-9"></div>
            </div>
        </div>
        <div class="bridge"></div>
    </div>

    <!-- 引入 music.js -->
    <script src="music.js"></script>
    <script>
        (function() {
            // 使用 MUSIC_DATA (来自 music.js)
            const list = window.MUSIC_DATA || [];
            if (!list.length) {
                document.getElementById('songName').textContent = '🎵 无音乐数据';
                return;
            }

            let currentIndex = 0;
            let isPlaying = false;
            let mode = 'loop'; // 'loop', 'single', 'random'

            const songNameEl = document.getElementById('songName');
            const playBtn = document.getElementById('playBtn');
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');
            const modeIndicator = document.getElementById('modeIndicator');

            // 进度条 DOM
            const progressFill = document.getElementById('progressFill');
            const progressTrack = document.getElementById('progressTrack');
            const timeCurrent = document.getElementById('timeCurrent');
            const timeDuration = document.getElementById('timeDuration');

            const audio = new Audio();
            audio.volume = 0.7;

            // ---------- 辅助函数 ----------
            function formatTime(seconds) {
                if (isNaN(seconds) || seconds === Infinity || seconds < 0) return '0:00';
                const mins = Math.floor(seconds / 60);
                const secs = Math.floor(seconds % 60);
                return mins + ':' + (secs < 10 ? '0' : '') + secs;
            }

            function updateProgress() {
                if (!audio.duration || isNaN(audio.duration) || audio.duration === Infinity) {
                    progressFill.style.width = '0%';
                    timeCurrent.textContent = '0:00';
                    timeDuration.textContent = '0:00';
                    return;
                }
                const percent = (audio.currentTime / audio.duration) * 100;
                progressFill.style.width = Math.min(percent, 100) + '%';
                timeCurrent.textContent = formatTime(audio.currentTime);
                timeDuration.textContent = formatTime(audio.duration);
            }

            // 进度条点击跳转
            progressTrack.addEventListener('click', function(e) {
                if (!audio.duration || isNaN(audio.duration)) return;
                const rect = this.getBoundingClientRect();
                const clickX = e.clientX - rect.left;
                const ratio = Math.min(1, Math.max(0, clickX / rect.width));
                audio.currentTime = ratio * audio.duration;
                updateProgress();
            });

            // 加载歌曲
            function loadSong(index) {
                const song = list[index];
                if (!song) return;
                audio.src = song.url;
                audio.load();
                songNameEl.textContent = song.name;
                progressFill.style.width = '0%';
                timeCurrent.textContent = '0:00';
                timeDuration.textContent = '0:00';
                if (isPlaying) {
                    audio.play().catch(err => {
                        console.warn('自动播放被阻止', err);
                        isPlaying = false;
                        updatePlayButton();
                    });
                }
                // 加载元数据后更新时长
                audio.addEventListener('loadedmetadata', function() {
                    timeDuration.textContent = formatTime(audio.duration);
                    updateProgress();
                }, { once: true });
            }

            function updatePlayButton() {
                playBtn.textContent = isPlaying ? '⏸' : '▶';
            }

            function togglePlay() {
                if (audio.src === '') {
                    loadSong(currentIndex);
                }
                if (isPlaying) {
                    audio.pause();
                    isPlaying = false;
                } else {
                    audio.play().catch(err => {
                        console.warn('播放失败', err);
                        loadSong(currentIndex);
                        audio.play().catch(e => console.warn(e));
                    });
                    isPlaying = true;
                }
                updatePlayButton();
            }

            function nextSong() {
                if (mode === 'random') {
                    let newIndex;
                    do {
                        newIndex = Math.floor(Math.random() * list.length);
                    } while (list.length > 1 && newIndex === currentIndex);
                    currentIndex = newIndex;
                } else {
                    currentIndex = (currentIndex + 1) % list.length;
                }
                loadSong(currentIndex);
                if (isPlaying) {
                    audio.play().catch(() => {});
                }
                updateModeIndicator();
            }

            function prevSong() {
                if (mode === 'random') {
                    let newIndex;
                    do {
                        newIndex = Math.floor(Math.random() * list.length);
                    } while (list.length > 1 && newIndex === currentIndex);
                    currentIndex = newIndex;
                } else {
                    currentIndex = (currentIndex - 1 + list.length) % list.length;
                }
                loadSong(currentIndex);
                if (isPlaying) {
                    audio.play().catch(() => {});
                }
                updateModeIndicator();
            }

            function toggleMode() {
                if (mode === 'loop') mode = 'single';
                else if (mode === 'single') mode = 'random';
                else if (mode === 'random') mode = 'loop';
                updateModeIndicator();
            }

            function updateModeIndicator() {
                const map = {
                    'loop': '🔁 列表循环',
                    'single': '🔂 单曲循环',
                    'random': '🎲 随机播放'
                };
                modeIndicator.textContent = map[mode] || '🔁 列表循环';
            }

            audio.addEventListener('timeupdate', updateProgress);

            audio.addEventListener('ended', function() {
                if (mode === 'single') {
                    audio.currentTime = 0;
                    audio.play().catch(() => {});
                } else {
                    nextSong();
                }
            });

            // 初始化
            loadSong(0);
            isPlaying = false;
            updatePlayButton();
            updateModeIndicator();

            // 绑定事件
            playBtn.addEventListener('click', togglePlay);
            prevBtn.addEventListener('click', prevSong);
            nextBtn.addEventListener('click', nextSong);
            modeIndicator.addEventListener('click', toggleMode);

            // 键盘快捷键
            document.addEventListener('keydown', (e) => {
                if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
                if (e.code === 'Space') {
                    e.preventDefault();
                    togglePlay();
                } else if (e.code === 'ArrowRight') {
                    e.preventDefault();
                    nextSong();
                } else if (e.code === 'ArrowLeft') {
                    e.preventDefault();
                    prevSong();
                } else if (e.code === 'KeyM') {
                    toggleMode();
                }
            });

            console.log('🎵 音乐播放器已初始化，共 ' + list.length + ' 首歌曲');
        })();
    </script>

</body>
</html>
