div.maincontent { width:980px;margin:0 auto;}

/* ===== 模式切换按钮样式（放在评分器下方） ===== */
.mode_switch {
    margin-top: 8px;
    display: flex;
    align-items: center;
    gap: 6px;
}
.mode_switch .mode_label {
    font-size: 11px;
    color: rgba(255,255,255,0.6);
    font-family: Helvetica, Sans-serif;
}
.mode_switch .btn_mode {
    font-family: "icomoon";
    color: rgba(255,255,255,0.6);
    cursor: pointer;
    font-size: 18px;
    line-height: 1;
    transition: color 0.3s;
    display: inline-block;
}
.mode_switch .btn_mode:hover { 
    color: rgb(242,198,65); 
}
.mode_switch .btn_mode.active { 
    color: rgb(101,215,251); 
}
.mode_switch .mode_name {
    font-size: 11px;
    color: rgba(255,255,255,0.8);
    font-family: Helvetica, Sans-serif;
    min-width: 36px;
}

/* 模式提示浮窗 */
.mode_tip {
    position: fixed;
    bottom: 80px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.85);
    color: #fff;
    padding: 8px 24px;
    border-radius: 20px;
    font-size: 13px;
    font-family: Helvetica, Sans-serif;
    z-index: 999;
    opacity: 0;
    transition: opacity 0.4s ease;
    pointer-events: none;
}
.mode_tip.show {
    opacity: 1;
}

/* ===== 恢复播放控制区原始宽度 ===== */
#myAudio .controls .play_controls {
    width: 85px;
}
</style>
