<html>
<head>
<title>jQuery虾米音乐播放器样式代码 - 站长素材</title>
<meta charset="utf-8">

<link rel="stylesheet" type="text/css" href="css/scroll.css">
<link rel="stylesheet" type="text/css" href="css/xiami.css">

<script type="text/javascript" src="js/jquery-1.10.2.js"></script>
<script type="text/javascript" src="js/jquery-ui.js"></script>
<script type="text/javascript" src="js/canvas.js"></script>
<script type="text/javascript" src="js/mousewheel.js"></script>
<script type="text/javascript" src="js/scroll.js"></script>
<script type="text/javascript" src="js/xiami.js"></script>
<script type="text/javascript" src="music.js"></script>

</head>
<body>
	<!--模糊画布-->
	<div class="blur">
		<canvas style="width:1366px;height:700px;opacity:0;" width="1366" height="700" id="canvas">
	</div>
	<div class="playerMain">
		<div class="top">
			<a href="#" class="logo"></a>
			<div class="search">
				<div type="submit" class="searchBtn"></div>
				<input type="text" class="searchTxt">
			</div>
			<div class="mainNav">
				<div class="tipLogin">
					马上
					<a href="#" class="loginA">登录</a>
				</div>
				<a href="#" class="myroom"></a>
			</div>
		</div>
		<div class="middle">
			<div class="mainWrap">
				<div class="leftBar">
					<ul class="menuUL">
						<li class="menuLi cur">
							<a href="#">
								<i class="icon iplay"></i>
								正在播放
							</a>
						</li>
						<li class="menuLi">
							<a href="#">
								<i class="icon ihst"></i>
								播放历史
							</a>
						</li>
						<li class="menuLi">
							<a href="#">
								<i class="icon ishouc"></i>
								我收藏的单曲
							</a>
						</li>
					</ul>
					<div class="collectOut">
						<span class="colS">我创建的精选集</span>
						<a href="#" class="colA"></a>
					</div>
					<div class="cellectList"></div>
					<audio id="audio"></audio>			
				</div>
				<div class="mainBody">
					<div class="playHd">
						<div class="phInner">
							<div class="col">歌曲(50)</div>
							<div class="col">演唱者</div>
							<div class="col">专辑</div>
						</div>
					</div>
					<div class="playBd">
						<div class="scrollView">
							<ul class="songUL" id="songList">
								<!-- 由 JavaScript 动态生成 -->
							</ul>
						</div>
					</div>
					<div class="playFt">
						<div class="track">
							<div class="uiCheck">
								<input class="checkAll" type="checkbox" select="0">
							</div>
							<div class="uiItem">
								<a href="#" class="itIcon itDele">删除</a>
							</div>
							<div class="uiItem">
								<a href="#" class="itIcon itShou">收藏</a>
							</div>
							<div class="uiItem">
								<a href="#" class="itIcon itJin">添加到精选集</a>
							</div>
							<div class="uiItem">
								<a href="#" class="itIcon itMore">更多</a>
							</div>
						</div>
					</div>
				</div>
				<div class="mainOuther">
					<div class="albumCover">
						<a href="#">
							<img src="images/2.jpg" id="canvas1">
						</a>
					</div>
					<div class="albumSale">
						<a href="#" class="asA">
							<img src="">
						</a>
					</div>
					<div id="lyr"></div>
				</div>
			</div>
		</div>
		<div class="bottom">
			<div class="playerWrap">
				<div class="playerCon">
					<a href="#" class="pbtn prevBtn"></a>
					<a href="#" class="pbtn playBtn" isplay="0"></a>
					<a href="#" class="pbtn nextBtn"></a>
					<a href="#" class="mode"></a>
				</div>
				<div class="playInfo">
					<div class="trackInfo">
						<a href="#" class="songName">漂洋过海来看你(Live)</a>
						-
						<a href="#" class="songPlayer">刘明湘</a>
						<div class="trackCon">
							<a href="#" class="tc1"></a>
							<a href="#" class="tc2"></a>
							<a href="#" class="tc3"></a>
						</div>
					</div>
					<div class="playerLength">
						<div class="position">00:00</div>
						<div class="progress">
							<div class="pro1"></div>
							<div class="pro2">
								<a href="#" class="dian"></a>
							</div> 
						</div>
						<div class="duration">03:35</div>
					</div>
				</div>
				<div class="vol">
					<a href="#" class="pinBtn"></a>
					<div class="volm">
						<div class="volSpeaker"></div>
						<div class="volControl">
							<a href="#" class="dian2"></a>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>

	<script>
		// 从 MUSIC_DATA 生成歌曲列表
		(function() {
			var songList = document.getElementById('songList');
			if (!songList) return;
			
			var html = '';
			for (var i = 0; i < MUSIC_DATA.length; i++) {
				var song = MUSIC_DATA[i];
				// 从文件名中提取演唱者（取 - 前面的部分作为演唱者，后面作为歌名）
				var nameParts = song.name.split('-');
				var singer = '未知歌手';
				var songName = song.name;
				if (nameParts.length >= 2) {
					singer = nameParts[0];
					songName = nameParts.slice(1).join('-');
				}
				
				html += '<li class="songList" data-index="' + i + '" data-url="' + song.url + '">';
				html += '	<div class="songLMain">';
				html += '		<div class="check">';
				html += '			<input class="checkIn" type="checkbox" select="0">';
				html += '		</div>';
				html += '		<div class="start">';
				html += '			<em sonN="' + (i + 1) + '">' + (i + 1) + '</em>';
				html += '		</div>';
				html += '		<div class="songBd">';
				html += '			<div class="col colsn">' + songName + '</div>';
				html += '			<div class="col colcn">' + singer + '</div>';
				html += '			<div class="col">未知专辑</div>';
				html += '		</div>';
				html += '		<div class="control">';
				html += '			<a class="cicon love"></a>';
				html += '			<a class="cicon more"></a>';
				html += '			<a class="cicon dele"></a>';
				html += '		</div>';
				html += '	</div>';
				html += '</li>';
			}
			songList.innerHTML = html;
			
			// 更新歌曲数量显示
			var countEl = document.querySelector('.playHd .col:first-child');
			if (countEl) {
				countEl.textContent = '歌曲(' + MUSIC_DATA.length + ')';
			}
			
			// 设置默认第一首歌到 audio
			var audio = document.getElementById('audio');
			if (audio && MUSIC_DATA.length > 0) {
				audio.src = MUSIC_DATA[0].url;
			}
		})();
	</script>

<div style="text-align:center;margin:50px 0; font:normal 14px/24px 'MicroSoft YaHei';">
<p>适用浏览器：360、FireFox、Chrome、Safari、Opera、傲游、搜狗、世界之窗. 不支持IE8及以下浏览器。</p>

</div>
</body>
</html>
