<html>
<head>
<title>jQuery虾米音乐播放器样式代码 - 站长素材</title>

<script type="text/javascript" src="js/xiami.js"></script>
<script type="text/javascript" src="music.js"></script>

</head>
<body>
	<!--模糊画布-->
	<div class="blur">

	<div class="playerMain">

		</div>
		<div class="middle">
			<div class="mainWrap">
				<div class="leftBar">
					<ul class="menuUL">
						<li class="menuLi cur">
							<a href="#">
								<i class="icon iplay"></i>
								正在播放
							</a>
						</li>
						<li class="menuLi">
							<a href="#">
								<i class="icon ihst"></i>

							</a>
						</li>
						<li class="menuLi">
							<a href="#">

							</a>
						</li>
					</ul>
					<div class="collectOut">

				</div>
				<div class="mainBody">
					<div class="playHd">
						<div class="phInner">

							<div class="col">演唱者</div>

						</div>
					</div>
					<div class="playBd">
						<div class="scrollView">
							<ul class="songUL" id="songList">
								<!-- 由 JavaScript 动态生成 -->
							</ul>
						</div>
					</div>
					<div class="playFt">
						<div class="track">
							<div class="uiCheck">
								<input class="checkAll" type="checkbox" select="0">
							</div>
							<div class="uiItem">
								<a href="#" class="itIcon itDele">删除</a>
							</div>
							<div class="uiItem">

							</div>
							<div class="uiItem">
								<a href="#" class="itIcon itJin">添加到精选集</a>
							</div>
							<div class="uiItem">
								<a href="#" class="itIcon itMore">更多</a>
							</div>
						</div>
					</div>
				</div>
				<div class="mainOuther">
					<div class="albumCover">
						<a href="#">
							<img src="images/2.jpg" id="canvas1">
						</a>
					</div>
					<div class="albumSale">
						<a href="#" class="asA">
							<img src="">
						</a>
					</div>
					<div id="lyr"></div>
				</div>
			</div>
		</div>
		<div class="bottom">
			<div class="playerWrap">
				<div class="playerCon">
					<a href="#" class="pbtn prevBtn"></a>
					<a href="#" class="pbtn playBtn" isplay="0"></a>
					<a href="#" class="pbtn nextBtn"></a>
					<a href="#" class="mode"></a>
				</div>
				<div class="playInfo">
					<div class="trackInfo">
						<a href="#" class="songName" id="currentSongName">请选择歌曲</a>
						-
						<a href="#" class="songPlayer" id="currentSongPlayer">未知歌手</a>
						<div class="trackCon">
							<a href="#" class="tc1"></a>
							<a href="#" class="tc2"></a>
							<a href="#" class="tc3"></a>
						</div>
					</div>
					<div class="playerLength">
						<div class="position" id="currentTime">00:00</div>
						<div class="progress">
							<div class="pro1"></div>
							<div class="pro2">
								<a href="#" class="dian"></a>
							</div> 
						</div>
						<div class="duration" id="totalDuration">00:00</div>
					</div>
				</div>
				<div class="vol">
					<a href="#" class="pinBtn"></a>
					<div class="volm">
						<div class="volSpeaker"></div>
						<div class="volControl">
							<a href="#" class="dian2"></a>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>

	<script>
		// ============================================================
		// 从 MUSIC_DATA 生成歌曲列表，并实现播放控制
		// ============================================================
		(function() {
			var songList = document.getElementById('songList');
			var audio = document.getElementById('audio');
			var playBtn = document.querySelector('.playBtn');
			var prevBtn = document.querySelector('.prevBtn');
			var nextBtn = document.querySelector('.nextBtn');
			var currentSongName = document.getElementById('currentSongName');
			var currentSongPlayer = document.getElementById('currentSongPlayer');
			var currentTimeEl = document.getElementById('currentTime');
			var totalDurationEl = document.getElementById('totalDuration');
			var progressPro1 = document.querySelector('.pro1');
			var progressPro2 = document.querySelector('.pro2');
			var dianBtn = document.querySelector('.dian');
			var songCount = document.getElementById('songCount');
			
			var currentIndex = 0;
			var isPlaying = false;
			var isDragging = false;
			
			// 解析歌曲信息
			function parseSongInfo(song) {
				var nameParts = song.name.split('-');
				var singer = '未知歌手';
				var songName = song.name;
				if (nameParts.length >= 2) {
					singer = nameParts[0].trim();
					songName = nameParts.slice(1).join('-').trim();
				}
				return { singer: singer, songName: songName };
			}
			
			// 生成歌曲列表
			function renderSongList() {
				if (!songList) return;
				
				var html = '';
				for (var i = 0; i < MUSIC_DATA.length; i++) {
					var song = MUSIC_DATA[i];
					var info = parseSongInfo(song);
					
					html += '<li class="songList" data-index="' + i + '" data-url="' + song.url + '">';
					html += '	<div class="songLMain">';
					html += '		<div class="check">';
					html += '			<input class="checkIn" type="checkbox" select="0">';
					html += '		</div>';
					html += '		<div class="start">';
					html += '			<em sonN="' + (i + 1) + '">' + (i + 1) + '</em>';
					html += '		</div>';
					html += '		<div class="songBd">';
					html += '			<div class="col colsn">' + info.songName + '</div>';
					html += '			<div class="col colcn">' + info.singer + '</div>';
					html += '			<div class="col">未知专辑</div>';
					html += '		</div>';
					html += '		<div class="control">';
					html += '			<a class="cicon love"></a>';
					html += '			<a class="cicon more"></a>';
					html += '			<a class="cicon dele"></a>';
					html += '		</div>';
					html += '	</div>';
					html += '</li>';
				}
				songList.innerHTML = html;
				
				if (songCount) {
					songCount.textContent = MUSIC_DATA.length;
				}
				
				// 点击歌曲播放
				$('.songList').on('click', function(e) {
					// 如果点击的是 checkbox 或控制按钮，不触发播放
					if ($(e.target).closest('.check, .control').length > 0) {
						return;
					}
					var index = parseInt($(this).data('index'));
					if (!isNaN(index)) {
						playSong(index);
					}
				});
				
				// checkbox 点击事件 - 阻止冒泡
				$('.checkIn').on('click', function(e) {
					e.stopPropagation();
				});
				
				// 控制按钮点击事件 - 阻止冒泡
				$('.control a').on('click', function(e) {
					e.stopPropagation();
				});
			}
			
			// 播放指定索引的歌曲
			function playSong(index) {
				if (index < 0 || index >= MUSIC_DATA.length) return;
				
				currentIndex = index;
				var song = MUSIC_DATA[index];
				var info = parseSongInfo(song);
				
				// 更新 audio
				audio.src = song.url;
				audio.load();
				audio.play().catch(function(err) {
					console.log('播放失败:', err);
					// 部分浏览器可能需要用户交互后才能播放
				});
				
				isPlaying = true;
				playBtn.setAttribute('isplay', '1');
				playBtn.style.backgroundPosition = '0 -33px';
				
				// 更新显示信息
				currentSongName.textContent = info.songName;
				currentSongPlayer.textContent = info.singer;
				
				// 高亮当前歌曲
				$('.songList').removeClass('active');
				$('.songList[data-index="' + index + '"]').addClass('active');
				
				// 更新封面（如果有）
				var coverImg = document.getElementById('canvas1');
				if (coverImg) {
					// 可以设置默认封面或随机封面
				}
			}
			
			// 切换播放/暂停
			function togglePlay() {
				if (audio.src) {
					if (isPlaying) {
						audio.pause();
						isPlaying = false;
						playBtn.setAttribute('isplay', '0');
						playBtn.style.backgroundPosition = '0 0';
					} else {
						audio.play().catch(function(err) {
							console.log('播放失败:', err);
						});
						isPlaying = true;
						playBtn.setAttribute('isplay', '1');
						playBtn.style.backgroundPosition = '0 -33px';
					}
				} else {
					// 如果没有歌曲，默认播放第一首
					playSong(0);
				}
			}
			
			// 上一首
			function prevSong() {
				var idx = (currentIndex - 1 + MUSIC_DATA.length) % MUSIC_DATA.length;
				playSong(idx);
			}
			
			// 下一首
			function nextSong() {
				var idx = (currentIndex + 1) % MUSIC_DATA.length;
				playSong(idx);
			}
			
			// 格式化时间
			function formatTime(seconds) {
				if (isNaN(seconds) || seconds < 0) return '00:00';
				var m = Math.floor(seconds / 60);
				var s = Math.floor(seconds % 60);
				return (m < 10 ? '0' + m : m) + ':' + (s < 10 ? '0' + s : s);
			}
			
			// 更新进度条
			function updateProgress() {
				if (audio.duration && !isNaN(audio.duration)) {
					var percent = (audio.currentTime / audio.duration) * 100;
					if (progressPro1) {
						progressPro1.style.width = percent + '%';
					}
					if (progressPro2) {
						progressPro2.style.left = percent + '%';
					}
					if (currentTimeEl) {
						currentTimeEl.textContent = formatTime(audio.currentTime);
					}
					if (totalDurationEl) {
						totalDurationEl.textContent = formatTime(audio.duration);
					}
				}
			}
			
			// 进度条点击跳转
			function seekTo(e) {
				var progress = document.querySelector('.progress');
				if (!progress) return;
				var rect = progress.getBoundingClientRect();
				var percent = (e.clientX - rect.left) / rect.width;
				if (percent < 0) percent = 0;
				if (percent > 1) percent = 1;
				
				if (audio.duration && !isNaN(audio.duration)) {
					audio.currentTime = percent * audio.duration;
					updateProgress();
				}
			}
			
			// ============================================================
			// 绑定事件
			// ============================================================
			
			// 渲染列表
			renderSongList();
			
			// 设置默认第一首歌
			if (MUSIC_DATA.length > 0) {
				var defaultInfo = parseSongInfo(MUSIC_DATA[0]);
				currentSongName.textContent = defaultInfo.songName;
				currentSongPlayer.textContent = defaultInfo.singer;
				audio.src = MUSIC_DATA[0].url;
				// 预加载但不自动播放
				audio.load();
				// 高亮第一首
				$('.songList[data-index="0"]').addClass('active');
			}
			
			// 播放/暂停按钮
			playBtn.addEventListener('click', function(e) {
				e.preventDefault();
				togglePlay();
			});
			
			// 上一首
			prevBtn.addEventListener('click', function(e) {
				e.preventDefault();
				prevSong();
			});
			
			// 下一首
			nextBtn.addEventListener('click', function(e) {
				e.preventDefault();
				nextSong();
			});
			
			// 音频播放事件
			audio.addEventListener('play', function() {
				isPlaying = true;
				playBtn.setAttribute('isplay', '1');
				playBtn.style.backgroundPosition = '0 -33px';
			});
			
			audio.addEventListener('pause', function() {
				isPlaying = false;
				playBtn.setAttribute('isplay', '0');
				playBtn.style.backgroundPosition = '0 0';
			});
			
			audio.addEventListener('ended', function() {
				// 自动播放下一首
				nextSong();
			});
			
			audio.addEventListener('timeupdate', function() {
				if (!isDragging) {
					updateProgress();
				}
			});
			
			audio.addEventListener('loadedmetadata', function() {
				updateProgress();
			});
			
			// 进度条点击
			var progress = document.querySelector('.progress');
			if (progress) {
				progress.addEventListener('click', function(e) {
					seekTo(e);
				});
				
				// 拖拽进度条
				var dian = document.querySelector('.dian');
				if (dian) {
					dian.addEventListener('mousedown', function(e) {
						e.preventDefault();
						isDragging = true;
					});
					
					document.addEventListener('mousemove', function(e) {
						if (isDragging) {
							seekTo(e);
						}
					});
					
					document.addEventListener('mouseup', function(e) {
						if (isDragging) {
							isDragging = false;
							seekTo(e);
						}
					});
				}
			}
			
			// 键盘快捷键 - 空格切换播放
			document.addEventListener('keydown', function(e) {
				if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
				if (e.code === 'Space') {
					e.preventDefault();
					togglePlay();
				}
			});
			
			// 暴露函数到全局，供其他脚本调用
			window.playSong = playSong;
			window.togglePlay = togglePlay;
			window.prevSong = prevSong;
			window.nextSong = nextSong;
			
			console.log('🎵 音乐播放器已初始化，共 ' + MUSIC_DATA.length + ' 首歌曲');
			
		})();
	</script>
