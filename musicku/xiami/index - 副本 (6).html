<body>
	<!--模糊画布-->

		<div class="bottom">
			<div class="playerWrap">
				<div class="playerCon">
					<a href="#" class="pbtn prevBtn"></a>

						<a href="#" class="songName" id="currentSongName">请选择歌曲</a>
						-
						<a href="#" class="songPlayer" id="currentSongPlayer">未知歌手</a>
						<div class="trackCon">
							<a href="#" class="tc1"></a>

					<div class="playerLength">
						<div class="position" id="currentTime">00:00</div>

				<div class="vol">

	<script>
		// ============================================================
		// 完整播放器控制 - 使用 fetch + Blob 解决格式问题
		// ============================================================
		(function() {
			var songList = document.getElementById('songList');
			var audioEl = document.getElementById('audio');
			var playBtn = document.querySelector('.playBtn');
			var prevBtn = document.querySelector('.prevBtn');
			var nextBtn = document.querySelector('.nextBtn');
			var modeBtn = document.querySelector('.mode');
			var currentSongName = document.getElementById('currentSongName');
			var currentSongPlayer = document.getElementById('currentSongPlayer');
			var currentTimeEl = document.getElementById('currentTime');
			var totalDurationEl = document.getElementById('totalDuration');
			var progressPro1 = document.querySelector('.pro1');
			var progressPro2 = document.querySelector('.pro2');
			var dianBtn = document.querySelector('.dian');
			var songCount = document.getElementById('songCount');
			var canvasImg = document.getElementById('canvas1');
			
			window.audio = audioEl;
			
			var currentIndex = 0;
			var isPlaying = false;
			var isDragging = false;
			var playMode = 0;
			var modeNames = ['顺序播放', '单曲循环', '随机播放'];
			var currentBlobUrl = null;
			
			function parseSongInfo(song) {
				var nameParts = song.name.split('-');
				var singer = '未知歌手';
				var songName = song.name;
				if (nameParts.length >= 2) {
					singer = nameParts[0].trim();
					songName = nameParts.slice(1).join('-').trim();
				}
				return { singer: singer, songName: songName };
			}
			
			function updatePlayButtonUI() {
				if (isPlaying) {
					playBtn.setAttribute('isplay', '1');
					playBtn.style.backgroundPosition = '0 -33px';
					$('.iplay').css('background', 'url("css/images/T1oHFEFwGeXXXYdLba-18-18.gif") 0 0');
				} else {
					playBtn.setAttribute('isplay', '0');
					playBtn.style.backgroundPosition = '0 0';
					$('.iplay').css('background', '');
				}
			}
			
			function updateModeUI() {
				modeBtn.setAttribute('data-mode', playMode);
				var bgPos = '';
				if (playMode === 0) bgPos = '0 -62px';
				else if (playMode === 1) bgPos = '0 -93px';
				else if (playMode === 2) bgPos = '0 -124px';
				modeBtn.style.backgroundPosition = bgPos;
			}
			
			function renderSongList() {
				if (!songList || typeof MUSIC_DATA === 'undefined') return;
				
				var html = '';
				for (var i = 0; i < MUSIC_DATA.length; i++) {
					var song = MUSIC_DATA[i];
					var info = parseSongInfo(song);
					
					html += '<li class="songList" data-index="' + i + '" data-url="' + song.url + '">';
					html += '	<div class="songLMain">';
					html += '		<div class="check">';
					html += '			<input class="checkIn" type="checkbox" select="0">';
					html += '		</div>';
					html += '		<div class="start">';
					html += '			<em sonN="' + (i + 1) + '">' + (i + 1) + '</em>';
					html += '		</div>';
					html += '		<div class="songBd">';
					html += '			<div class="col colsn">' + info.songName + '</div>';
					html += '			<div class="col colcn">' + info.singer + '</div>';
					html += '			<div class="col">未知专辑</div>';
					html += '		</div>';
					html += '		<div class="control">';
					html += '			<a class="cicon love"></a>';
					html += '			<a class="cicon more"></a>';
					html += '			<a class="cicon dele"></a>';
					html += '		</div>';
					html += '	</div>';
					html += '</li>';
				}
				songList.innerHTML = html;
				
				if (songCount) {
					songCount.textContent = MUSIC_DATA.length;
				}
				
				$('.songList').off('click').on('click', function(e) {
					if ($(e.target).closest('.check, .control').length > 0) return;
					var index = parseInt($(this).data('index'));
					if (!isNaN(index)) playSong(index);
				});
				
				$('.checkIn').off('click').on('click', function(e) {
					e.stopPropagation();
				});
				
				$('.control a').off('click').on('click', function(e) {
					e.stopPropagation();
				});
				
				$(".start em").off('click').on('click', function(e) {
					e.stopPropagation();
					var sid = parseInt($(this).attr("sonN"));
					if (!isNaN(sid) && sid > 0) playSong(sid - 1);
				});
				
				$(".songList").off('mouseenter mouseleave').hover(
					function() { $(this).find(".more, .dele").show(); },
					function() { $(this).find(".more, .dele").hide(); }
				);
				
				if (MUSIC_DATA.length > 0) {
					$('.songList[data-index="0"]').addClass('active');
				}
			}
			
			// 核心播放函数 - 使用 fetch 获取音频
			function playSong(index) {
				if (typeof MUSIC_DATA === 'undefined' || index < 0 || index >= MUSIC_DATA.length) return;
				
				currentIndex = index;
				var song = MUSIC_DATA[index];
				var info = parseSongInfo(song);
				
				// 更新 UI
				currentSongName.textContent = info.songName;
				currentSongPlayer.textContent = info.singer;
				
				// 高亮
				$('.songList').removeClass('active');
				$('.songList[data-index="' + index + '"]').addClass('active');
				
				$(".start em").css({ "background": "", "color": "" });
				$(".manyou").remove();
				$(".songList").css("background-color", "#f5f5f5");
				var currentEm = $(".start em[sonN=" + (index + 1) + "]");
				currentEm.css({
					"background": 'url("css/images/T1X4JEFq8qXXXaYEA_-11-12.gif") no-repeat',
					"color": "transparent"
				});
				currentEm.parent().parent().parent().css("background-color", "#f0f0f0");
				
				// 封面
				if (canvasImg) {
					canvasImg.src = 'images/' + (index + 1) + '.jpg';
					canvasImg.onload = function() {
						if (typeof loadBG === 'function') loadBG();
					};
					canvasImg.onerror = function() {
						canvasImg.src = 'images/2.jpg';
					};
				}
				
				// 歌词
				if (typeof getReady === 'function') {
					getReady(index + 1);
				}
				
				window.songIndex = index + 1;
				
				// 使用 fetch 加载音频
				$('#currentSongName').text(info.songName + ' (加载中...)');
				
				// 释放之前的 Blob URL
				if (currentBlobUrl) {
					URL.revokeObjectURL(currentBlobUrl);
					currentBlobUrl = null;
				}
				
				fetch(song.url)
					.then(function(response) {
						if (!response.ok) {
							throw new Error('HTTP ' + response.status + ': ' + response.statusText);
						}
						// 检查 Content-Type
						var contentType = response.headers.get('content-type') || '';
						if (!contentType.includes('audio') && !contentType.includes('octet-stream')) {
							console.warn('⚠️ 非音频 MIME 类型:', contentType);
						}
						return response.blob();
					})
					.then(function(blob) {
						// 检查 blob 类型
						if (!blob.type.includes('audio') && blob.type !== 'application/octet-stream') {
							console.warn('⚠️ Blob 类型异常:', blob.type);
						}
						currentBlobUrl = URL.createObjectURL(blob);
						audioEl.src = currentBlobUrl;
						audioEl.load();
						return audioEl.play();
					})
					.then(function() {
						isPlaying = true;
						updatePlayButtonUI();
						$('#currentSongName').text(info.songName);
						console.log('▶️ 播放中: ' + info.songName);
					})
					.catch(function(err) {
						console.error('❌ 加载失败:', err.message);
						$('#currentSongName').text(info.songName + ' (加载失败)');
						// 尝试直接播放（fallback）
						audioEl.src = song.url;
						audioEl.load();
						setTimeout(function() {
							audioEl.play().then(function() {
								isPlaying = true;
								updatePlayButtonUI();
								$('#currentSongName').text(info.songName);
							}).catch(function(e) {
								console.error('❌ Fallback 也失败:', e.message);
								alert('⚠️ 无法播放: ' + info.songName + '\n\n错误: ' + err.message);
							});
						}, 500);
					});
			}
			
			function togglePlay() {
				if (!audioEl.src || audioEl.src === '') {
					if (typeof MUSIC_DATA !== 'undefined' && MUSIC_DATA.length > 0) {
						playSong(0);
					}
					return;
				}
				
				if (isPlaying) {
					audioEl.pause();
					isPlaying = false;
					updatePlayButtonUI();
				} else {
					audioEl.play().then(function() {
						isPlaying = true;
						updatePlayButtonUI();
					}).catch(function(err) {
						console.warn('⚠️ 播放失败:', err.message);
					});
				}
			}
			
			function getNextIndex() {
				if (playMode === 1) return currentIndex;
				if (playMode === 2) {
					var idx;
					do { idx = Math.floor(Math.random() * MUSIC_DATA.length); } 
					while (idx === currentIndex && MUSIC_DATA.length > 1);
					return idx;
				}
				return (currentIndex + 1) % MUSIC_DATA.length;
			}
			
			function getPrevIndex() {
				if (playMode === 1) return currentIndex;
				if (playMode === 2) {
					var idx;
					do { idx = Math.floor(Math.random() * MUSIC_DATA.length); } 
					while (idx === currentIndex && MUSIC_DATA.length > 1);
					return idx;
				}
				return (currentIndex - 1 + MUSIC_DATA.length) % MUSIC_DATA.length;
			}
			
			function prevSong() {
				if (typeof MUSIC_DATA === 'undefined') return;
				playSong(getPrevIndex());
			}
			
			function nextSong() {
				if (typeof MUSIC_DATA === 'undefined') return;
				playSong(getNextIndex());
			}
			
			function toggleMode() {
				playMode = (playMode + 1) % 3;
				updateModeUI();
				console.log('🔄 模式: ' + modeNames[playMode]);
			}
			
			function formatTime(seconds) {
				if (isNaN(seconds) || seconds < 0) return '00:00';
				var m = Math.floor(seconds / 60);
				var s = Math.floor(seconds % 60);
				return (m < 10 ? '0' + m : m) + ':' + (s < 10 ? '0' + s : s);
			}
			
			function updateProgress() {
				if (audioEl.duration && !isNaN(audioEl.duration) && audioEl.duration > 0) {
					var percent = (audioEl.currentTime / audioEl.duration) * 100;
					if (percent > 100) percent = 100;
					if (progressPro1) progressPro1.style.width = percent + '%';
					if (progressPro2) progressPro2.style.left = percent + '%';
					if (currentTimeEl) currentTimeEl.textContent = formatTime(audioEl.currentTime);
					if (totalDurationEl) totalDurationEl.textContent = formatTime(audioEl.duration);
				}
			}
			
			function seekTo(e) {
				var progress = document.querySelector('.progress');
				if (!progress) return;
				var rect = progress.getBoundingClientRect();
				var percent = (e.clientX - rect.left) / rect.width;
				if (percent < 0) percent = 0;
				if (percent > 1) percent = 1;
				if (audioEl.duration && !isNaN(audioEl.duration)) {
					audioEl.currentTime = percent * audioEl.duration;
					updateProgress();
				}
			}
			
			// ===== 初始化 =====
			renderSongList();
			
			if (typeof MUSIC_DATA !== 'undefined' && MUSIC_DATA.length > 0) {
				var defaultInfo = parseSongInfo(MUSIC_DATA[0]);
				currentSongName.textContent = defaultInfo.songName;
				currentSongPlayer.textContent = defaultInfo.singer;
				updateModeUI();
				updatePlayButtonUI();
			}
			
			// 事件绑定
			$(playBtn).off('click');
			playBtn.addEventListener('click', function(e) {
				e.preventDefault();
				e.stopPropagation();
				togglePlay();
			});
			
			$(prevBtn).off('click');
			prevBtn.addEventListener('click', function(e) {
				e.preventDefault();
				prevSong();
			});
			
			$(nextBtn).off('click');
			nextBtn.addEventListener('click', function(e) {
				e.preventDefault();
				nextSong();
			});
			
			$(modeBtn).off('click');
			modeBtn.addEventListener('click', function(e) {
				e.preventDefault();
				toggleMode();
			});
			
			audioEl.addEventListener('play', function() {
				isPlaying = true;
				updatePlayButtonUI();
			});
			
			audioEl.addEventListener('pause', function() {
				isPlaying = false;
				updatePlayButtonUI();
			});
			
			audioEl.addEventListener('ended', function() {
				if (playMode === 1) {
					audioEl.currentTime = 0;
					audioEl.play();
				} else {
					nextSong();
				}
			});
			
			audioEl.addEventListener('timeupdate', function() {
				if (!isDragging) updateProgress();
			});
			
			audioEl.addEventListener('loadedmetadata', function() {
				updateProgress();
			});
			
			audioEl.addEventListener('error', function(e) {
				var err = audioEl.error;
				console.error('❌ 音频错误:', err ? err.code : '未知', err ? err.message : '');
				if (err && err.code === 4) {
					console.warn('⚠️ 格式不支持，尝试直接播放原始 URL');
					// 如果 Blob 失败，尝试直接播放
					var song = MUSIC_DATA[currentIndex];
					if (song) {
						audioEl.src = song.url;
						audioEl.load();
					}
				}
			});
			
			var progress = document.querySelector('.progress');
			if (progress) {
				progress.addEventListener('click', function(e) { seekTo(e); });
				if (dianBtn) {
					dianBtn.addEventListener('mousedown', function(e) {
						e.preventDefault();
						isDragging = true;
					});
					document.addEventListener('mousemove', function(e) {
						if (isDragging) seekTo(e);
					});
					document.addEventListener('mouseup', function(e) {
						if (isDragging) {
							isDragging = false;
							seekTo(e);
						}
					});
				}
			}
			
			document.addEventListener('keydown', function(e) {
				if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
				if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
				if (e.key === 'ArrowRight' && !e.ctrlKey && !e.metaKey) { e.preventDefault(); nextSong(); }
				if (e.key === 'ArrowLeft' && !e.ctrlKey && !e.metaKey) { e.preventDefault(); prevSong(); }
			});
			
			window.playSong = playSong;
			window.togglePlay = togglePlay;
			window.prevSong = prevSong;
			window.nextSong = nextSong;
			window.toggleMode = toggleMode;
			window.audio = audioEl;
			
			console.log('🎵 播放器已初始化，共 ' + (typeof MUSIC_DATA !== 'undefined' ? MUSIC_DATA.length : 0) + ' 首歌曲');
			console.log('💡 点击歌曲开始播放');
		})();
	</script>
