<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>发光微生物 · 毛玻璃音乐播放器</title>
    <!-- 原有样式 -->
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* 毛玻璃播放器 — 完全居中，半透明，最上层 */
        .music-player-wrapper {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 999;
            pointer-events: none; /* 让点击穿透，内部交互元素恢复 */
        }
        .glass-player {
            pointer-events: auto;
            background: rgba(20, 30, 50, 0.25);
            backdrop-filter: blur(18px) saturate(180%);
            -webkit-backdrop-filter: blur(18px) saturate(180%);
            border-radius: 48px;
            padding: 28px 36px;
            min-width: 340px;
            max-width: 520px;
            width: 90%;
            box-shadow: 0 24px 64px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            text-align: center;
            color: #fff;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.6);
            transition: all 0.2s;
        }
        .glass-player .song-title {
            font-size: 1.5rem;
            font-weight: 500;
            letter-spacing: 1px;
            margin-bottom: 18px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            padding: 0 6px;
            color: rgba(255, 255, 255, 0.96);
        }
        .glass-player .controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            flex-wrap: wrap;
        }
        .glass-player .ctrl-btn {
            background: rgba(255, 255, 255, 0.10);
            border: none;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border-radius: 40px;
            padding: 10px 18px;
            font-size: 1.2rem;
            color: #fff;
            cursor: pointer;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            border: 1px solid rgba(255, 255, 255, 0.10);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
            min-width: 48px;
            font-weight: 400;
        }
        .glass-player .ctrl-btn:hover {
            background: rgba(255, 255, 255, 0.22);
            transform: scale(1.02);
            border-color: rgba(255, 255, 255, 0.30);
        }
        .glass-player .ctrl-btn:active {
            transform: scale(0.94);
        }
        .glass-player .ctrl-btn.icon-only {
            font-size: 1.6rem;
            padding: 10px 14px;
            min-width: 48px;
        }
        .glass-player .ctrl-btn.mode-btn {
            font-size: 0.9rem;
            padding: 8px 14px;
            background: rgba(255, 215, 0, 0.10);
            border-color: rgba(255, 215, 0, 0.15);
        }
        .glass-player .ctrl-btn.mode-btn.active-mode {
            background: rgba(255, 215, 0, 0.20);
            border-color: #ffd966;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.10);
        }
        .glass-player .progress-area {
            margin-top: 18px;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.75);
        }
        .glass-player input[type="range"] {
            flex: 1;
            height: 4px;
            -webkit-appearance: none;
            appearance: none;
            background: rgba(255, 255, 255, 0.20);
            border-radius: 8px;
            outline: none;
            transition: background 0.2s;
        }
        .glass-player input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: white;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
            border: 2px solid rgba(255, 255, 255, 0.6);
        }
        .glass-player input[type="range"]::-moz-range-thumb {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: white;
            cursor: pointer;
            border: 2px solid rgba(255, 255, 255, 0.6);
        }
        .time-label {
            min-width: 40px;
            text-align: center;
            font-variant-numeric: tabular-nums;
        }
        .list-toggle {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #fff;
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 0.9rem;
            cursor: pointer;
            backdrop-filter: blur(4px);
            transition: 0.2s;
            margin-left: 4px;
        }
        .list-toggle:hover {
            background: rgba(255, 255, 255, 0.18);
        }
        /* 音乐列表浮层 */
        .music-list-panel {
            position: fixed;
            bottom: 110px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 460px;
            max-height: 300px;
            overflow-y: auto;
            background: rgba(10, 15, 30, 0.65);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-radius: 28px;
            padding: 14px 8px 14px 14px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 24px 64px rgba(0, 0, 0, 0.6);
            z-index: 1000;
            color: #fff;
            display: none;
            scrollbar-width: thin;
            scrollbar-color: rgba(255,255,255,0.12) transparent;
        }
        .music-list-panel::-webkit-scrollbar {
            width: 4px;
        }
        .music-list-panel::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.15);
            border-radius: 12px;
        }
        .music-list-panel ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .music-list-panel li {
            padding: 10px 14px;
            border-radius: 40px;
            margin-bottom: 4px;
            cursor: pointer;
            transition: 0.15s;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.95rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid transparent;
        }
        .music-list-panel li:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.06);
        }
        .music-list-panel li.active-song {
            background: rgba(255, 215, 0, 0.10);
            border-color: rgba(255, 215, 0, 0.20);
            font-weight: 500;
        }
        .music-list-panel li .index-badge {
            opacity: 0.5;
            font-size: 0.7rem;
            min-width: 24px;
        }
        .close-list-btn {
            position: sticky;
            top: 0;
            float: right;
            background: rgba(0,0,0,0.35);
            border: none;
            color: #fff;
            padding: 4px 14px;
            border-radius: 30px;
            font-size: 0.8rem;
            cursor: pointer;
            backdrop-filter: blur(4px);
            margin-bottom: 6px;
        }
        .close-list-btn:hover {
            background: rgba(200, 50, 50, 0.5);
        }
        @media (max-width: 500px) {
            .glass-player {
                padding: 20px 16px;
                min-width: unset;
                width: 92%;
                border-radius: 32px;
            }
            .glass-player .song-title {
                font-size: 1.2rem;
            }
            .glass-player .ctrl-btn {
                padding: 8px 10px;
                font-size: 1rem;
                min-width: 40px;
            }
            .glass-player .ctrl-btn.icon-only {
                font-size: 1.4rem;
                padding: 8px 10px;
            }
        }
    </style>
</head>
<body>
    <!-- 原有微生物动画 (由 script.js 等渲染) -->
    <script src='js/lvrjwz.js'></script>
    <script src='js/simplex-noise.min.js'></script>
    <script src="js/script.js"></script>

    <!-- 毛玻璃音乐播放器（完全居中） -->
    <div class="music-player-wrapper">
        <div class="glass-player" id="glassPlayer">
            <div class="song-title" id="songTitle">🎵 选择一首歌</div>
            
            <div class="controls">
                <button class="ctrl-btn icon-only" id="prevBtn" title="上一首">⏮</button>
                <button class="ctrl-btn icon-only" id="playBtn" title="播放/暂停">▶</button>
                <button class="ctrl-btn icon-only" id="nextBtn" title="下一首">⏭</button>
                <button class="ctrl-btn mode-btn" id="modeBtn" title="循环模式">🔁 列表</button>
                <button class="list-toggle" id="listToggleBtn">📋 歌单</button>
            </div>

            <div class="progress-area">
                <span class="time-label" id="currentTime">0:00</span>
                <input type="range" id="progressSlider" value="0" min="0" max="100" step="0.1">
                <span class="time-label" id="totalTime">0:00</span>
            </div>
        </div>
    </div>

    <!-- 音乐列表浮层 -->
    <div class="music-list-panel" id="musicListPanel">
        <button class="close-list-btn" id="closeListBtn">✕ 关闭</button>
        <ul id="songListUl"></ul>
    </div>

    <!-- 引入音乐数据 -->
    <script src="music.js"></script>

    <!-- 播放器逻辑 -->
    <script>
        (function() {
            // 确保 MUSIC_DATA 存在
            if (typeof MUSIC_DATA === 'undefined') {
                console.warn('MUSIC_DATA not found, using fallback.');
                window.MUSIC_DATA = [{ name: '示例歌曲', url: '' }];
            }

            const songs = MUSIC_DATA;
            let currentIndex = 0;
            let isPlaying = false;
            let mode = 'list'; // 'list', 'loop', 'random'
            const audio = new Audio();
            let isDragging = false;

            // DOM 元素
            const songTitleEl = document.getElementById('songTitle');
            const playBtn = document.getElementById('playBtn');
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');
            const modeBtn = document.getElementById('modeBtn');
            const progressSlider = document.getElementById('progressSlider');
            const currentTimeEl = document.getElementById('currentTime');
            const totalTimeEl = document.getElementById('totalTime');
            const listToggleBtn = document.getElementById('listToggleBtn');
            const musicListPanel = document.getElementById('musicListPanel');
            const closeListBtn = document.getElementById('closeListBtn');
            const songListUl = document.getElementById('songListUl');

            // 渲染歌单
            function renderSongList() {
                songListUl.innerHTML = '';
                songs.forEach((song, idx) => {
                    const li = document.createElement('li');
                    li.dataset.index = idx;
                    li.innerHTML = `<span class="index-badge">${idx+1}</span> ${song.name}`;
                    if (idx === currentIndex) li.classList.add('active-song');
                    li.addEventListener('click', () => {
                        playSongByIndex(idx);
                        closeList();
                    });
                    songListUl.appendChild(li);
                });
            }
            renderSongList();

            // 播放指定索引
            function playSongByIndex(index) {
                if (index < 0 || index >= songs.length) return;
                currentIndex = index;
                const song = songs[currentIndex];
                if (!song || !song.url) {
                    console.warn('无效歌曲', song);
                    return;
                }
                audio.src = song.url;
                audio.load();
                audio.play().then(() => {
                    isPlaying = true;
                    updatePlayButton();
                    updateTitle();
                    updateActiveInList();
                }).catch(err => {
                    console.warn('播放失败', err);
                    isPlaying = false;
                    updatePlayButton();
                });
                updateProgressDisplay();
            }

            function updateTitle() {
                if (songs[currentIndex]) {
                    songTitleEl.textContent = '🎵 ' + songs[currentIndex].name;
                } else {
                    songTitleEl.textContent = '🎵 未知歌曲';
                }
            }

            function togglePlay() {
                if (!audio.src || audio.src === '') {
                    playSongByIndex(0);
                    return;
                }
                if (isPlaying) {
                    audio.pause();
                    isPlaying = false;
                } else {
                    audio.play().then(() => {
                        isPlaying = true;
                    }).catch(e => {
                        console.warn('播放失败', e);
                        isPlaying = false;
                    });
                }
                updatePlayButton();
            }

            function updatePlayButton() {
                playBtn.textContent = isPlaying ? '⏸' : '▶';
            }

            function updateActiveInList() {
                const items = songListUl.querySelectorAll('li');
                items.forEach((li, idx) => {
                    li.classList.toggle('active-song', idx === currentIndex);
                });
            }

            function prevSong() {
                if (songs.length === 0) return;
                let newIndex = currentIndex - 1;
                if (newIndex < 0) newIndex = songs.length - 1;
                playSongByIndex(newIndex);
            }

            function nextSong() {
                if (songs.length === 0) return;
                let newIndex = currentIndex;
                if (mode === 'random') {
                    newIndex = Math.floor(Math.random() * songs.length);
                    while (songs.length > 1 && newIndex === currentIndex) {
                        newIndex = Math.floor(Math.random() * songs.length);
                    }
                } else if (mode === 'loop') {
                    newIndex = currentIndex;
                } else {
                    newIndex = (currentIndex + 1) % songs.length;
                }
                playSongByIndex(newIndex);
            }

            function switchMode() {
                if (mode === 'list') mode = 'loop';
                else if (mode === 'loop') mode = 'random';
                else if (mode === 'random') mode = 'list';
                updateModeButton();
            }

            function updateModeButton() {
                const modeMap = {
                    'list': '🔁 列表',
                    'loop': '🔂 单曲',
                    'random': '🎲 随机'
                };
                modeBtn.textContent = modeMap[mode] || '🔁 列表';
                modeBtn.classList.toggle('active-mode', mode === 'loop' || mode === 'random');
            }
            updateModeButton();

            function updateProgressDisplay() {
                if (!audio.duration || isNaN(audio.duration)) {
                    totalTimeEl.textContent = '0:00';
                    return;
                }
                const total = audio.duration;
                const current = audio.currentTime || 0;
                const percent = (current / total) * 100;
                if (!isDragging) {
                    progressSlider.value = percent;
                }
                currentTimeEl.textContent = formatTime(current);
                totalTimeEl.textContent = formatTime(total);
            }

            function formatTime(seconds) {
                if (isNaN(seconds)) return '0:00';
                const min = Math.floor(seconds / 60);
                const sec = Math.floor(seconds % 60);
                return `${min}:${sec.toString().padStart(2, '0')}`;
            }

            function toggleList() {
                if (musicListPanel.style.display === 'block') {
                    closeList();
                } else {
                    musicListPanel.style.display = 'block';
                    updateActiveInList();
                }
            }
            function closeList() {
                musicListPanel.style.display = 'none';
            }

            // --- 事件绑定 ---
            playBtn.addEventListener('click', togglePlay);
            prevBtn.addEventListener('click', prevSong);
            nextBtn.addEventListener('click', nextSong);
            modeBtn.addEventListener('click', switchMode);
            listToggleBtn.addEventListener('click', toggleList);
            closeListBtn.addEventListener('click', closeList);

            progressSlider.addEventListener('input', function(e) {
                isDragging = true;
                if (audio.duration) {
                    const val = parseFloat(e.target.value);
                    const seekTime = (val / 100) * audio.duration;
                    currentTimeEl.textContent = formatTime(seekTime);
                }
            });
            progressSlider.addEventListener('change', function(e) {
                isDragging = false;
                if (audio.duration) {
                    const val = parseFloat(e.target.value);
                    audio.currentTime = (val / 100) * audio.duration;
                    updateProgressDisplay();
                }
            });

            audio.addEventListener('timeupdate', updateProgressDisplay);
            audio.addEventListener('loadedmetadata', () => {
                updateProgressDisplay();
                if (audio.duration) totalTimeEl.textContent = formatTime(audio.duration);
            });
            audio.addEventListener('ended', function() {
                if (mode === 'loop') {
                    audio.currentTime = 0;
                    audio.play().catch(e => console.warn(e));
                } else {
                    nextSong();
                }
            });

            // 点击外部关闭列表
            document.addEventListener('click', function(e) {
                const panel = musicListPanel;
                const toggleBtn = listToggleBtn;
                if (panel.style.display === 'block') {
                    if (!panel.contains(e.target) && !toggleBtn.contains(e.target)) {
                        closeList();
                    }
                }
            });

            // 初始化：显示第一首但不自动播放
            if (songs.length) {
                songTitleEl.textContent = '🎵 ' + songs[0].name;
                audio.src = songs[0].url;
                audio.load();
                currentIndex = 0;
                updateActiveInList();
                audio.addEventListener('loadedmetadata', function() {
                    totalTimeEl.textContent = formatTime(audio.duration);
                });
            }

            console.log('✨ 毛玻璃播放器已启动 | 歌单数:', songs.length);
        })();
    </script>
</body>
</html>
