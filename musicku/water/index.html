<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>CSS3动画水墨风格带音乐特效</title>
    <style type="text/css">
        /* 保持原有样式不变 */
        * {
            padding: 0;
            margin: 0;
        }
        #box {
            width: 100%;
            height: 100%;
            position: relative;
            animation: run1 8s;
        }
        @keyframes run1 {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        #box img.bj {
            width: 100%;
        }
        #box img.sc1 {
            width: 15%;
            position: absolute;
            top: 60%;
            left: 85%;
            animation: run2 78s linear infinite 6s;
        }
        @keyframes run2 {
            from { left: 85%; }
            to { left: 25%; }
        }
        #box img.sc2 {
            width: 12%;
            position: absolute;
            top: 30%;
            left: 50%;
            animation: run3 20s linear infinite 4s;
        }
        @keyframes run3 {
            0% { width: 12%; }
            50% { width: 15%; }
            100% { width: 12%; }
        }
        #box img#lsm {
            position: absolute;
            top: 0;
            left: -900px;
            animation: run4 80s linear infinite 4s;
        }
        @keyframes run4 {
            from { left: -900px; }
            to { left: 0px; }
        }

        /* ----- 毛玻璃音乐播放器 (更明显的颜色) ----- */
        .music-player {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 999;
            background: rgba(20, 15, 25, 0.55);
            backdrop-filter: blur(16px) saturate(200%);
            -webkit-backdrop-filter: blur(16px) saturate(200%);
            border-radius: 48px;
            padding: 22px 36px;
            min-width: 360px;
            box-shadow: 0 16px 48px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 215, 180, 0.2);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            font-family: 'Segoe UI', 'PingFang SC', Roboto, system-ui, sans-serif;
            color: #fff5ea;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);
            transition: all 0.2s ease;
            user-select: none;
            pointer-events: auto;
            border: 1px solid rgba(255, 215, 180, 0.25);
        }

        /* 歌曲名称 - 更亮更清晰 */
        .music-player .song-title {
            font-size: 22px;
            font-weight: 600;
            letter-spacing: 1.5px;
            background: rgba(0, 0, 0, 0.45);
            padding: 8px 22px;
            border-radius: 40px;
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            border: 1px solid rgba(255, 215, 180, 0.3);
            width: 100%;
            text-align: center;
            box-sizing: border-box;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: #fff5ea;
            text-shadow: 0 0 12px rgba(255, 180, 100, 0.2);
        }

        /* ===== 进度条 (歌曲名称下方) ===== */
        .progress-area {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 2px 0;
        }
        .progress-area .time-label {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.7);
            font-variant-numeric: tabular-nums;
            min-width: 40px;
            text-align: center;
            font-weight: 300;
            letter-spacing: 0.3px;
        }
        .progress-area .time-label:first-child {
            text-align: right;
        }
        .progress-area .time-label:last-child {
            text-align: left;
        }
        .progress-track {
            flex: 1;
            height: 4px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 6px;
            cursor: pointer;
            position: relative;
            transition: height 0.2s;
            min-width: 60px;
        }
        .progress-track:hover {
            height: 6px;
            background: rgba(255, 255, 255, 0.25);
        }
        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #f9d976, #f39c12);
            border-radius: 6px;
            pointer-events: none;
            transition: width 0.05s linear;
            box-shadow: 0 0 12px rgba(243, 156, 18, 0.4);
        }

        /* 控制按钮容器 */
        .music-player .controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            margin-top: 2px;
            flex-wrap: wrap;
        }

        .music-player .controls button {
            background: rgba(30, 25, 35, 0.7);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 215, 180, 0.35);
            border-radius: 40px;
            color: #fff5ea;
            font-size: 17px;
            padding: 10px 18px;
            min-width: 56px;
            cursor: pointer;
            transition: 0.2s;
            font-weight: 500;
            letter-spacing: 0.5px;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            flex: 0 1 auto;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.4);
        }

        .music-player .controls button:hover {
            background: rgba(60, 50, 70, 0.85);
            border-color: rgba(255, 215, 180, 0.6);
            transform: scale(1.04);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            color: #fff;
        }

        .music-player .controls button:active {
            transform: scale(0.95);
        }

        .music-player .controls .btn-play {
            min-width: 80px;
            background: rgba(200, 140, 100, 0.35);
            border-color: rgba(255, 200, 160, 0.5);
            font-weight: 600;
            color: #fff5ea;
        }

        .music-player .controls .btn-play:hover {
            background: rgba(220, 160, 120, 0.5);
            border-color: rgba(255, 215, 180, 0.8);
        }

        .music-player .controls .mode-indicator {
            font-size: 14px;
            background: rgba(0, 0, 0, 0.5);
            padding: 6px 16px;
            border-radius: 30px;
            border: 1px solid rgba(255, 215, 180, 0.2);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            min-width: 56px;
            text-align: center;
            color: #f5e8d8;
            font-weight: 400;
            letter-spacing: 0.3px;
        }

        #modeBtn {
            background: rgba(40, 35, 50, 0.75);
            min-width: 50px;
        }
        #modeBtn:hover {
            background: rgba(70, 60, 80, 0.85);
        }

        /* ===== 音乐列表 (毛玻璃) ===== */
        .music-list-container {
            max-height: 0;
            overflow-y: auto;
            transition: max-height 0.4s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s ease, margin 0.3s ease;
            opacity: 0;
            margin-top: 0;
            scrollbar-width: thin;
            scrollbar-color: rgba(255,255,255,0.15) transparent;
            text-align: left;
            width: 100%;
        }
        .music-list-container.open {
            max-height: 200px;
            opacity: 1;
            margin-top: 12px;
        }
        .music-list-container::-webkit-scrollbar {
            width: 4px;
        }
        .music-list-container::-webkit-scrollbar-track {
            background: transparent;
        }
        .music-list-container::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
        }
        .music-list {
            list-style: none;
            padding: 4px 2px;
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 3px;
        }
        .music-list li {
            padding: 8px 16px;
            border-radius: 30px;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.15s, transform 0.1s;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid transparent;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: #ddd8f5;
            font-weight: 400;
            letter-spacing: 0.3px;
        }
        .music-list li:hover {
            background: rgba(255, 255, 255, 0.10);
            border-color: rgba(255, 255, 255, 0.08);
            color: #fff;
        }
        .music-list li.active {
            background: rgba(255, 215, 0, 0.13);
            border-color: rgba(255, 215, 0, 0.2);
            color: #ffecb0;
            font-weight: 500;
        }
        .music-list li.active::before {
            content: "▶ ";
            font-size: 0.7rem;
            opacity: 0.7;
        }

        #box {
            pointer-events: none;
        }
        #box img {
            pointer-events: none;
        }

        @media (max-width: 600px) {
            .music-player {
                min-width: 280px;
                padding: 18px 20px;
                border-radius: 36px;
            }
            .music-player .song-title {
                font-size: 18px;
                padding: 6px 14px;
            }
            .music-player .controls button {
                font-size: 14px;
                padding: 8px 12px;
                min-width: 44px;
            }
            .music-player .controls .btn-play {
                min-width: 64px;
            }
            .progress-area .time-label {
                font-size: 11px;
                min-width: 32px;
            }
            .music-list li {
                font-size: 12px;
                padding: 6px 12px;
            }
        }
    </style>
</head>
<body>
<div id="box">
    <!-- 原有图片素材 -->
    <img src="image/2b.png" class="bj" alt="背景">
    <img src="image/1s.png" class="sc1" alt="装饰1">
    <img src="image/2s.png" class="sc2" alt="装饰2">
    <img src="image/lsm.png" id="lsm" alt="长条">

    <!-- ===== 毛玻璃音乐播放器 ===== -->
    <div class="music-player" id="musicPlayer">
        <div class="song-title" id="songTitle">🎵 点击播放</div>

        <!-- 进度条 -->
        <div class="progress-area">
            <span class="time-label" id="timeCurrent">0:00</span>
            <div class="progress-track" id="progressTrack">
                <div class="progress-fill" id="progressFill" style="width:0%;"></div>
            </div>
            <span class="time-label" id="timeDuration">0:00</span>
        </div>

        <div class="controls">
            <button id="prevBtn" title="上一首">⏮</button>
            <button class="btn-play" id="playBtn">▶ 播放</button>
            <button id="nextBtn" title="下一首">⏭</button>
            <button id="modeBtn" title="切换播放模式">🔁</button>
            <span class="mode-indicator" id="modeIndicator">列表循环</span>
            <button id="listToggleBtn" title="歌单" style="font-size:16px; min-width:44px;">📋</button>
        </div>

        <!-- 音乐列表 -->
        <div class="music-list-container" id="musicListContainer">
            <ul class="music-list" id="musicList"></ul>
        </div>
    </div>
</div>

<!-- 引入 music.js (完整曲库) -->
<script src="music.js" type="text/javascript" charset="utf-8"></script>

<script>
(function() {
    // ---------- 使用 MUSIC_DATA (来自 music.js) ----------
    const list = window.MUSIC_DATA || [];
    if (!list.length) {
        document.getElementById('songTitle').innerHTML = '🎵 无音乐数据';
        return;
    }

    let currentIndex = 0;
    let isPlaying = false;
    let mode = 0; // 0: 列表循环, 1: 单曲循环, 2: 随机播放
    const modeNames = ['列表循环', '单曲循环', '随机播放'];
    const modeSymbols = ['🔁', '🔂', '🎲'];

    const audio = new Audio();

    // DOM 元素
    const songTitleEl = document.getElementById('songTitle');
    const playBtn = document.getElementById('playBtn');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const modeBtn = document.getElementById('modeBtn');
    const modeIndicator = document.getElementById('modeIndicator');
    const listToggleBtn = document.getElementById('listToggleBtn');
    const musicListContainer = document.getElementById('musicListContainer');
    const musicListUl = document.getElementById('musicList');

    // 进度条 DOM
    const progressFill = document.getElementById('progressFill');
    const progressTrack = document.getElementById('progressTrack');
    const timeCurrent = document.getElementById('timeCurrent');
    const timeDuration = document.getElementById('timeDuration');

    // ---------- 辅助函数 ----------
    function formatTime(seconds) {
        if (isNaN(seconds) || seconds === Infinity || seconds < 0) return '0:00';
        const mins = Math.floor(seconds / 60);
        const secs = Math.floor(seconds % 60);
        return mins + ':' + (secs < 10 ? '0' : '') + secs;
    }

    function updateProgress() {
        if (!audio.duration || isNaN(audio.duration) || audio.duration === Infinity) {
            progressFill.style.width = '0%';
            timeCurrent.textContent = '0:00';
            timeDuration.textContent = '0:00';
            return;
        }
        const percent = (audio.currentTime / audio.duration) * 100;
        progressFill.style.width = Math.min(percent, 100) + '%';
        timeCurrent.textContent = formatTime(audio.currentTime);
        timeDuration.textContent = formatTime(audio.duration);
    }

    // 进度条点击跳转
    progressTrack.addEventListener('click', function(e) {
        if (!audio.duration || isNaN(audio.duration)) return;
        const rect = this.getBoundingClientRect();
        const clickX = e.clientX - rect.left;
        const ratio = Math.min(1, Math.max(0, clickX / rect.width));
        audio.currentTime = ratio * audio.duration;
        updateProgress();
    });

    // ---------- 播放器核心 ----------
    function formatName(name) {
        if (!name) return '未知歌曲';
        return name.replace(/\.[^.]+$/, '');
    }

    function loadSong(index) {
        if (index < 0 || index >= list.length) return;
        currentIndex = index;
        const song = list[currentIndex];
        audio.src = song.url;
        audio.load();
        songTitleEl.textContent = '🎵 ' + formatName(song.name);
        // 高亮列表
        const items = musicListUl.querySelectorAll('li');
        items.forEach((li, i) => {
            li.classList.toggle('active', i === index);
        });
        progressFill.style.width = '0%';
        timeCurrent.textContent = '0:00';
        timeDuration.textContent = '0:00';
        if (isPlaying) {
            audio.play().catch(() => {});
        }
        updatePlayButton();
    }

    function togglePlay() {
        if (audio.paused) {
            audio.play().then(() => {
                isPlaying = true;
                updatePlayButton();
            }).catch(() => {
                isPlaying = false;
                updatePlayButton();
            });
        } else {
            audio.pause();
            isPlaying = false;
            updatePlayButton();
        }
    }

    function updatePlayButton() {
        playBtn.textContent = audio.paused ? '▶ 播放' : '⏸ 暂停';
    }

    function nextSong() {
        let nextIndex = currentIndex;
        if (mode === 2) { // 随机
            let newIdx = Math.floor(Math.random() * list.length);
            while (list.length > 1 && newIdx === currentIndex) {
                newIdx = Math.floor(Math.random() * list.length);
            }
            nextIndex = newIdx;
        } else {
            nextIndex = (currentIndex + 1) % list.length;
        }
        if (nextIndex < 0 || nextIndex >= list.length) nextIndex = 0;
        audio.pause();
        isPlaying = false;
        loadSong(nextIndex);
        audio.play().catch(() => {});
        updateUI();
    }

    function prevSong() {
        let prevIndex = currentIndex - 1;
        if (prevIndex < 0) prevIndex = list.length - 1;
        audio.pause();
        isPlaying = false;
        loadSong(prevIndex);
        audio.play().catch(() => {});
        updateUI();
    }

    function switchMode() {
        mode = (mode + 1) % 3;
        updateUI();
    }

    function updateUI() {
        modeIndicator.textContent = modeNames[mode];
        modeBtn.textContent = modeSymbols[mode];
    }

    function renderList() {
        musicListUl.innerHTML = '';
        list.forEach((song, idx) => {
            const li = document.createElement('li');
            li.textContent = formatName(song.name);
            li.dataset.index = idx;
            if (idx === currentIndex) li.classList.add('active');
            li.addEventListener('click', function() {
                const index = parseInt(this.dataset.index, 10);
                if (!isNaN(index) && index !== currentIndex) {
                    audio.pause();
                    isPlaying = false;
                    loadSong(index);
                    if (isPlaying) {
                        audio.play().catch(() => {});
                    } else {
                        isPlaying = true;
                        audio.play().catch(() => {});
                        updatePlayButton();
                    }
                } else if (index === currentIndex) {
                    togglePlay();
                }
                musicListContainer.classList.remove('open');
                listToggleBtn.textContent = '📋';
            });
            musicListUl.appendChild(li);
        });
    }

    // ---------- 事件绑定 ----------
    function initEvents() {
        playBtn.addEventListener('click', togglePlay);
        prevBtn.addEventListener('click', prevSong);
        nextBtn.addEventListener('click', nextSong);
        modeBtn.addEventListener('click', switchMode);

        listToggleBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            const isOpen = musicListContainer.classList.toggle('open');
            listToggleBtn.textContent = isOpen ? '✕' : '📋';
        });

        audio.addEventListener('timeupdate', updateProgress);
        audio.addEventListener('loadedmetadata', function() {
            timeDuration.textContent = formatTime(audio.duration);
            updateProgress();
        });

        audio.addEventListener('ended', function() {
            if (mode === 1) { // 单曲循环
                audio.currentTime = 0;
                audio.play().catch(() => {});
            } else {
                nextSong();
            }
        });

        // 点击外部关闭列表
        document.addEventListener('click', function(e) {
            const card = document.getElementById('musicPlayer');
            if (card && !card.contains(e.target) && musicListContainer.classList.contains('open')) {
                musicListContainer.classList.remove('open');
                listToggleBtn.textContent = '📋';
            }
        });

        // 键盘快捷键
        document.addEventListener('keydown', function(e) {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
            if (e.key === ' ' || e.key === 'Space') {
                e.preventDefault();
                playBtn.click();
            }
            if (e.key === 'ArrowRight') {
                e.preventDefault();
                nextBtn.click();
            }
            if (e.key === 'ArrowLeft') {
                e.preventDefault();
                prevBtn.click();
            }
            if (e.key === 'm' || e.key === 'M') {
                modeBtn.click();
            }
        });
    }

    // ---------- 初始化 ----------
    function init() {
        if (!list.length) {
            songTitleEl.textContent = '🎵 无音乐';
            return;
        }
        currentIndex = 0;
        renderList();
        loadSong(0);
        audio.pause();
        isPlaying = false;
        updatePlayButton();
        mode = 0;
        updateUI();
        initEvents();
        updateProgress();
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
    } else {
        init();
    }
})();
</script>
</body>
</html>
