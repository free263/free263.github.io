<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>万花筒特效 · 音乐播放器 (进度条+列表)</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" type="text/css" href="css/demo.css" />
    <script src="js/snap.svg-min.js"></script>
    <style>
        /* 样式初始化 + 播放器 (完全保留原有视觉) */
        * {
            margin: 0;
            padding: 0;
            list-style: none;
        }
        body {
            overflow-x: hidden;
            overflow-y: hidden;
            background-color: #000;
            font-size: 13px;
            color: #ffffff;
        }
        .box {
            height: 100vh;
            min-height: 520px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            background-color: #000;
        }
        .content {
            position: relative;
            width: 100%;
            height: 100%;
            background-color: #000;
        }
        .content li {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        .fish {
            position: absolute;
            z-index: 2;
            background-color: transparent;
            pointer-events: none;
        }
        /* 播放器容器 – 毛玻璃效果 (尺寸加大) */
        .music-player {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 640px;
            padding: 30px 36px;
            background: rgba(10, 10, 20, 0.4);
            backdrop-filter: blur(12px) saturate(180%);
            -webkit-backdrop-filter: blur(12px) saturate(180%);
            border-radius: 32px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 16px 48px rgba(0, 0, 0, 0.7);
            pointer-events: auto;
            color: #f0f0f0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            transition: 0.3s ease;
            text-align: center;
        }
        .music-player .song-name {
            font-size: 26px;
            font-weight: 500;
            letter-spacing: 1px;
            margin-bottom: 12px;
            text-shadow: 0 2px 8px rgba(0,0,0,0.6);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: #fff;
            background: rgba(0,0,0,0.25);
            padding: 10px 20px;
            border-radius: 50px;
            backdrop-filter: blur(4px);
            display: inline-block;
            max-width: 100%;
        }
        /* 控制按钮区域 */
        .player-controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 22px;
            margin-top: 6px;
            flex-wrap: wrap;
        }
        .player-controls button {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 60px;
            color: #fff;
            font-size: 26px;
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 16px rgba(0,0,0,0.4);
            background: rgba(30, 30, 50, 0.4);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.1);
        }
        .player-controls button:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: scale(1.05);
            border-color: rgba(255,255,255,0.4);
        }
        .player-controls button:active {
            transform: scale(0.92);
        }
        .player-controls .play-btn {
            width: 76px;
            height: 76px;
            font-size: 34px;
            background: rgba(255, 215, 0, 0.25);
            border-color: rgba(255, 215, 0, 0.3);
        }
        .player-controls .play-btn:hover {
            background: rgba(255, 215, 0, 0.4);
        }
        .player-controls .mode-btn {
            font-size: 22px;
            width: 56px;
            height: 56px;
            background: rgba(100, 200, 255, 0.08);
            border-color: rgba(100, 200, 255, 0.15);
        }
        .player-controls .mode-btn.active {
            background: rgba(255, 215, 0, 0.2);
            border-color: #ffd966;
            box-shadow: 0 0 12px rgba(255, 215, 0, 0.25);
        }

        /* ===== 进度条区域 (音乐名称下方) ===== */
        .progress-area {
            width: 100%;
            margin-top: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .progress-area .time-label {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.7);
            font-variant-numeric: tabular-nums;
            min-width: 44px;
            text-align: center;
            font-weight: 300;
            letter-spacing: 0.5px;
        }
        .progress-area .time-label:first-child {
            text-align: right;
        }
        .progress-area .time-label:last-child {
            text-align: left;
        }
        .progress-track {
            flex: 1;
            height: 5px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 6px;
            cursor: pointer;
            position: relative;
            transition: height 0.2s;
            min-width: 60px;
        }
        .progress-track:hover {
            height: 8px;
            background: rgba(255, 255, 255, 0.25);
        }
        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #f9d976, #f39c12);
            border-radius: 6px;
            pointer-events: none;
            transition: width 0.05s linear;
            box-shadow: 0 0 12px rgba(243, 156, 18, 0.4);
        }

        /* ===== 音乐列表 (毛玻璃) ===== */
        .music-list-container {
            max-height: 0;
            overflow-y: auto;
            transition: max-height 0.4s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s ease, margin 0.3s ease;
            opacity: 0;
            margin-top: 0;
            scrollbar-width: thin;
            scrollbar-color: rgba(255,255,255,0.15) transparent;
            text-align: left;
        }
        .music-list-container.open {
            max-height: 200px;
            opacity: 1;
            margin-top: 16px;
        }
        .music-list-container::-webkit-scrollbar {
            width: 4px;
        }
        .music-list-container::-webkit-scrollbar-track {
            background: transparent;
        }
        .music-list-container::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
        }
        .music-list {
            list-style: none;
            padding: 4px 2px;
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .music-list li {
            padding: 8px 16px;
            border-radius: 40px;
            font-size: 15px;
            cursor: pointer;
            transition: background 0.15s, transform 0.1s;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid transparent;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: #ddd8f5;
            font-weight: 400;
            letter-spacing: 0.3px;
        }
        .music-list li:hover {
            background: rgba(255, 255, 255, 0.10);
            border-color: rgba(255, 255, 255, 0.08);
            color: #fff;
        }
        .music-list li.active {
            background: rgba(255, 215, 0, 0.13);
            border-color: rgba(255, 215, 0, 0.2);
            color: #ffecb0;
            font-weight: 500;
        }
        .music-list li.active::before {
            content: "▶ ";
            font-size: 0.7rem;
            opacity: 0.7;
        }

        /* 底部保留 */
        .bottom-bar {
            position: absolute;
            width: 100%;
            height: 39px;
            z-index: 4;
            left: 0;
            bottom: -3px;
        }
        .bottom-icons {
            position: absolute;
            width: 50px;
            height: 50px;
            z-index: 7;
            left: 0;
            bottom: -3px;
            background-color: transparent;
        }

        @media (max-width: 800px) {
            .music-player { width: 80vw; padding: 24px 20px; }
            .music-player .song-name { font-size: 20px; padding: 8px 14px; }
            .player-controls button { width: 48px; height: 48px; font-size: 20px; }
            .player-controls .play-btn { width: 60px; height: 60px; font-size: 26px; }
            .player-controls .mode-btn { width: 44px; height: 44px; font-size: 18px; }
            .progress-area .time-label { font-size: 12px; min-width: 36px; }
        }
        @media (max-width: 500px) {
            .music-player { width: 92vw; padding: 16px 12px; }
            .music-player .song-name { font-size: 16px; }
            .player-controls { gap: 12px; }
            .player-controls button { width: 40px; height: 40px; font-size: 16px; }
            .player-controls .play-btn { width: 50px; height: 50px; font-size: 20px; }
            .player-controls .mode-btn { width: 36px; height: 36px; font-size: 14px; }
            .music-list li { font-size: 13px; padding: 6px 12px; }
        }
    </style>
</head>
<body>

<!-- 万花筒背景 -->
<div id="contents">
    <canvas id="canvas">This browser cannot use a canvas.</canvas>
</div>

<!-- 播放器容器 -->
<div class="fish" style="position:absolute; width:1350px; height:500px; z-index:99; left: 20px; top: 50px; background-color:transparent;">
    <div class="music-player" id="musicPlayer">
        <div class="song-name" id="songName">🎵 加载中...</div>

        <!-- 进度条 (位于歌曲名称下方) -->
        <div class="progress-area">
            <span class="time-label" id="timeCurrent">0:00</span>
            <div class="progress-track" id="progressTrack">
                <div class="progress-fill" id="progressFill" style="width:0%;"></div>
            </div>
            <span class="time-label" id="timeDuration">0:00</span>
        </div>

        <!-- 控制按钮 + 模式按钮 (模式按钮在下一首右侧) -->
        <div class="player-controls">
            <button id="prevBtn" title="上一首">⏮</button>
            <button id="playBtn" class="play-btn" title="播放/暂停">▶</button>
            <button id="nextBtn" title="下一首">⏭</button>
            <button id="modeBtn" class="mode-btn" title="循环模式">🔁</button>
            <button id="listToggleBtn" title="歌单" style="font-size:22px; width:56px; height:56px; background:rgba(255,255,255,0.04); border-color:rgba(255,255,255,0.08);">📋</button>
        </div>

        <!-- 音乐列表 -->
        <div class="music-list-container" id="musicListContainer">
            <ul class="music-list" id="musicList"></ul>
        </div>
    </div>
</div>

<!-- 底部装饰 (保留) -->
<div style="position:absolute; width:100%; height:39; z-index:4; left:0px; bottom: -3px;">
    <table style="border-collapse:collapse;width:100%; height:39;">
        <tr>
            <td align="left"><img src="./images/bottom-left.jpg" width="109" height="39" border="0" alt=""></td>
            <td align="center" width="100%" height="39" border="0" background="./images/bottom-center.jpg"></td>
            <td align="right"><img src="./images/bottom-right.jpg" width="273" height="39" border="0" alt=""></td>
        </tr>
    </table>
</div>

<!-- 引入 music.js (完整曲库) -->
<script src="music.js" type="text/javascript" charset="utf-8"></script>

<script>
(function() {
    // ---------- 使用 MUSIC_DATA (来自 music.js) ----------
    const list = window.MUSIC_DATA || [];
    if (!list.length) {
        document.getElementById('songName').innerHTML = '🎵 无音乐数据';
        return;
    }

    let currentIndex = 0;
    let isPlaying = false;
    let mode = 'loop';      // 'loop', 'repeat-one', 'shuffle'
    const audio = new Audio();

    // DOM 元素
    const songNameEl = document.getElementById('songName');
    const playBtn = document.getElementById('playBtn');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const modeBtn = document.getElementById('modeBtn');
    const listToggleBtn = document.getElementById('listToggleBtn');
    const musicListContainer = document.getElementById('musicListContainer');
    const musicListUl = document.getElementById('musicList');

    // 进度条 DOM
    const progressFill = document.getElementById('progressFill');
    const progressTrack = document.getElementById('progressTrack');
    const timeCurrent = document.getElementById('timeCurrent');
    const timeDuration = document.getElementById('timeDuration');

    // ---------- 辅助函数 ----------
    function formatTime(seconds) {
        if (isNaN(seconds) || seconds === Infinity || seconds < 0) return '0:00';
        const mins = Math.floor(seconds / 60);
        const secs = Math.floor(seconds % 60);
        return mins + ':' + (secs < 10 ? '0' : '') + secs;
    }

    function updateProgress() {
        if (!audio.duration || isNaN(audio.duration) || audio.duration === Infinity) {
            progressFill.style.width = '0%';
            timeCurrent.textContent = '0:00';
            timeDuration.textContent = '0:00';
            return;
        }
        const percent = (audio.currentTime / audio.duration) * 100;
        progressFill.style.width = Math.min(percent, 100) + '%';
        timeCurrent.textContent = formatTime(audio.currentTime);
        timeDuration.textContent = formatTime(audio.duration);
    }

    // 进度条点击跳转
    progressTrack.addEventListener('click', function(e) {
        if (!audio.duration || isNaN(audio.duration)) return;
        const rect = this.getBoundingClientRect();
        const clickX = e.clientX - rect.left;
        const ratio = Math.min(1, Math.max(0, clickX / rect.width));
        audio.currentTime = ratio * audio.duration;
        updateProgress();
    });

    // ---------- 播放器核心 ----------
    function formatName(name) {
        if (!name) return '未知歌曲';
        return name.replace(/\.[^.]+$/, '');
    }

    function loadSong(index) {
        const song = list[index];
        if (!song) return;
        audio.src = song.url;
        audio.load();
        songNameEl.textContent = '🎵 ' + formatName(song.name);
        // 高亮列表
        const items = musicListUl.querySelectorAll('li');
        items.forEach((li, i) => {
            li.classList.toggle('active', i === index);
        });
        progressFill.style.width = '0%';
        timeCurrent.textContent = '0:00';
        timeDuration.textContent = '0:00';
        if (isPlaying) {
            audio.play().catch(() => {});
        }
        updatePlayButton();
    }

    function togglePlay() {
        if (audio.paused) {
            audio.play().then(() => {
                isPlaying = true;
                updatePlayButton();
            }).catch(() => {
                isPlaying = false;
                updatePlayButton();
            });
        } else {
            audio.pause();
            isPlaying = false;
            updatePlayButton();
        }
    }

    function updatePlayButton() {
        playBtn.textContent = audio.paused ? '▶' : '⏸';
    }

    function nextSong() {
        if (mode === 'shuffle') {
            let newIdx = Math.floor(Math.random() * list.length);
            while (list.length > 1 && newIdx === currentIndex) {
                newIdx = Math.floor(Math.random() * list.length);
            }
            currentIndex = newIdx;
        } else {
            currentIndex = (currentIndex + 1) % list.length;
        }
        loadSong(currentIndex);
        if (isPlaying) {
            audio.play().catch(() => {});
        }
    }

    function prevSong() {
        currentIndex = (currentIndex - 1 + list.length) % list.length;
        loadSong(currentIndex);
        if (isPlaying) {
            audio.play().catch(() => {});
        }
    }

    function toggleMode() {
        if (mode === 'loop') {
            mode = 'repeat-one';
            modeBtn.textContent = '🔂';
            modeBtn.classList.add('active');
        } else if (mode === 'repeat-one') {
            mode = 'shuffle';
            modeBtn.textContent = '🔀';
            modeBtn.classList.remove('active');
        } else {
            mode = 'loop';
            modeBtn.textContent = '🔁';
            modeBtn.classList.remove('active');
        }
    }

    function renderList() {
        musicListUl.innerHTML = '';
        list.forEach((song, idx) => {
            const li = document.createElement('li');
            li.textContent = formatName(song.name);
            li.dataset.index = idx;
            if (idx === currentIndex) li.classList.add('active');
            li.addEventListener('click', function() {
                const index = parseInt(this.dataset.index, 10);
                if (!isNaN(index) && index !== currentIndex) {
                    currentIndex = index;
                    loadSong(currentIndex);
                    if (isPlaying) {
                        audio.play().catch(() => {});
                    } else {
                        isPlaying = true;
                        audio.play().catch(() => {});
                        updatePlayButton();
                    }
                } else if (index === currentIndex) {
                    togglePlay();
                }
                musicListContainer.classList.remove('open');
                listToggleBtn.textContent = '📋';
            });
            musicListUl.appendChild(li);
        });
    }

    // ---------- 事件绑定 ----------
    function initEvents() {
        playBtn.addEventListener('click', togglePlay);
        prevBtn.addEventListener('click', prevSong);
        nextBtn.addEventListener('click', nextSong);
        modeBtn.addEventListener('click', toggleMode);

        listToggleBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            const isOpen = musicListContainer.classList.toggle('open');
            listToggleBtn.textContent = isOpen ? '✕' : '📋';
        });

        audio.addEventListener('timeupdate', updateProgress);
        audio.addEventListener('loadedmetadata', function() {
            timeDuration.textContent = formatTime(audio.duration);
            updateProgress();
        });

        audio.addEventListener('ended', function() {
            if (mode === 'repeat-one') {
                audio.currentTime = 0;
                audio.play().catch(() => {});
            } else {
                nextSong();
            }
        });

        // 点击外部关闭列表
        document.addEventListener('click', function(e) {
            const card = document.getElementById('musicPlayer');
            if (card && !card.contains(e.target) && musicListContainer.classList.contains('open')) {
                musicListContainer.classList.remove('open');
                listToggleBtn.textContent = '📋';
            }
        });

        // 键盘快捷键
        document.addEventListener('keydown', function(e) {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
            if (e.key === ' ' || e.key === 'Space') {
                e.preventDefault();
                playBtn.click();
            }
            if (e.key === 'ArrowRight') {
                e.preventDefault();
                nextBtn.click();
            }
            if (e.key === 'ArrowLeft') {
                e.preventDefault();
                prevBtn.click();
            }
            if (e.key === 'm' || e.key === 'M') {
                modeBtn.click();
            }
        });
    }

    // ---------- 初始化 ----------
    function init() {
        if (!list.length) {
            songNameEl.textContent = '🎵 无音乐';
            return;
        }
        currentIndex = 0;
        renderList();
        loadSong(0);
        audio.pause();
        isPlaying = false;
        updatePlayButton();
        mode = 'loop';
        modeBtn.textContent = '🔁';
        modeBtn.classList.remove('active');
        initEvents();
        updateProgress();
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
    } else {
        init();
    }
})();
</script>

<!-- 万花筒 css-doodle 保留 -->
<style>
    css-doodle {
        --color: @p(#51eaea, #fffde1, #ff9d76, #FB3569);
        --rule: (
            :doodle {
                @grid: 30x1 / 18vmin;
                --deg: @p(-180deg, 180deg);
            }
            :container {
                perspective: 30vmin;
            }
            :after, :before {
                content: '';
                background: var(--color);
                @place-cell: @r(100%) @r(100%);
                @size: @r(6px);
                @shape: heart;
            }
            @place-cell: center;
            @size: 100%;
            box-shadow: @m(2, (0 0 50px var(--color)));
            background: @m(100, (
                radial-gradient(var(--color) 50%, transparent 0)
                @r(-20%, 120%) @r(-20%, 100%) / 1px 1px
                no-repeat
            ));
            will-change: transform, opacity;
            animation: scale-up 12s linear infinite;
            animation-delay: calc(-12s / @size() * @i());
            @keyframes scale-up {
                0%, 95.01%, 100% {
                    transform: translateZ(0) rotate(0);
                    opacity: 0;
                }
                10% { opacity: 1; }
                95% {
                    transform: translateZ(35vmin) rotateZ(@var(--deg));
                }
            }
        )
    }
</style>
<css-doodle use="var(--rule)"></css-doodle>
<script src='js/css-doodle.min.js'></script>

</body>
