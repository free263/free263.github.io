<!DOCTYPE HTML>
<html>
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
<title>css3空中飘浮的气球动画特效 + 音乐播放器</title>
<link href="css/index.css" rel="stylesheet" type="text/css"/>
<style>
/* 保持原有样式，额外增加播放器样式 (毛玻璃居中) */
/* 原样式已在 index.css 中，这里补充播放器相关 */

/* 播放器容器 - 绝对定位居中，覆盖在动画之上 */
.player-wrapper {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 90%;
  max-width: 340px;
  z-index: 20;
  pointer-events: none;
}
.player-card {
  background: rgba(20, 20, 30, 0.45);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-radius: 28px;
  padding: 18px 18px 20px;
  box-shadow: 0 12px 30px rgba(0, 0, 0, 0.6);
  border: 1px solid rgba(255, 255, 255, 0.15);
  color: #f0f0f0;
  font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  pointer-events: auto;
  transition: all 0.2s;
  text-align: center;
}
.player-card .song-name {
  font-size: 1rem;
  font-weight: 500;
  letter-spacing: 0.3px;
  margin-bottom: 6px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  padding: 0 4px;
  color: #fff;
  text-shadow: 0 1px 4px rgba(0,0,0,0.3);
}

/* ----- 进度条样式 ----- */
.progress-wrapper {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  margin-bottom: 12px;
  font-size: 0.7rem;
  color: rgba(255,255,255,0.7);
}
.progress-bar-bg {
  flex: 1;
  height: 4px;
  background: rgba(255,255,255,0.2);
  border-radius: 20px;
  cursor: pointer;
  position: relative;
  transition: height 0.1s;
}
.progress-bar-bg:hover {
  height: 6px;
  background: rgba(255,255,255,0.3);
}
.progress-fill {
  width: 0%;
  height: 100%;
  background: linear-gradient(90deg, #f9d976, #f39f86);
  border-radius: 20px;
  transition: width 0.05s linear;
  box-shadow: 0 0 8px rgba(243, 159, 134, 0.4);
}
.time-current, .time-duration {
  min-width: 32px;
  font-variant-numeric: tabular-nums;
  font-size: 0.65rem;
}

/* 控制按钮行 - 模式按钮和模式标签放在同一行 */
.player-controls {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  margin-bottom: 8px;
  flex-wrap: wrap;
}
.player-controls button {
  background: rgba(255, 255, 255, 0.08);
  border: none;
  border-radius: 40px;
  width: 40px;
  height: 40px;
  font-size: 20px;
  color: #f0f0f0;
  cursor: pointer;
  backdrop-filter: blur(4px);
  background: rgba(255, 255, 255, 0.1);
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
  transition: 0.2s;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  line-height: 1;
  flex-shrink: 0;
}
.player-controls button:hover {
  background: rgba(255, 255, 255, 0.25);
  transform: scale(1.02);
}
.player-controls button:active {
  transform: scale(0.94);
}
.player-controls .play-btn {
  width: 52px;
  height: 52px;
  font-size: 26px;
  background: rgba(255, 215, 100, 0.2);
  border: 1px solid rgba(255, 215, 100, 0.2);
}
.player-controls .play-btn:hover {
  background: rgba(255, 215, 100, 0.35);
}
.player-controls .mode-btn {
  font-size: 18px;
  width: 40px;
  height: 40px;
  background: rgba(200, 200, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.08);
  flex-shrink: 0;
}
.player-controls .mode-btn:hover {
  background: rgba(200, 200, 255, 0.2);
}

/* 模式标签 - 放在模式按钮右侧 */
.mode-label {
  font-size: 0.75rem;
  color: rgba(255,255,255,0.7);
  background: rgba(255,255,255,0.06);
  padding: 4px 14px;
  border-radius: 30px;
  border: 1px solid rgba(255,255,255,0.06);
  white-space: nowrap;
  cursor: default;
  user-select: none;
  flex-shrink: 0;
}

.list-toggle {
  margin-top: 6px;
}
.list-toggle button {
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 30px;
  padding: 4px 18px;
  color: #ddd;
  font-size: 0.75rem;
  cursor: pointer;
  backdrop-filter: blur(2px);
  transition: 0.2s;
}
.list-toggle button:hover {
  background: rgba(255,255,255,0.15);
}
.music-list-container {
  margin-top: 12px;
  max-height: 160px;
  overflow-y: auto;
  border-radius: 16px;
  background: rgba(0, 0, 0, 0.25);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  padding: 6px 4px;
  scrollbar-width: thin;
  scrollbar-color: rgba(255,255,255,0.2) transparent;
  display: none;
}
.music-list-container.show {
  display: block;
}
.music-list-container::-webkit-scrollbar {
  width: 4px;
}
.music-list-container::-webkit-scrollbar-track {
  background: transparent;
}
.music-list-container::-webkit-scrollbar-thumb {
  background: rgba(255,255,255,0.2);
  border-radius: 10px;
}
.music-list-item {
  padding: 6px 12px;
  border-radius: 30px;
  font-size: 0.8rem;
  color: #ddd;
  cursor: pointer;
  transition: 0.15s;
  display: flex;
  align-items: center;
  gap: 6px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.music-list-item:hover {
  background: rgba(255,255,255,0.1);
  color: #fff;
}
.music-list-item.active {
  background: rgba(255, 215, 100, 0.2);
  color: #ffd764;
  font-weight: 500;
}
.music-list-item .index-badge {
  opacity: 0.5;
  font-size: 0.65rem;
  margin-right: 4px;
  min-width: 24px;
  text-align: right;
}
.music-list-item .item-name {
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
}
/* 小屏适配 */
@media (max-width: 480px) {
  .player-card {
    padding: 14px 12px 16px;
  }
  .player-controls {
    gap: 6px;
  }
  .player-controls button {
    width: 34px;
    height: 34px;
    font-size: 16px;
  }
  .player-controls .play-btn {
    width: 44px;
    height: 44px;
    font-size: 22px;
  }
  .player-controls .mode-btn {
    width: 34px;
    height: 34px;
    font-size: 15px;
  }
  .mode-label {
    font-size: 0.65rem;
    padding: 2px 10px;
  }
  .progress-wrapper {
    font-size: 0.6rem;
    gap: 0.3rem;
  }
}

/* 确保body相对定位，让播放器绝对定位 */
body {
  position: relative;
  margin: 0;
  padding: 0;
  min-height: 100vh;
  background: #87CEEB;
  overflow: hidden;
}
</style>
</head>
<body>

<!-- 原有气球与云朵动画 (保持不变) -->
<div class="qiqiu1 qiqiu">
    <img src="images/201101asdsaf22135412367.png"/>
    <div class="text">love</div>
</div>
<div class="qiqiu2 qiqiu">
    <img src="images/201101ddd22135412367.png"/>
    <div class="text">love</div>
</div>
<div class="qiqiu3 qiqiu">
    <img src="images/20110122135aaaaa412367.png"/>
    <div class="text">love</div>
</div>
<div class="qiqiu4 qiqiu">
    <img src="images/20110122135s412367.png"/>
    <div class="text">love</div>
</div>
<div class="qiqiu5 qiqiu">
    <img src="images/20110122135412367.png"/>
    <div class="text">love</div>
</div>

<div class="yun1 yun"> </div>
<div class="yun2 yun"> </div>
<div class="yun3 yun"> </div>	
<div class="yun4 yun"> </div>

<!-- 音乐播放器 (毛玻璃居中) -->
<div class="player-wrapper">
  <div class="player-card">
    <div class="song-name" id="songNameDisplay">🎵 点击播放</div>

    <!-- 进度条 -->
    <div class="progress-wrapper">
      <span class="time-current" id="timeCurrent">0:00</span>
      <div class="progress-bar-bg" id="progressBarBg">
        <div class="progress-fill" id="progressFill" style="width:0%;"></div>
      </div>
      <span class="time-duration" id="timeDuration">0:00</span>
    </div>

    <!-- 控制按钮行：上一首 | 播放 | 下一首 | 模式按钮 + 模式标签 -->
    <div class="player-controls">
      <button id="prevBtn" title="上一首">⏮</button>
      <button class="play-btn" id="playBtn" title="播放/暂停">▶</button>
      <button id="nextBtn" title="下一首">⏭</button>
      <button class="mode-btn" id="modeBtn" title="切换模式">🔁</button>
      <span class="mode-label" id="modeLabel">顺序</span>
    </div>

    <div class="list-toggle">
      <button id="toggleListBtn">📋 歌单</button>
    </div>

    <!-- 音乐列表 -->
    <div class="music-list-container" id="musicListContainer"></div>
  </div>
</div>


<!-- 引入 music.js -->
<script src="music.js"></script>
<script>
(function() {
  // ----- 核心变量 -----
  const audio = new Audio();
  let currentIndex = 0;
  let isPlaying = false;
  let playMode = 'order'; // 'order' | 'shuffle' | 'loop'
  let progressRAF = null;

  const listContainer = document.getElementById('musicListContainer');
  const songNameDisplay = document.getElementById('songNameDisplay');
  const playBtn = document.getElementById('playBtn');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const modeBtn = document.getElementById('modeBtn');
  const modeLabel = document.getElementById('modeLabel');
  const toggleListBtn = document.getElementById('toggleListBtn');

  // 进度条元素
  const progressFill = document.getElementById('progressFill');
  const timeCurrent = document.getElementById('timeCurrent');
  const timeDuration = document.getElementById('timeDuration');
  const progressBarBg = document.getElementById('progressBarBg');

  // 数据来自 music.js 中的 MUSIC_DATA
  const musicData = typeof MUSIC_DATA !== 'undefined' ? MUSIC_DATA : [];

  // ----- 进度条辅助函数 -----
  function formatTime(seconds) {
    if (isNaN(seconds) || !isFinite(seconds)) return '0:00';
    const m = Math.floor(seconds / 60);
    const s = Math.floor(seconds % 60);
    return m + ':' + (s < 10 ? '0' : '') + s;
  }

  function updateProgress() {
    if (!audio.duration || isNaN(audio.duration)) {
      progressFill.style.width = '0%';
      timeCurrent.textContent = '0:00';
      timeDuration.textContent = '0:00';
      return;
    }
    const pct = (audio.currentTime / audio.duration) * 100;
    progressFill.style.width = Math.min(pct, 100) + '%';
    timeCurrent.textContent = formatTime(audio.currentTime);
    timeDuration.textContent = formatTime(audio.duration);
  }

  function startProgressLoop() {
    if (progressRAF) cancelAnimationFrame(progressRAF);
    function tick() {
      updateProgress();
      progressRAF = requestAnimationFrame(tick);
    }
    tick();
  }

  function stopProgressLoop() {
    if (progressRAF) {
      cancelAnimationFrame(progressRAF);
      progressRAF = null;
    }
  }

  // ----- 辅助函数 -----
  function formatSongName(item) {
    return item.name || '未知歌曲';
  }

  function loadSong(index) {
    if (!musicData.length) return;
    const safeIndex = (index + musicData.length) % musicData.length;
    currentIndex = safeIndex;
    const item = musicData[safeIndex];
    audio.src = item.url;
    audio.load();
    songNameDisplay.textContent = '🎵 ' + formatSongName(item);
    // 重置进度
    progressFill.style.width = '0%';
    timeCurrent.textContent = '0:00';
    if (audio.duration) timeDuration.textContent = formatTime(audio.duration);
    else timeDuration.textContent = '0:00';
    updateListActive();
    if (isPlaying) {
      audio.play().catch(() => {});
      startProgressLoop();
    } else {
      stopProgressLoop();
    }
  }

  function playPause() {
    if (!musicData.length) return;
    if (audio.paused) {
      audio.play().catch(() => {});
      isPlaying = true;
      playBtn.textContent = '⏸';
      startProgressLoop();
    } else {
      audio.pause();
      isPlaying = false;
      playBtn.textContent = '▶';
      stopProgressLoop();
    }
  }

  function prevSong() {
    if (!musicData.length) return;
    let newIndex = currentIndex - 1;
    if (newIndex < 0) newIndex = musicData.length - 1;
    loadSong(newIndex);
    if (!isPlaying) {
      isPlaying = true;
      playBtn.textContent = '⏸';
      audio.play().catch(() => {});
      startProgressLoop();
    } else {
      audio.play().catch(() => {});
    }
  }

  function nextSong() {
    if (!musicData.length) return;
    let newIndex;
    if (playMode === 'shuffle') {
      newIndex = Math.floor(Math.random() * musicData.length);
      if (musicData.length > 1 && newIndex === currentIndex) {
        newIndex = (currentIndex + 1) % musicData.length;
      }
    } else {
      newIndex = (currentIndex + 1) % musicData.length;
    }
    loadSong(newIndex);
    if (!isPlaying) {
      isPlaying = true;
      playBtn.textContent = '⏸';
      audio.play().catch(() => {});
      startProgressLoop();
    } else {
      audio.play().catch(() => {});
    }
  }

  function toggleMode() {
    const modes = ['order', 'shuffle', 'loop'];
    const labels = ['顺序', '随机', '单曲循环'];
    const icons = ['🔁', '🎲', '🔂'];
    let idx = modes.indexOf(playMode);
    idx = (idx + 1) % modes.length;
    playMode = modes[idx];
    modeLabel.textContent = labels[idx];
    modeBtn.textContent = icons[idx];
    audio.loop = (playMode === 'loop');
  }

  // 渲染列表
  function renderList() {
    if (!listContainer) return;
    listContainer.innerHTML = '';
    if (!musicData.length) {
      listContainer.innerHTML = '<div style="padding:10px;color:#aaa;font-size:0.8rem;">暂无歌曲</div>';
      return;
    }
    musicData.forEach((item, idx) => {
      const div = document.createElement('div');
      div.className = 'music-list-item';
      if (idx === currentIndex) div.classList.add('active');
      div.innerHTML = `
        <span class="index-badge">${idx+1}</span>
        <span class="item-name">${formatSongName(item)}</span>
      `;
      div.addEventListener('click', function(e) {
        e.stopPropagation();
        if (idx === currentIndex && isPlaying) {
          playPause();
          return;
        }
        loadSong(idx);
        if (!isPlaying) {
          isPlaying = true;
          playBtn.textContent = '⏸';
          audio.play().catch(() => {});
          startProgressLoop();
        } else {
          audio.play().catch(() => {});
        }
      });
      listContainer.appendChild(div);
    });
  }

  function updateListActive() {
    const items = listContainer.querySelectorAll('.music-list-item');
    items.forEach((el, idx) => {
      el.classList.toggle('active', idx === currentIndex);
    });
    const activeItem = listContainer.querySelector('.music-list-item.active');
    if (activeItem) {
      activeItem.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    }
  }

  function toggleList() {
    listContainer.classList.toggle('show');
    if (listContainer.classList.contains('show')) {
      updateListActive();
    }
  }

  // ----- 事件绑定 -----
  playBtn.addEventListener('click', playPause);
  prevBtn.addEventListener('click', prevSong);
  nextBtn.addEventListener('click', nextSong);
  modeBtn.addEventListener('click', toggleMode);
  toggleListBtn.addEventListener('click', toggleList);

  // 进度条点击跳转
  progressBarBg.addEventListener('click', function(e) {
    if (!audio.duration || isNaN(audio.duration)) return;
    const rect = this.getBoundingClientRect();
    const pct = (e.clientX - rect.left) / rect.width;
    audio.currentTime = pct * audio.duration;
    updateProgress();
  });

  audio.addEventListener('ended', function() {
    if (playMode === 'loop') {
      audio.currentTime = 0;
      audio.play().catch(() => {});
      startProgressLoop();
      return;
    }
    nextSong();
  });

  audio.addEventListener('loadedmetadata', function() {
    timeDuration.textContent = formatTime(audio.duration);
    updateProgress();
  });

  // 加载第一首歌
  function initPlayer() {
    if (musicData.length) {
      loadSong(0);
      isPlaying = false;
      playBtn.textContent = '▶';
      audio.pause();
      stopProgressLoop();
    } else {
      songNameDisplay.textContent = '🎵 无音乐';
    }
    renderList();
    modeLabel.textContent = '顺序';
    modeBtn.textContent = '🔁';
    audio.loop = false;
    timeDuration.textContent = '0:00';
    timeCurrent.textContent = '0:00';
    progressFill.style.width = '0%';
    // 点击外部关闭列表
    document.addEventListener('click', function(e) {
      const wrapper = document.querySelector('.player-wrapper');
      if (wrapper && !wrapper.contains(e.target)) {
        if (listContainer.classList.contains('show')) {
          listContainer.classList.remove('show');
        }
      }
    });
  }

  initPlayer();

})();
</script>
</body>
</html>
