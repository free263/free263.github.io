background-color: 000;

background-color: 000;

    /* 播放器容器 – 毛玻璃半透明 + 居中，尺寸加大：宽度翻倍，高度+50% */
    .music-player {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      /* 原宽度320px，翻倍为640px；原padding 20px 24px，适当调整 */
      width: 640px;

      background: rgba(20, 20, 30, 0.45);

      -webkit-backdrop-filter: blur(12px);

      pointer-events: auto;
      color: #f0f0f0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      transition: 0.3s ease;
      text-align: center;
      backdrop-filter: blur(12px) saturate(180%);
      -webkit-backdrop-filter: blur(12px) saturate(180%);
      background: rgba(10, 10, 20, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.15);
      /* 高度增加50%：原高度由内容撑起，通过增加内边距和控件大小实现视觉高度增加 */
    }
    /* 歌曲名称更大 */
    .music-player .song-name {
      font-size: 26px;
      font-weight: 500;
      letter-spacing: 1px;
      margin-bottom: 12px;
      text-shadow: 0 2px 8px rgba(0,0,0,0.6);

      padding: 10px 20px;
      border-radius: 50px;
      backdrop-filter: blur(4px);
      display: inline-block;
      max-width: 100%;
    }
    /* 进度条样式 */
    .progress-wrap {
      display: flex;
      align-items: center;
      gap: 14px;
      margin: 6px 0 16px 0;
      padding: 0 4px;
    }
    .progress-bar {
      flex: 1;
      height: 4px;
      background: rgba(255,255,255,0.15);
      border-radius: 6px;
      cursor: pointer;
      position: relative;
      transition: height 0.2s;
    }
    .progress-bar:hover { height: 6px; }
    .progress-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #b08aff, #d4bfff);
      border-radius: 6px;
      position: relative;
      transition: width 0.05s linear;
    }
    .progress-time {

      text-align: right;
      letter-spacing: 0.3px;

    /* 控制按钮区域，加大间距和尺寸 */
    .player-controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 18px;
      margin-top: 6px;
      flex-wrap: wrap;
    }
    .player-controls button {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 60px;
      color: #fff;
      font-size: 26px;
      width: 60px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
      background: rgba(30, 30, 50, 0.4);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.1);
    }
    .player-controls button:hover {
      background: rgba(255, 255, 255, 0.25);

      border-color: rgba(255,255,255,0.4);
    }
    .player-controls button:active {
      transform: scale(0.92);
    }
    .player-controls .play-btn {
      width: 76px;
      height: 76px;
      font-size: 34px;
      background: rgba(255, 215, 0, 0.25);
      border-color: rgba(255, 215, 0, 0.3);
    }
    .player-controls .play-btn:hover {
      background: rgba(255, 215, 0, 0.4);
    }
    /* 模式指示器，放在下一首右侧 */
    .mode-indicator {
      font-size: 18px;
      background: rgba(0,0,0,0.3);
      padding: 8px 20px;

    }
    .mode-indicator:hover {

    }
    /* 底部按钮区域保持原样 */

    /* 响应式：大屏适配，小屏缩小 */

        height: 50px;
        font-size: 20px;
      }

        font-size: 10px;
        min-width: 60px;
      }
    }

<script>
	(function () {
		//2016-13-10 begin
		var $banner_box = $("#banner_box"),
			$pages = $("#banner_list").find(".page_box"),
			  $mainBoxs = $pages.find(".main_box"),
			   $bgs = $pages.find(".bg_box img"),
			$controlBox = $("#control_box"),
			$productBtns = $("#product_btns"),
			$controls = $controlBox.find("a");
		var data = {
			pLength: $pages.length,//记录一共有多少个page_box
			curP: 0,
			isCan: true,
			isOnbtn: false,
			fColor: [2, 2, 1, 1, 1],
			dur: 3500,
			cNum: 0
		};

		//自动轮播换页函数
		var cId;
		var pageChange = function (idx) {
			if (data.isOnbtn)
				return;
			if (idx >= -1 && idx < data.pLength && idx != data.curP && data.isCan) {
				data.isCan = false;
				data.cNum++;
				clearInterval(cId);//停止动画
				idx = idx == -1 ? data.pLength - 1 : idx;//条件表达式 真前假后 指向最后一张
				$controls.removeClass("icon_show").eq(idx).addClass("icon_show");
				$pages.eq(data.curP).css({ zIndex: 0 });
				$pages.eq(idx).addClass("show").css({ opacity: 0, zIndex: 1 }).animate({ opacity: 1 }, 400, function () {
					$pages.eq(data.curP).removeClass("show");
					$(this).addClass("show");
					data.isCan = true;
					data.curP = idx;
					data.cNum--;
					if (data.cNum == 0) {
						//setInterval() 方法会不停地调用函数，直到 clearInterval() 被调用或窗口被关闭。
						cId = setInterval(function () {
							pageChange((data.curP + 1) % data.pLength);
							//% 求余数 当要处理 X % Y时, 如果, X < Y 的话, 回传值就是 X 自己 1 % 4 = 1
						}, data.dur);//data.dur 是时间
					}
				});
			}
		}
		//鼠标经过 下方导航
		$controls.on("mouseenter", function () {
			data.isCan = true;
			pageChange($controls.index(this));
			data.isOnbtn = true;
		});
		$controls.on("mouseleave", function () {
			data.isOnbtn = false;
		});

		cId = setInterval(function () {
			pageChange((data.curP + 1) % data.pLength);
		}, data.dur);

		//网页自由缩放  2016-10-12 调整
		var isIE6 = navigator.userAgent.indexOf("MSIE 6.0") > 0;//获取浏览器的版本
		//调整
		//页面自缩放
		var resize = function () {
			var w = $(window).width(),
				h = $(window).height();

			$banner_box.height(h);
			if (w / h < 1920 / 1080) {
				$bgs.height(h).css({ width: "auto", margin: -.5 * h + "px 0 0 " + -.5 * 1920 / 1080 * h + "px" });

			} else {
				$bgs.width(w).css({ height: "auto", margin: -.5 * w * 1080 / 1920 + "px 0 0 " + -.5 * w + "px" });
			}
			resize_img(w, h);//调用函数 改变内容图片大小

			var imgH = $bgs.height();
			$mainBoxs.height(imgH).css("margin-top", -.5 * imgH + "px");
			var cls;
			switch (true) {
				case w >= 1600: { cls = "big_view"; break; }
				case w < 1600 && w >= 1440: { cls = "mid_view"; break; }
				case w < 1440: { cls = "small_view"; break; }
			}
			var ws = $banner_box[0].className;
			if (isIE6 && (ws.indexOf("big") != -1 || ws.indexOf("mid") != -1 || ws.indexOf("small") != -1) && ws.indexOf(cls) == -1)
				location.reload();
			banner_box.className = "banner_box " + cls;
		};
		$(window).resize(resize);
		resize();

		function resize_img(w, h) {
			var snoww = w * 593 / 1920,
			   snowh = h * 448 / 1080;
			var roomw = w * 668 / 1920,
				roomh = h * 585 / 1080;
			var forestw = w * 500 / 1920,
				foresth = h * 636 / 1080;
			var skyw = w * 371 / 1920,
				skyh = h * 341 / 1080;
			if (w / h < 1920 / 1080) {
				//$(".snow_cot").height(snowh).css({ width: snowh * 宽 / 高 + "px", margin: "0 0 0" + -.5 * 宽 / 高 * snowh + "px" });
				$(".snow_cot").height(snowh).css({ width: snowh * 593 / 448 + "px", margin: "0 0 0" + -.5 * 593 / 448 * snowh + "px" });
				$(".room_cot").height(roomh).css({ width: roomh * 668 / 585 + "px", margin: "0 0 0" + -.5 * 400 / 585 * roomh + "px" });
				$(".forest_cot").height(foresth).css({ width: foresth * 500 / 636 + "px", margin: "0 0 0" + -.5 * 500 / 636 * foresth + "px" });
				$(".sky_cot").height(skyh).css({ width: skyh * 371 / 341 + "px" });

			} else {
				//$(".snow_cot").width(snoww).css({ height: snoww * 高 / 宽 + "px", margin: "0 0 0" + -.5 * snoww + "px" });
				$(".snow_cot").width(snoww).css({ height: snoww * 448 / 593 + "px", margin: "0 0 0" + -.5 * snoww + "px" });
				$(".room_cot").width(roomw).css({ height: roomw * 585 / 668 + "px", margin: "0 0 0" + -.5 * 400 * roomw / 668 + "px" });
				$(".forest_cot").width(forestw).css({ height: forestw * 636 / 500 + "px", margin: "0 0 0" + -.5 * forestw + "px" });
				$(".sky_cot").width(skyw).css({ height: skyw * 341 / 371 + "px" });
			}

		}
	})();
</script>

<!-- 内联音乐播放器逻辑 (使用Audio API + 进度条) -->
  <script>
    (function() {
      // 从外部 music.js 获取歌单
      if (typeof MUSIC_DATA === 'undefined') {
        console.warn('MUSIC_DATA 未加载，请确认 music.js 已引入');
        return;
      }
      const playlist = MUSIC_DATA;
      if (!playlist || playlist.length === 0) {
        console.warn('歌单为空');
        return;
      }

      // DOM 元素
      const songNameEl = document.getElementById('songName');
      const playBtn = document.getElementById('playBtn');
      const prevBtn = document.getElementById('prevBtn');
      const nextBtn = document.getElementById('nextBtn');
      const modeIndicator = document.getElementById('modeIndicator');
      const progressFill = document.getElementById('progressFill');
      const progressTime = document.getElementById('progressTime');
      const progressBar = document.getElementById('progressBar');

      // 状态
      let currentIndex = 0;
      let isPlaying = false;
      let mode = 'loop'; // 'loop', 'single', 'random'
      
      // 创建 Audio 对象
      const audio = new Audio();
      audio.volume = 0.7;

      // 格式化时间
      function formatTime(seconds) {
        if (isNaN(seconds) || !isFinite(seconds)) return '0:00';
        const m = Math.floor(seconds / 60);
        const s = Math.floor(seconds % 60);
        return m + ':' + (s < 10 ? '0' : '') + s;
      }

      // 更新进度条
      function updateProgress() {
        if (audio.duration && !isNaN(audio.duration) && isFinite(audio.duration)) {
          const pct = (audio.currentTime / audio.duration) * 100;
          progressFill.style.width = Math.min(pct, 100) + '%';
          progressTime.textContent = formatTime(audio.currentTime) + ' / ' + formatTime(audio.duration);
        } else {
          progressFill.style.width = '0%';
          progressTime.textContent = '0:00 / 0:00';
        }
      }

      // 加载歌曲
      function loadSong(index) {
        const song = playlist[index];
        if (!song) return;
        audio.src = song.url;
        songNameEl.textContent = song.name;
        // 重置进度显示
        progressFill.style.width = '0%';
        progressTime.textContent = '0:00 / 0:00';
        if (isPlaying) {
          audio.play().catch(err => {
            console.warn('自动播放被阻止，等待用户交互', err);
            isPlaying = false;
            updatePlayButton();
          });
        }
      }

      function updatePlayButton() {
        playBtn.textContent = isPlaying ? '⏸' : '▶';
      }

      function togglePlay() {
        if (audio.src === '') {
          loadSong(currentIndex);
        }
        if (isPlaying) {
          audio.pause();
          isPlaying = false;
        } else {
          audio.play().catch(err => {
            console.warn('播放失败，可能因自动播放策略', err);
            loadSong(currentIndex);
            audio.play().catch(e => console.warn(e));
          });
          isPlaying = true;
        }
        updatePlayButton();
      }

      function nextSong() {
        if (mode === 'random') {
          let newIndex;
          do {
            newIndex = Math.floor(Math.random() * playlist.length);
          } while (playlist.length > 1 && newIndex === currentIndex);
          currentIndex = newIndex;
        } else {
          currentIndex = (currentIndex + 1) % playlist.length;
        }
        loadSong(currentIndex);
        if (isPlaying) {
          audio.play().catch(() => {});
        }
        updateModeIndicator();
      }

      function prevSong() {
        if (mode === 'random') {
          let newIndex;
          do {
            newIndex = Math.floor(Math.random() * playlist.length);
          } while (playlist.length > 1 && newIndex === currentIndex);
          currentIndex = newIndex;
        } else {
          currentIndex = (currentIndex - 1 + playlist.length) % playlist.length;
        }
        loadSong(currentIndex);
        if (isPlaying) {
          audio.play().catch(() => {});
        }
        updateModeIndicator();
      }

      function toggleMode() {
        if (mode === 'loop') mode = 'single';
        else if (mode === 'single') mode = 'random';
        else if (mode === 'random') mode = 'loop';
        updateModeIndicator();
      }

      function updateModeIndicator() {
        const map = {
          'loop': '🔁 列表循环',
          'single': '🔂 单曲循环',
          'random': '🎲 随机播放'
        };
        modeIndicator.textContent = map[mode] || '🔁 列表循环';
      }

      // 音频事件
      audio.addEventListener('timeupdate', updateProgress);
      audio.addEventListener('loadedmetadata', function() {
        if (audio.duration && isFinite(audio.duration)) {
          progressTime.textContent = '0:00 / ' + formatTime(audio.duration);
        }
      });

      audio.addEventListener('ended', function() {
        if (mode === 'single') {
          audio.currentTime = 0;
          audio.play().catch(() => {});
        } else {
          nextSong();
        }
      });

      // 点击进度条跳转
      progressBar.addEventListener('click', function(e) {
        if (!audio.duration || isNaN(audio.duration) || !isFinite(audio.duration)) return;
        const rect = this.getBoundingClientRect();
        const pct = Math.min(Math.max((e.clientX - rect.left) / rect.width, 0), 1);
        audio.currentTime = pct * audio.duration;
        updateProgress();
      });

      // 初始化
      loadSong(0);
      isPlaying = false;
      updatePlayButton();
      updateModeIndicator();

      // 绑定事件
      playBtn.addEventListener('click', togglePlay);
      prevBtn.addEventListener('click', prevSong);
      nextBtn.addEventListener('click', nextSong);
      modeIndicator.addEventListener('click', toggleMode);
      
      // 键盘快捷键
      document.addEventListener('keydown', (e) => {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
        if (e.code === 'Space') {
          e.preventDefault();
          togglePlay();
        } else if (e.code === 'ArrowRight') {
          e.preventDefault();
          nextSong();
        } else if (e.code === 'ArrowLeft') {
          e.preventDefault();
          prevSong();
        } else if (e.code === 'KeyM') {
          toggleMode();
        }
      });

      console.log('🎵 音乐播放器已初始化，歌单数量:', playlist.length);
    })();
  </script>
</body>
</html>
