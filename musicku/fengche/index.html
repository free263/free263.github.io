<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>彩色大风车泡泡 · 音乐播放器</title>
  <!-- 保持原有样式引用，同时内联补充关键样式 -->
  <link rel="stylesheet" href="./css/style.css">
  <style>
    /* 保留原有全部样式，同时增加音乐播放器毛玻璃样式 */
    * {
      margin: 0;
      padding: 0;
      list-style: none;
    }
    body {
      overflow-x: hidden;
      overflow-y: hidden;
      background-color: #000;
      font-size: 13px;
      color: #ffffff;
    }
    .box {
      height: 100vh;
      min-height: 520px;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      background-color: #000;
    }
    .content {
      position: relative;
      width: 100%;
      height: 100%;
      background-color: #000;
    }
    .content li {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }
    .wrapper { 
      margin:0px auto; 
      padding:20px; 
      border:1px solid #CCC; 
      background:#333; 
      width:980px; 
      font-size:12px;
    }
    /* 让canvas和fish区域重叠，鱼div作为播放器容器 */
    .fish {
      position: absolute;
      z-index: 2;
      background-color: transparent;
      pointer-events: none;
    }
    /* 播放器容器 – 毛玻璃半透明 + 居中，尺寸加大：宽度翻倍，高度+50% */
    .music-player {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 640px;
      padding: 30px 36px;
      background: rgba(20, 20, 30, 0.45);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 32px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.7);
      pointer-events: auto;
      color: #f0f0f0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      transition: 0.3s ease;
      text-align: center;
      backdrop-filter: blur(12px) saturate(180%);
      -webkit-backdrop-filter: blur(12px) saturate(180%);
      background: rgba(10, 10, 20, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.15);
    }
    /* 歌曲名称更大 */
    .music-player .song-name {
      font-size: 26px;
      font-weight: 500;
      letter-spacing: 1px;
      margin-bottom: 14px;
      text-shadow: 0 2px 8px rgba(0,0,0,0.6);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #fff;
      background: rgba(0,0,0,0.25);
      padding: 10px 20px;
      border-radius: 50px;
      backdrop-filter: blur(4px);
      display: inline-block;
      max-width: 100%;
    }
    /* 进度条样式 */
    .music-player .progress-container {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 4px 16px 4px;
    }
    .music-player .progress-bar-track {
      flex: 1;
      height: 4px;
      background: rgba(255, 255, 255, 0.20);
      border-radius: 4px;
      cursor: pointer;
      position: relative;
      transition: height 0.15s;
    }
    .music-player .progress-bar-track:hover {
      height: 6px;
      background: rgba(255, 255, 255, 0.30);
    }
    .music-player .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #f0c060, #ffd700);
      border-radius: 4px;
      transition: width 0.05s linear;
      box-shadow: 0 0 12px rgba(255, 215, 0, 0.25);
    }
    .music-player .progress-time {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.70);
      min-width: 42px;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }
    /* 控制按钮区域，加大间距和尺寸 */
    .player-controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
      margin-top: 4px;
    }
    .player-controls button {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 60px;
      color: #fff;
      font-size: 26px;
      width: 60px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
      background: rgba(30, 30, 50, 0.4);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.1);
    }
    .player-controls button:hover {
      background: rgba(255, 255, 255, 0.25);
      transform: scale(1.05);
      border-color: rgba(255,255,255,0.4);
    }
    .player-controls button:active {
      transform: scale(0.92);
    }
    .player-controls .play-btn {
      width: 76px;
      height: 76px;
      font-size: 34px;
      background: rgba(255, 215, 0, 0.25);
      border-color: rgba(255, 215, 0, 0.3);
    }
    .player-controls .play-btn:hover {
      background: rgba(255, 215, 0, 0.4);
    }
    /* 模式按钮 - 放在下一首右侧 */
    .player-controls .mode-btn {
      font-size: 22px;
      width: 60px;
      height: 60px;
      background: rgba(200, 180, 100, 0.15);
      border-color: rgba(255, 215, 0, 0.15);
      letter-spacing: 1px;
    }
    .player-controls .mode-btn:hover {
      background: rgba(200, 180, 100, 0.30);
      border-color: rgba(255, 215, 0, 0.30);
    }
    /* 列表按钮 */
    .player-controls .list-btn {
      font-size: 22px;
      background: rgba(100, 150, 220, 0.15);
      border-color: rgba(100, 180, 255, 0.15);
    }
    .player-controls .list-btn:hover {
      background: rgba(100, 180, 255, 0.30);
      border-color: rgba(100, 180, 255, 0.30);
    }
    /* 歌单浮层 */
    .playlist-panel {
      position: absolute;
      top: calc(100% + 12px);
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      max-width: 500px;
      max-height: 200px;
      overflow-y: auto;
      background: rgba(8, 6, 28, 0.85);
      backdrop-filter: blur(22px) saturate(180%);
      -webkit-backdrop-filter: blur(22px) saturate(180%);
      border-radius: 20px;
      padding: 10px 8px;
      border: 1px solid rgba(255,255,255,0.06);
      box-shadow: 0 20px 40px rgba(0,0,0,0.8);
      display: none;
      scrollbar-width: thin;
      scrollbar-color: rgba(255,255,255,0.15) transparent;
      z-index: 100;
    }
    .playlist-panel.show { display: block; }
    .playlist-panel::-webkit-scrollbar { width: 4px; }
    .playlist-panel::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,0.2);
      border-radius: 12px;
    }
    .playlist-item {
      padding: 6px 14px;
      border-radius: 30px;
      font-size: 14px;
      color: #d6d0f0;
      cursor: pointer;
      transition: 0.15s;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin: 2px 0;
      border: 1px solid transparent;
    }
    .playlist-item:hover {
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
    }
    .playlist-item.active {
      background: rgba(160, 130, 255, 0.20);
      color: #fff;
      border-color: rgba(180, 150, 255, 0.2);
      font-weight: 500;
    }
    /* 底部按钮区域保持原样 */
    .bottom-bar {
      position: absolute;
      width: 100%;
      height: 39px;
      z-index: 4;
      left: 0;
      bottom: -3px;
    }
    .bottom-icons {
      position: absolute;
      width: 50px;
      height: 50px;
      z-index: 7;
      left: 0;
      bottom: -3px;
      background-color: transparent;
    }
    /* 响应式：大屏适配，小屏缩小 */
    @media (max-width: 800px) {
      .music-player {
        width: 80vw;
        padding: 24px 20px;
      }
      .music-player .song-name {
        font-size: 20px;
        padding: 8px 14px;
      }
      .player-controls button {
        width: 48px;
        height: 48px;
        font-size: 20px;
      }
      .player-controls .play-btn {
        width: 60px;
        height: 60px;
        font-size: 26px;
      }
      .player-controls .mode-btn {
        width: 48px;
        height: 48px;
        font-size: 18px;
      }
      .player-controls .list-btn {
        width: 48px;
        height: 48px;
        font-size: 18px;
      }
      .music-player .progress-time {
        font-size: 11px;
        min-width: 34px;
      }
    }
    @media (max-width: 500px) {
      .music-player {
        width: 92vw;
        padding: 16px 12px;
      }
      .music-player .song-name {
        font-size: 16px;
      }
      .player-controls {
        gap: 12px;
      }
      .player-controls button {
        width: 40px;
        height: 40px;
        font-size: 16px;
      }
      .player-controls .play-btn {
        width: 50px;
        height: 50px;
        font-size: 20px;
      }
      .player-controls .mode-btn {
        width: 40px;
        height: 40px;
        font-size: 15px;
      }
      .player-controls .list-btn {
        width: 40px;
        height: 40px;
        font-size: 15px;
      }
      .music-player .progress-time {
        font-size: 10px;
        min-width: 28px;
      }
      .playlist-panel {
        max-width: 95%;
        max-height: 150px;
      }
    }
  </style>
</head>
<body>

  <!-- 原始布局中的 fish 容器 (定位与原来一致) 我们将在其内部放置播放器 -->
  <div class="fish" style="position:absolute; width:1350px; height:500px; z-index:2; left:20px; top:50px; background-color:transparent; pointer-events:none;">
    <!-- 音乐播放器组件 (毛玻璃效果) 居中，尺寸已加大 -->
    <div class="music-player" id="musicPlayer">
      <div class="song-name" id="songName">🎵 梦幻泡泡</div>
      <!-- 进度条 -->
      <div class="progress-container">
        <span class="progress-time" id="currentTime">0:00</span>
        <div class="progress-bar-track" id="progressTrack">
          <div class="progress-bar-fill" id="progressFill"></div>
        </div>
        <span class="progress-time" id="totalTime">0:00</span>
      </div>
      <!-- 控制区：上一首 | 播放/暂停 | 下一首 | 模式按钮 | 列表按钮 -->
      <div class="player-controls">
        <button id="prevBtn" title="上一首">⏮</button>
        <button id="playBtn" class="play-btn" title="播放/暂停">▶</button>
        <button id="nextBtn" title="下一首">⏭</button>
        <button id="modeBtn" class="mode-btn" title="切换播放模式">🔁</button>
        <button id="listToggleBtn" class="list-btn" title="显示/隐藏歌单">📋</button>
      </div>
      <!-- 歌单浮层 -->
      <div class="playlist-panel" id="playlistPanel"></div>
    </div>
  </div>

  <!-- 底部和按钮 (完全保留原始结构) -->
  <div style="position:absolute; width:100%; height:39px; z-index:4; left:0px; bottom:-3px;">
    <table style="border-collapse:collapse;width:100%; height:39px;">
      <tr>
        <td align="left"><img src="./images/bottom-left.jpg" width="109" height="39" border="0" alt=""></td>
        <td align="center" width="100%" height="39" border="0" background="./images/bottom-center.jpg"></td>
        <td align="right"><img src="./images/bottom-right.jpg" width="273" height="39" border="0" alt=""></td>
      </tr>
    </table>
  </div>

  <div class="bottom-icons" style="position:absolute; width:50px; height:50px; z-index:7; left:0px; bottom:-3px; background-color:transparent;">
    <table>
      <tr>
        <td><a href="./index.html" target="_blank"><img src="./computer/space.gif" width="40" height="50" border="0" alt=""></a></td>
        <td width="20">&nbsp;</td>
        <td><a href="https://cloud.hhhnn.com" target="_blank"><img src="./computer/space.gif" width="40" height="50" border="0" alt=""></a></td>
        <td width="1050">&nbsp;</td>
        <td><a href="http://wx.qq.com/" target="_blank"><img src="./computer/space.gif" width="15" height="50" border="0" alt=""></a></td>
        <td width="10">&nbsp;</td>
        <td><a href="http://www.360.cn" target="_blank"><img src="./computer/space.gif" width="15" height="50" border="0" alt=""></a></td>
        <td width="7">&nbsp;</td>
        <td><a href="./musicku/coolsort/" target="_blank"><img src="./computer/space.gif" width="15" height="50" border="0" alt=""></a></td>
        <td width="6">&nbsp;</td>
        <td><a href="./musicku/coolsort/" target="_blank"><img src="./computer/space.gif" width="15" height="50" border="0" alt=""></a></td>
        <td width="4">&nbsp;</td>
        <td><a href="./musicku/coolsort/" target="_blank"><img src="./computer/space.gif" width="15" height="50" border="0" alt=""></a></td>
      </tr>
    </table>
  </div>

  <!-- canvas 动画 (原script) -->
  <canvas id="canvas">Canvas not supported.</canvas>
  <script src="js/script.js"></script>

  <!-- 引入 music.js (包含完整歌单) -->
  <script src="music.js"></script>

  <!-- 音乐播放器逻辑 (使用 music.js 中的 MUSIC_DATA) -->
  <script>
    (function() {
      'use strict';

      // 从全局获取歌单数据 (由 music.js 定义)
      const playlist = window.MUSIC_DATA || [];

      if (playlist.length === 0) {
        document.getElementById('songName').textContent = '⚠️ 无歌单数据';
        console.warn('music.js 未加载或 MUSIC_DATA 为空');
        return;
      }

      // DOM 元素
      const songNameEl = document.getElementById('songName');
      const playBtn = document.getElementById('playBtn');
      const prevBtn = document.getElementById('prevBtn');
      const nextBtn = document.getElementById('nextBtn');
      const modeBtn = document.getElementById('modeBtn');
      const listToggleBtn = document.getElementById('listToggleBtn');
      const playlistPanel = document.getElementById('playlistPanel');

      // 进度元素
      const progressFill = document.getElementById('progressFill');
      const progressTrack = document.getElementById('progressTrack');
      const currentTimeEl = document.getElementById('currentTime');
      const totalTimeEl = document.getElementById('totalTime');

      // 状态
      let currentIndex = 0;
      let isPlaying = false;
      let mode = 0; // 0: 列表循环, 1: 单曲循环, 2: 随机
      const modeSymbols = ['🔁', '🔂', '🎲'];
      const modeNames = ['列表循环', '单曲循环', '随机'];
      const audio = new Audio();
      audio.volume = 0.7;

      // --- 辅助函数 ---
      function formatTime(sec) {
        if (isNaN(sec) || sec < 0) sec = 0;
        const mins = Math.floor(sec / 60);
        const secs = Math.floor(sec % 60);
        return mins + ':' + (secs < 10 ? '0' : '') + secs;
      }

      function updateProgress() {
        if (audio.duration && !isNaN(audio.duration)) {
          const percent = (audio.currentTime / audio.duration) * 100;
          progressFill.style.width = Math.min(percent, 100) + '%';
          currentTimeEl.textContent = formatTime(audio.currentTime);
          totalTimeEl.textContent = formatTime(audio.duration);
        } else {
          progressFill.style.width = '0%';
          currentTimeEl.textContent = '0:00';
          totalTimeEl.textContent = '0:00';
        }
      }

      // --- 列表渲染 ---
      function renderPlaylist() {
        if (!playlistPanel) return;
        playlistPanel.innerHTML = '';
        playlist.forEach((item, idx) => {
          const div = document.createElement('div');
          div.className = 'playlist-item' + (idx === currentIndex ? ' active' : '');
          div.textContent = (idx + 1) + '. ' + (item.name || '未知歌曲');
          div.dataset.index = idx;
          div.addEventListener('click', function() {
            const index = parseInt(this.dataset.index);
            if (!isNaN(index) && index >= 0 && index < playlist.length) {
              currentIndex = index;
              playSong(currentIndex);
              updateListActive();
              playlistPanel.classList.remove('show');
            }
          });
          playlistPanel.appendChild(div);
        });
      }

      function updateListActive() {
        const items = playlistPanel.querySelectorAll('.playlist-item');
        items.forEach((item, idx) => {
          if (idx === currentIndex) {
            item.classList.add('active');
          } else {
            item.classList.remove('active');
          }
        });
      }

      function toggleList() {
        playlistPanel.classList.toggle('show');
        if (playlistPanel.classList.contains('show')) {
          renderPlaylist();
        }
      }

      // --- 播放核心 ---
      function playSong(index) {
        const song = playlist[index];
        if (!song || !song.url) {
          console.warn('歌曲URL无效，尝试下一首');
          nextSong();
          return;
        }
        if (audio.src !== song.url) {
          audio.src = song.url;
          audio.load();
        }
        songNameEl.textContent = song.name || '未知歌曲';
        audio.addEventListener('loadedmetadata', updateProgress);
        audio.play().then(() => {
          isPlaying = true;
          playBtn.textContent = '⏸';
          updateProgress();
        }).catch(err => {
          console.warn('播放失败:', err.message);
          nextSong();
        });
        updateListActive();
      }

      function pauseSong() {
        audio.pause();
        isPlaying = false;
        playBtn.textContent = '▶';
      }

      function togglePlay() {
        if (isPlaying) {
          pauseSong();
        } else {
          if (audio.ended || !audio.src) {
            playSong(currentIndex);
          } else {
            audio.play().then(() => {
              isPlaying = true;
              playBtn.textContent = '⏸';
              updateProgress();
            }).catch(() => {
              playSong(currentIndex);
            });
          }
        }
      }

      function nextSong() {
        if (mode === 2) { // 随机
          randomSong();
          return;
        }
        currentIndex = (currentIndex + 1) % playlist.length;
        playSong(currentIndex);
      }

      function prevSong() {
        if (mode === 2) {
          randomSong();
          return;
        }
        currentIndex = (currentIndex - 1 + playlist.length) % playlist.length;
        playSong(currentIndex);
      }

      function randomSong() {
        let newIndex;
        if (playlist.length <= 1) {
          newIndex = 0;
        } else {
          do {
            newIndex = Math.floor(Math.random() * playlist.length);
          } while (newIndex === currentIndex);
        }
        currentIndex = newIndex;
        playSong(currentIndex);
      }

      function toggleMode() {
        mode = (mode + 1) % 3;
        modeBtn.textContent = modeSymbols[mode];
        modeBtn.title = modeNames[mode];
      }

      // --- 音频事件 ---
      audio.addEventListener('timeupdate', updateProgress);
      audio.addEventListener('ended', function() {
        if (mode === 1) { // 单曲循环
          audio.currentTime = 0;
          audio.play().catch(() => {});
          updateProgress();
        } else {
          nextSong();
        }
      });

      // 点击进度条跳转
      progressTrack.addEventListener('click', function(e) {
        if (!audio.duration || isNaN(audio.duration)) return;
        const rect = this.getBoundingClientRect();
        const ratio = (e.clientX - rect.left) / rect.width;
        const seekTime = ratio * audio.duration;
        audio.currentTime = seekTime;
        updateProgress();
      });

      // --- 初始化 ---
      function initPlayer() {
        if (playlist.length > 0) {
          const first = playlist[0];
          songNameEl.textContent = first.name || '未知歌曲';
          audio.src = first.url;
          audio.load();
          audio.addEventListener('loadedmetadata', updateProgress);
        } else {
          songNameEl.textContent = '⚠️ 无歌单';
        }
        modeBtn.textContent = modeSymbols[mode];
        modeBtn.title = modeNames[mode];
        playBtn.textContent = '▶';
        isPlaying = false;
        renderPlaylist();
        updateListActive();
        updateProgress();
      }

      // --- 事件绑定 ---
      playBtn.addEventListener('click', togglePlay);
      prevBtn.addEventListener('click', prevSong);
      nextBtn.addEventListener('click', nextSong);
      modeBtn.addEventListener('click', toggleMode);
      listToggleBtn.addEventListener('click', toggleList);

      // 键盘快捷键
      document.addEventListener('keydown', (e) => {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
        if (e.code === 'Space') {
          e.preventDefault();
          togglePlay();
        } else if (e.code === 'ArrowRight') {
          e.preventDefault();
          nextSong();
        } else if (e.code === 'ArrowLeft') {
          e.preventDefault();
          prevSong();
        } else if (e.code === 'KeyM') {
          toggleMode();
        } else if (e.code === 'KeyL') {
          toggleList();
        }
      });

      // 点击外部关闭列表
      document.addEventListener('click', (e) => {
        if (playlistPanel && playlistPanel.classList.contains('show')) {
          const target = e.target;
          if (!playlistPanel.contains(target) && target !== listToggleBtn && !listToggleBtn.contains(target)) {
            playlistPanel.classList.remove('show');
          }
        }
      });

      initPlayer();
      window.__music = { togglePlay, nextSong, prevSong, toggleMode, playlist, currentIndex, audio };
    })();
  </script>

</body>
</html>
