﻿<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
<title>jQuery云朵随机飘动 · 音乐播放器</title>
<link type="text/css" href="css/style.css" rel="stylesheet" />
<style>
/* ----- 音乐播放器 - 页面正中央 上下左右居中 ----- */
.music-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    pointer-events: none;  /* 让点击穿透背景，但播放器内部可交互 */
    z-index: 9999;
}
.music-overlay .music-player {
    pointer-events: auto;   /* 播放器自身可交互 */
    background: rgba(255, 255, 255, 0.18);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-radius: 48px;
    padding: 22px 32px;
    max-width: 520px;
    width: 90%;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
    border: 1px solid rgba(255, 255, 255, 0.3);
    color: #1e2a3a;
    font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
    transition: all 0.2s;
    box-sizing: border-box;
}
.music-player .track-info {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-weight: 500;
    font-size: 1rem;
    margin-bottom: 8px;
    text-shadow: 0 1px 4px rgba(255,255,255,0.2);
}
.music-player .track-name {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 60%;
    color: #0b1a2b;
    font-weight: 600;
}
.music-player .track-time {
    font-size: 0.85rem;
    background: rgba(0,0,0,0.08);
    padding: 2px 14px;
    border-radius: 30px;
    backdrop-filter: blur(2px);
}
.music-player .progress-bar {
    width: 100%;
    height: 5px;
    background: rgba(0, 0, 0, 0.15);
    border-radius: 10px;
    margin: 10px 0 14px 0;
    cursor: pointer;
    position: relative;
    transition: height 0.1s;
}
.music-player .progress-bar:hover {
    height: 7px;
}
.music-player .progress-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #6a8cff, #a77bff);
    border-radius: 10px;
    transition: width 0.1s linear;
    box-shadow: 0 0 12px rgba(106, 140, 255, 0.4);
}
.music-player .controls {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
}
.music-player .controls button {
    background: rgba(255, 255, 255, 0.3);
    backdrop-filter: blur(4px);
    border: none;
    border-radius: 40px;
    padding: 8px 18px;
    font-size: 1rem;
    font-weight: 600;
    color: #1a2634;
    box-shadow: 0 2px 12px rgba(0,0,0,0.05);
    cursor: pointer;
    transition: 0.15s;
    border: 1px solid rgba(255,255,255,0.3);
    display: inline-flex;
    align-items: center;
    gap: 6px;
    min-width: 56px;
    justify-content: center;
}
.music-player .controls button:hover {
    background: rgba(255, 255, 255, 0.6);
    transform: scale(1.02);
    box-shadow: 0 6px 20px rgba(0,0,0,0.1);
}
.music-player .controls button:active {
    transform: scale(0.95);
}
.music-player .controls .mode-btn {
    background: rgba(200, 180, 255, 0.25);
    min-width: 70px;
}
.music-player .controls .mode-btn.active-mode {
    background: rgba(130, 170, 255, 0.45);
    border-color: #7a9eff;
}
/* 音乐列表 - 毛玻璃风格 */
.music-list {
    margin-top: 16px;
    max-height: 160px;
    overflow-y: auto;
    background: rgba(0,0,0,0.04);
    backdrop-filter: blur(6px);
    border-radius: 28px;
    padding: 8px 4px;
    border: 1px solid rgba(255,255,255,0.15);
    display: none;
    scrollbar-width: thin;
}
.music-list.show {
    display: block;
}
.music-list::-webkit-scrollbar {
    width: 4px;
}
.music-list::-webkit-scrollbar-thumb {
    background: rgba(255,255,255,0.3);
    border-radius: 10px;
}
.music-list .list-item {
    padding: 6px 16px;
    border-radius: 30px;
    cursor: pointer;
    transition: 0.1s;
    display: flex;
    justify-content: space-between;
    font-size: 0.9rem;
    color: #1b2a3a;
    border-bottom: 1px solid rgba(255,255,255,0.05);
}
.music-list .list-item:hover {
    background: rgba(255,255,255,0.2);
}
.music-list .list-item.active-song {
    background: rgba(255,255,255,0.3);
    font-weight: 600;
}
.music-list .list-item .index {
    opacity: 0.6;
    margin-right: 10px;
}
/* 小屏适配 */
@media (max-width: 600px) {
    .music-overlay .music-player { padding: 18px 18px; max-width: 95%; }
    .music-player .controls button { padding: 6px 12px; font-size: 0.9rem; min-width: 48px; }
}
</style>
</head>
<body>

<!-- ===== 原始结构：主场景 + 云朵 + 太阳 ===== -->
<div id="mainBody">
    <div id="cloud1" class="cloud"></div>
    <div id="cloud2" class="cloud"></div>
</div>

<!-- 太阳 (保持原始位置，由 style.css 控制) -->
<div id="weather">
	<img src="images/cloud.png" width="300" />
</div>

<!-- ===== 音乐播放器 - 页面正中央 上下左右居中 ===== -->
<div class="music-overlay">
    <div class="music-player" id="musicPlayer">
        <div class="track-info">
            <span class="track-name" id="trackName">🎵 选择一首歌</span>
            <span class="track-time" id="trackTime">0:00 / 0:00</span>
        </div>
        <div class="progress-bar" id="progressBar">
            <div class="progress-fill" id="progressFill" style="width:0%;"></div>
        </div>
        <div class="controls">
            <button id="prevBtn" title="上一首">⏮</button>
            <button id="playBtn" title="播放/暂停">▶</button>
            <button id="nextBtn" title="下一首">⏭</button>
            <button id="modeBtn" class="mode-btn" title="循环模式">🔁 列表</button>
            <button id="listToggleBtn" title="显示/隐藏歌单">📋</button>
        </div>
        <!-- 音乐列表 -->
        <div class="music-list" id="musicListContainer"></div>
    </div>
</div>

<script src="js/jquery-1.7.min.js" type="text/javascript"></script>
<script src="js/common.js" type="text/javascript"></script>
<script src="music.js" type="text/javascript"></script>

<script type="text/javascript">
// ----- 音乐播放器逻辑 (ES5风格, 兼容) -----
(function() {
    if (typeof MUSIC_DATA === 'undefined' || !MUSIC_DATA.length) {
        console.warn('MUSIC_DATA 未加载, 使用占位数据');
        window.MUSIC_DATA = [{ name: '示例歌曲', url: '' }];
    }
    var playlist = MUSIC_DATA;
    var currentIndex = 0;
    var isPlaying = false;
    var mode = 'list';
    var audio = new Audio();
    var progressFill = document.getElementById('progressFill');
    var trackNameEl = document.getElementById('trackName');
    var trackTimeEl = document.getElementById('trackTime');
    var playBtn = document.getElementById('playBtn');
    var prevBtn = document.getElementById('prevBtn');
    var nextBtn = document.getElementById('nextBtn');
    var modeBtn = document.getElementById('modeBtn');
    var listToggleBtn = document.getElementById('listToggleBtn');
    var listContainer = document.getElementById('musicListContainer');
    var progressBar = document.getElementById('progressBar');

    function formatTime(seconds) {
        if (isNaN(seconds) || seconds === Infinity) return '0:00';
        var m = Math.floor(seconds / 60);
        var s = Math.floor(seconds % 60);
        return m + ':' + (s < 10 ? '0' : '') + s;
    }

    function loadTrack(index) {
        if (!playlist.length) return;
        index = (index + playlist.length) % playlist.length;
        currentIndex = index;
        var track = playlist[currentIndex];
        audio.src = track.url;
        audio.load();
        trackNameEl.textContent = '🎵 ' + track.name;
        updateListActive();
        if (isPlaying) {
            audio.play().catch(function(e) { console.warn('自动播放被阻止'); });
        }
        updateTimeDisplay();
    }

    function updateTimeDisplay() {
        var current = audio.currentTime || 0;
        var duration = audio.duration || 0;
        trackTimeEl.textContent = formatTime(current) + ' / ' + formatTime(duration);
        var pct = duration ? (current / duration * 100) : 0;
        progressFill.style.width = Math.min(pct, 100) + '%';
    }

    function togglePlay() {
        if (!playlist.length) return;
        if (audio.paused) {
            audio.play().catch(function(e) { 
                console.warn('播放失败: ', e);
                if (audio.src === '' || audio.src === window.location.href) {
                    loadTrack(currentIndex);
                    audio.play();
                }
            });
            isPlaying = true;
            playBtn.textContent = '⏸';
        } else {
            audio.pause();
            isPlaying = false;
            playBtn.textContent = '▶';
        }
    }

    function nextTrack() {
        if (!playlist.length) return;
        var nextIdx = currentIndex + 1;
        if (mode === 'random') {
            nextIdx = Math.floor(Math.random() * playlist.length);
        } else if (mode === 'loop') {
            nextIdx = currentIndex;
        } else {
            if (nextIdx >= playlist.length) nextIdx = 0;
        }
        loadTrack(nextIdx);
        if (!isPlaying) {
            isPlaying = true;
            playBtn.textContent = '⏸';
        }
        audio.play().catch(function(e) {});
    }

    function prevTrack() {
        if (!playlist.length) return;
        var prevIdx = currentIndex - 1;
        if (mode === 'random') {
            prevIdx = Math.floor(Math.random() * playlist.length);
        } else if (mode === 'loop') {
            prevIdx = currentIndex;
        } else {
            if (prevIdx < 0) prevIdx = playlist.length - 1;
        }
        loadTrack(prevIdx);
        if (!isPlaying) {
            isPlaying = true;
            playBtn.textContent = '⏸';
        }
        audio.play().catch(function(e) {});
    }

    function toggleMode() {
        var modes = ['list', 'loop', 'random'];
        var idx = modes.indexOf(mode);
        mode = modes[(idx + 1) % modes.length];
        var labels = { list: '🔁 列表', loop: '🔂 单曲', random: '🔀 随机' };
        modeBtn.textContent = labels[mode] || '🔁 列表';
        modeBtn.className = 'mode-btn active-mode';
    }

    function renderList() {
        if (!listContainer) return;
        var html = '';
        playlist.forEach(function(item, idx) {
            var active = (idx === currentIndex) ? 'active-song' : '';
            html += '<div class="list-item ' + active + '" data-index="' + idx + '">' +
                '<span><span class="index">' + (idx+1) + '</span> ' + item.name + '</span>' +
                '</div>';
        });
        listContainer.innerHTML = html;
        var items = listContainer.querySelectorAll('.list-item');
        for (var i = 0; i < items.length; i++) {
            items[i].addEventListener('click', function(e) {
                var idx = parseInt(this.getAttribute('data-index'));
                if (!isNaN(idx) && idx !== currentIndex) {
                    loadTrack(idx);
                    if (!isPlaying) {
                        isPlaying = true;
                        playBtn.textContent = '⏸';
                    }
                    audio.play().catch(function(e) {});
                } else if (idx === currentIndex) {
                    togglePlay();
                }
            });
        }
    }

    function updateListActive() {
        var items = listContainer ? listContainer.querySelectorAll('.list-item') : [];
        for (var i = 0; i < items.length; i++) {
            var idx = parseInt(items[i].getAttribute('data-index'));
            items[i].className = 'list-item' + (idx === currentIndex ? ' active-song' : '');
        }
    }

    function toggleList() {
        if (listContainer) {
            listContainer.classList.toggle('show');
            if (listContainer.classList.contains('show')) renderList();
        }
    }

    playBtn.addEventListener('click', togglePlay);
    prevBtn.addEventListener('click', prevTrack);
    nextBtn.addEventListener('click', nextTrack);
    modeBtn.addEventListener('click', toggleMode);
    listToggleBtn.addEventListener('click', toggleList);

    audio.addEventListener('timeupdate', updateTimeDisplay);
    audio.addEventListener('ended', function() {
        if (mode === 'loop') {
            audio.currentTime = 0;
            audio.play().catch(function(e) {});
            return;
        }
        nextTrack();
    });
    audio.addEventListener('canplay', function() {
        updateTimeDisplay();
    });

    progressBar.addEventListener('click', function(e) {
        var rect = this.getBoundingClientRect();
        var x = e.clientX - rect.left;
        var pct = Math.min(1, Math.max(0, x / rect.width));
        if (audio.duration) {
            audio.currentTime = pct * audio.duration;
            updateTimeDisplay();
        }
    });

    if (playlist.length) {
        loadTrack(0);
        isPlaying = false;
        playBtn.textContent = '▶';
    }
    modeBtn.textContent = '🔁 列表';
    modeBtn.className = 'mode-btn active-mode';

    document.addEventListener('click', function(e) {
        if (listContainer && listContainer.classList.contains('show')) {
            var target = e.target;
            if (!listContainer.contains(target) && target !== listToggleBtn && !listToggleBtn.contains(target)) {
                listContainer.classList.remove('show');
            }
        }
    });

    window.__musicPlayer = { nextTrack, prevTrack, togglePlay, loadTrack };
})();
</script>

</html>
