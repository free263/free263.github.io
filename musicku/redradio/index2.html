/* ===== 原 style.css 内容完整保留 ===== */
        body {
            height: 100vh;
            width: auto;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;  /* 新增：使子元素纵向排列 */
            padding: 20px;
            background: radial-gradient(circle at 30% 30%, #2b2b3a, #fffff);
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        }

.container {
            width: 600px;
            height: 500px;
            position: relative;
            background: white;
            border-radius: 20px;
            overflow: hidden;
            animation: 2s infinite a3;
            flex-shrink: 0;
            margin-bottom: 30px;  /* 与播放器拉开间距 */
        }
    /* ===== 毛玻璃音乐播放器 ===== */
    .music-player {
      width: 400px;
      padding: 16px 20px;
      background: rgba(20, 20, 30, 0.35);
      backdrop-filter: blur(14px) saturate(180%);
      -webkit-backdrop-filter: blur(14px) saturate(180%);
      border-radius: 60px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.3), inset 0 0 0 1px rgba(255,255,255,0.08);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      color: #fff;
      font-weight: 500;
      flex-shrink: 0;
      border: 1px solid rgba(255,255,255,0.06);
    }
    .player-info {
      display: flex; align-items: center; gap: 10px; flex: 1 1 auto; min-width: 0;
    }
    .player-info .cover {
      width: 44px; height: 44px; border-radius: 30px;
      background: rgba(255,255,255,0.08);
      display: flex; align-items: center; justify-content: center;
      font-size: 22px; flex-shrink: 0;
    }
    .player-info .song-detail {
      display: flex; flex-direction: column;
      overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
    }
    .player-info .song-name {
      font-size: 16px; font-weight: 600; color: #f0f0f0;
      text-shadow: 0 1px 4px rgba(0,0,0,0.3);
    }
    .player-info .song-artist {
      font-size: 12px; opacity: 0.7; color: #d0d0d0; margin-top: 2px;
    }
    .player-controls {
      display: flex; align-items: center; gap: 6px; flex-shrink: 0;
    }
    .player-controls button {
      background: rgba(255,255,255,0.06);
      backdrop-filter: blur(6px);
      border: none;
      width: 38px; height: 38px; border-radius: 40px;
      color: #fff; font-size: 20px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      transition: 0.15s;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
      border: 1px solid rgba(255,255,255,0.06);
      flex-shrink: 0;
    }
    .player-controls button:hover {
      background: rgba(255,255,255,0.18);
      transform: scale(1.02);
      border-color: rgba(255,255,255,0.15);
    }
    .player-controls button:active { transform: scale(0.94); }
    .player-controls .play-btn {
      width: 46px; height: 46px; font-size: 26px;
      background: rgba(255,215,100,0.25);
      border-color: rgba(255,215,100,0.2);
      color: #ffe8b0;
    }
    .player-controls .play-btn:hover {
      background: rgba(255,215,100,0.4);
      border-color: rgba(255,215,100,0.3);
    }
    .mode-btn {
      font-size: 18px !important;
      background: rgba(200,200,255,0.08) !important;
      color: #c8d0ff !important;
      width: 38px; height: 38px;
    }
    .mode-btn:hover { background: rgba(200,200,255,0.2) !important; }

    @media (max-width: 460px) {
      .container, .music-player { width: 94%; min-width: 300px; }
      .music-player { padding: 12px 14px; flex-wrap: nowrap; }
      .player-info .song-name { font-size: 14px; }
      .player-controls button { width: 34px; height: 34px; font-size: 18px; }
      .player-controls .play-btn { width: 42px; height: 42px; font-size: 22px; }
    }
  </style>

{ name: '宗次郎-故乡的原风景', artist: '宗次郎',url: 'https://cloud.hhhnn.com/d/189Family133/音乐视听/精选/宗次郎-故乡的原风景.mp3'}
      ];

      // DOM 元素
      const songNameEl = document.getElementById('songName');
      const songArtistEl = document.getElementById('songArtist');
      const coverEmoji = document.getElementById('coverEmoji');
      const playBtn = document.getElementById('playBtn');
      const prevBtn = document.getElementById('prevBtn');
      const nextBtn = document.getElementById('nextBtn');
      const modeBtn = document.getElementById('modeBtn');

      // 状态变量
      let currentIndex = 0;
      let isPlaying = false;
      let mode = 'loop'; // 'loop' | 'repeat' | 'shuffle'
      let audio = new Audio();

      // ===== 加载歌曲 =====
      function loadSong(index) {
        const song = playlist[index];
        if (!song) return;

        // 更新 UI
        songNameEl.textContent = song.name;
        songArtistEl.textContent = song.artist || '未知艺术家';
        const emojis = ['🎵','🎶','🎧','🎸','☕','🌿','🌌','🎹'];
        coverEmoji.textContent = emojis[index % emojis.length];

        // 加载音频
        audio.src = song.url;
        audio.load();

        // 如果当前是播放状态，继续播放
        if (isPlaying) {
          audio.play().catch(err => {
            console.warn('自动播放被阻止，请手动点击播放:', err);
            isPlaying = false;
            playBtn.textContent = '▶';
          });
        }
      }

      // ===== 更新歌曲 =====
      function goTo(index) {
        if (index < 0) index = playlist.length - 1;
        if (index >= playlist.length) index = 0;
        currentIndex = index;
        loadSong(currentIndex);
        // 如果当前是播放状态，确保播放
        if (isPlaying) {
          audio.play().catch(() => {});
        }
        // 闪动效果
        const player = document.querySelector('.music-player');
        player.style.transition = 'box-shadow 0.1s';
        player.style.boxShadow = '0 8px 32px rgba(100,200,255,0.2)';
        setTimeout(() => {
          player.style.boxShadow = '0 8px 32px rgba(0,0,0,0.3)';
        }, 200);
      }

      // ===== 播放/暂停切换 =====
      function togglePlay() {
        if (isPlaying) {
          audio.pause();
          isPlaying = false;
          playBtn.textContent = '▶';
        } else {
          audio.play()
            .then(() => {
              isPlaying = true;
              playBtn.textContent = '⏸';
            })
            .catch(err => {
              console.warn('播放失败:', err);
              alert('请点击页面任意位置后再次尝试播放（浏览器自动播放策略限制）');
            });
        }
      }

      // ===== 下一首 =====
      function nextSong() {
        if (mode === 'shuffle') {
          let newIndex = currentIndex;
          while (newIndex === currentIndex && playlist.length > 1) {
            newIndex = Math.floor(Math.random() * playlist.length);
          }
          goTo(newIndex);
        } else if (mode === 'repeat') {
          audio.currentTime = 0;
          if (isPlaying) audio.play().catch(() => {});
        } else {
          goTo((currentIndex + 1) % playlist.length);
        }
      }

      // ===== 上一首 =====
      function prevSong() {
        if (mode === 'shuffle') {
          let newIndex = currentIndex;
          while (newIndex === currentIndex && playlist.length > 1) {
            newIndex = Math.floor(Math.random() * playlist.length);
          }
          goTo(newIndex);
        } else if (mode === 'repeat') {
          audio.currentTime = 0;
          if (isPlaying) audio.play().catch(() => {});
        } else {
          goTo((currentIndex - 1 + playlist.length) % playlist.length);
        }
      }

      // ===== 切换循环模式 =====
      function toggleMode() {
        const modes = ['loop', 'repeat', 'shuffle'];
        const icons = ['🔁', '🔂', '🎲'];
        let idx = modes.indexOf(mode);
        idx = (idx + 1) % modes.length;
        mode = modes[idx];
        modeBtn.textContent = icons[idx];
        const modeNames = { 'loop': '顺序循环', 'repeat': '单曲循环', 'shuffle': '随机播放' };
        modeBtn.title = modeNames[mode];
        // 动画反馈
        modeBtn.style.transition = '0.1s';
        modeBtn.style.transform = 'scale(1.2)';
        setTimeout(() => { modeBtn.style.transform = 'scale(1)'; }, 150);
      }

      // ===== 事件绑定 =====

      // 播放/暂停
      playBtn.addEventListener('click', function(e) {
        e.stopPropagation();
        togglePlay();
        console.log('播放按钮点击，当前状态:', isPlaying);
      });

      // 上一首
      prevBtn.addEventListener('click', function(e) {
        e.stopPropagation();
        prevSong();
        console.log('上一首点击');
      });

      // 下一首
      nextBtn.addEventListener('click', function(e) {
        e.stopPropagation();
        nextSong();
        console.log('下一首点击');
      });

      // 模式切换
      modeBtn.addEventListener('click', function(e) {
        e.stopPropagation();
        toggleMode();
        console.log('模式切换:', mode);
      });

      // ===== 音频事件 =====

      // 播放结束 → 下一首
      audio.addEventListener('ended', function() {
        console.log('歌曲播放结束');
        if (mode === 'repeat') {
          audio.currentTime = 0;
          audio.play().catch(() => {});
        } else {
          nextSong();
        }
      });

      // 播放出错时自动切换到下一首
      audio.addEventListener('error', function(e) {
        console.warn('音频加载失败，切换到下一首:', e);
        nextSong();
      });

      // 音频加载完成
      audio.addEventListener('loadedmetadata', function() {
        console.log('音频加载完成:', audio.src);
      });

      // 音频开始播放
      audio.addEventListener('play', function() {
        console.log('音频开始播放');
        isPlaying = true;
        playBtn.textContent = '⏸';
      });

      // 音频暂停
      audio.addEventListener('pause', function() {
        console.log('音频暂停');
        isPlaying = false;
        playBtn.textContent = '▶';
      });

      // ===== 键盘快捷键 =====
      document.addEventListener('keydown', (e) => {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
        if (e.key === ' ' || e.key === 'Space') {
          e.preventDefault();
          togglePlay();
        } else if (e.key === 'ArrowRight') {
          e.preventDefault();
          nextSong();
        } else if (e.key === 'ArrowLeft') {
          e.preventDefault();
          prevSong();
        } else if (e.key === 'm' || e.key === 'M') {
          toggleMode();
        }
      });

      // ===== 点击页面任意位置恢复自动播放 =====
      document.addEventListener('click', function() {
        if (isPlaying) {
          audio.play().catch(() => {});
        }
      }, { once: false });

      // ===== 初始化 =====
      loadSong(0);
      isPlaying = false;
      playBtn.textContent = '▶';
      modeBtn.textContent = '🔁';
      modeBtn.title = '顺序循环';
      
      console.log('播放器初始化完成，当前歌曲:', playlist[0].name);
      console.log('播放列表:', playlist);

    })();
  </script>
