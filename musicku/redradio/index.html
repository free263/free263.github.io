<!DOCTYPE html>
<html lang="en" >
<head>
<meta charset="UTF-8">
<title>纯CSS3喇叭收音机动画特效 - 脚本之家</title>

<link rel="stylesheet" href="css/style.css">
<style>
/* ===== 原 style.css 内容完整保留 ===== */
        body {
            height: 100vh;
            width: auto;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            padding: 20px;
            background: radial-gradient(circle at 30% 30%, #2b2b3a, #fffff);
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        }

.container {
            width: 600px;
            height: 500px;
            position: relative;
            background: white;
            border-radius: 20px;
            overflow: hidden;
            animation: 2s infinite a3;
            flex-shrink: 0;
            margin-bottom: 30px;
        }
    /* ===== 毛玻璃音乐播放器 ===== */
    .music-player {
      width: 400px;
      padding: 16px 20px;
      background: rgba(20, 20, 30, 0.35);
      backdrop-filter: blur(14px) saturate(180%);
      -webkit-backdrop-filter: blur(14px) saturate(180%);
      border-radius: 60px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.3), inset 0 0 0 1px rgba(255,255,255,0.08);
      display: flex;
      flex-direction: column;
      gap: 8px;
      color: #fff;
      font-weight: 500;
      flex-shrink: 0;
      border: 1px solid rgba(255,255,255,0.06);
    }
    .player-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .player-info {
      display: flex; align-items: center; gap: 10px; flex: 1 1 auto; min-width: 0;
    }
    .player-info .cover {
      width: 44px; height: 44px; border-radius: 30px;
      background: rgba(255,255,255,0.08);
      display: flex; align-items: center; justify-content: center;
      font-size: 22px; flex-shrink: 0;
    }
    .player-info .song-detail {
      display: flex; flex-direction: column;
      overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
    }
    .player-info .song-name {
      font-size: 16px; font-weight: 600; color: #f0f0f0;
      text-shadow: 0 1px 4px rgba(0,0,0,0.3);
    }
    .player-info .song-artist {
      font-size: 12px; opacity: 0.7; color: #d0d0d0; margin-top: 2px;
    }

    /* ----- 进度条样式 (位于音乐名称和控制按钮之间) ----- */
    .progress-wrapper {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      width: 100%;
      padding: 0 4px;
      font-size: 0.7rem;
      color: rgba(255,255,255,0.7);
      margin: 2px 0;
    }
    .progress-bar-bg {
      flex: 1;
      height: 4px;
      background: rgba(255,255,255,0.2);
      border-radius: 20px;
      cursor: pointer;
      position: relative;
      transition: height 0.1s;
    }
    .progress-bar-bg:hover {
      height: 6px;
      background: rgba(255,255,255,0.3);
    }
    .progress-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #f9d976, #f39f86);
      border-radius: 20px;
      transition: width 0.05s linear;
      box-shadow: 0 0 8px rgba(243, 159, 134, 0.4);
    }
    .time-current, .time-duration {
      min-width: 32px;
      font-variant-numeric: tabular-nums;
      font-size: 0.65rem;
    }

    .player-controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      flex-shrink: 0;
    }
    .player-controls button {
      background: rgba(255,255,255,0.06);
      backdrop-filter: blur(6px);
      border: none;
      width: 38px; height: 38px; border-radius: 40px;
      color: #fff; font-size: 20px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      transition: 0.15s;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
      border: 1px solid rgba(255,255,255,0.06);
      flex-shrink: 0;
    }
    .player-controls button:hover {
      background: rgba(255,255,255,0.18);
      transform: scale(1.02);
      border-color: rgba(255,255,255,0.15);
    }
    .player-controls button:active { transform: scale(0.94); }
    .player-controls .play-btn {
      width: 46px; height: 46px; font-size: 26px;
      background: rgba(255,215,100,0.25);
      border-color: rgba(255,215,100,0.2);
      color: #ffe8b0;
    }
    .player-controls .play-btn:hover {
      background: rgba(255,215,100,0.4);
      border-color: rgba(255,215,100,0.3);
    }
    .mode-btn {
      font-size: 18px !important;
      background: rgba(200,200,255,0.08) !important;
      color: #c8d0ff !important;
      width: 38px; height: 38px;
    }
    .mode-btn:hover { background: rgba(200,200,255,0.2) !important; }
    .list-toggle-btn {
      font-size: 16px !important;
      background: rgba(200,200,255,0.06) !important;
      width: 38px; height: 38px;
    }
    .list-toggle-btn:hover { background: rgba(200,200,255,0.15) !important; }

    /* 歌单列表 - 毛玻璃 */
    .music-list-panel {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 9998;
      background: rgba(10, 10, 30, 0.6);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 20px;
      padding: 16px 10px;
      max-height: 320px;
      overflow-y: auto;
      width: 360px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
      display: none;
      color: #fff;
      font-family: system-ui, sans-serif;
    }
    .music-list-panel ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    .music-list-panel ul li {
      padding: 10px 18px;
      border-radius: 30px;
      cursor: pointer;
      transition: 0.15s;
      font-size: 15px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: rgba(255,255,255,0.85);
    }
    .music-list-panel ul li:hover {
      background: rgba(255, 255, 255, 0.15);
    }
    .music-list-panel ul li.active {
      background: rgba(255, 215, 100, 0.2);
      color: #ffd764;
      font-weight: 600;
    }
    .music-list-panel::-webkit-scrollbar {
      width: 4px;
    }
    .music-list-panel::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.25);
      border-radius: 10px;
    }

    @media (max-width: 460px) {
      .container, .music-player { width: 94%; min-width: 300px; }
      .music-player { padding: 12px 14px; }
      .player-info .song-name { font-size: 14px; }
      .player-controls button { width: 34px; height: 34px; font-size: 18px; }
      .player-controls .play-btn { width: 42px; height: 42px; font-size: 22px; }
      .music-list-panel { width: 85%; max-height: 260px; }
      .progress-wrapper { font-size: 0.6rem; gap: 0.4rem; }
    }
  </style>
</head>
<body>

<!-- ===== 毛玻璃音乐播放器 ===== -->
<div class="music-player" id="player">
  <!-- 第一行：音乐名称 + 模式/歌单按钮 -->
  <div class="player-top">
    <div class="player-info">
      <div class="cover" id="coverEmoji">🎵</div>
      <div class="song-detail">
        <span class="song-name" id="songName">加载中...</span>
        <span class="song-artist" id="songArtist">点击播放</span>
      </div>
    </div>
    <div class="player-controls">
      <button class="mode-btn" id="modeBtn" title="循环模式">🔁</button>
      <button class="list-toggle-btn" id="listToggleBtn" title="歌单">📋</button>
    </div>
  </div>

  <!-- 第二行：进度条 (位于音乐名称和控制按钮之间) -->
  <div class="progress-wrapper">
    <span class="time-current" id="timeCurrent">0:00</span>
    <div class="progress-bar-bg" id="progressBarBg">
      <div class="progress-fill" id="progressFill" style="width:0%;"></div>
    </div>
    <span class="time-duration" id="timeDuration">0:00</span>
  </div>

  <!-- 第三行：播放控制按钮 -->
  <div class="player-controls" style="justify-content:center;">
    <button id="prevBtn" title="上一首">⏮</button>
    <button class="play-btn" id="playBtn" title="播放/暂停">▶</button>
    <button id="nextBtn" title="下一首">⏭</button>
  </div>
</div>

<!-- ===== 音乐列表面板 ===== -->
<div class="music-list-panel" id="musicListPanel">
  <ul id="songListUl"></ul>
</div>

<!-- 引入 music.js -->
<script src="music.js"></script>

<script>
(function() {
  // ----- 从 MUSIC_DATA 读取歌单 -----
  const musicData = typeof MUSIC_DATA !== 'undefined' ? MUSIC_DATA : [];
  let currentIndex = 0;
  let isPlaying = false;
  let mode = 'loop'; // 'loop', 'repeat', 'shuffle'
  let audio = new Audio();
  let progressRAF = null;

  // DOM 元素
  const songNameEl = document.getElementById('songName');
  const songArtistEl = document.getElementById('songArtist');
  const coverEmoji = document.getElementById('coverEmoji');
  const playBtn = document.getElementById('playBtn');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const modeBtn = document.getElementById('modeBtn');
  const listToggleBtn = document.getElementById('listToggleBtn');
  const songListUl = document.getElementById('songListUl');
  const musicListPanel = document.getElementById('musicListPanel');

  // 进度条元素
  const progressFill = document.getElementById('progressFill');
  const timeCurrent = document.getElementById('timeCurrent');
  const timeDuration = document.getElementById('timeDuration');
  const progressBarBg = document.getElementById('progressBarBg');

  // ----- 进度条辅助函数 -----
  function formatTime(seconds) {
    if (isNaN(seconds) || !isFinite(seconds)) return '0:00';
    const m = Math.floor(seconds / 60);
    const s = Math.floor(seconds % 60);
    return m + ':' + (s < 10 ? '0' : '') + s;
  }

  function updateProgress() {
    if (!audio.duration || isNaN(audio.duration)) {
      progressFill.style.width = '0%';
      timeCurrent.textContent = '0:00';
      timeDuration.textContent = '0:00';
      return;
    }
    const pct = (audio.currentTime / audio.duration) * 100;
    progressFill.style.width = Math.min(pct, 100) + '%';
    timeCurrent.textContent = formatTime(audio.currentTime);
    timeDuration.textContent = formatTime(audio.duration);
  }

  function startProgressLoop() {
    if (progressRAF) cancelAnimationFrame(progressRAF);
    function tick() {
      updateProgress();
      progressRAF = requestAnimationFrame(tick);
    }
    tick();
  }

  function stopProgressLoop() {
    if (progressRAF) {
      cancelAnimationFrame(progressRAF);
      progressRAF = null;
    }
  }

  // ----- 核心功能 -----
  function renderList() {
    songListUl.innerHTML = '';
    musicData.forEach((item, idx) => {
      const li = document.createElement('li');
      li.textContent = item.name;
      li.dataset.index = idx;
      if (idx === currentIndex) li.classList.add('active');
      li.addEventListener('click', function() {
        const i = parseInt(this.dataset.index, 10);
        playIndex(i);
        musicListPanel.style.display = 'none';
      });
      songListUl.appendChild(li);
    });
  }

  function updateListActive() {
    const items = songListUl.querySelectorAll('li');
    items.forEach((el, idx) => {
      el.classList.toggle('active', idx === currentIndex);
    });
  }

  function playIndex(idx) {
    if (!musicData.length) return;
    if (idx < 0) idx = musicData.length - 1;
    if (idx >= musicData.length) idx = 0;
    currentIndex = idx;
    const song = musicData[currentIndex];
    audio.src = song.url;
    audio.load();
    // 重置进度
    progressFill.style.width = '0%';
    timeCurrent.textContent = '0:00';
    if (audio.duration) timeDuration.textContent = formatTime(audio.duration);
    else timeDuration.textContent = '0:00';
    songNameEl.textContent = song.name;
    const artists = ['毛玻璃乐队', '独立音乐人', '梦幻流行', '原声带'];
    songArtistEl.textContent = artists[currentIndex % artists.length];
    const emojis = ['🎵','🎶','🎧','🎸','☕','🌿','🌌','🎹'];
    coverEmoji.textContent = emojis[currentIndex % emojis.length];
    updateListActive();
    if (isPlaying) {
      audio.play().catch(() => {});
      startProgressLoop();
    } else {
      stopProgressLoop();
    }
  }

  function togglePlay() {
    if (!musicData.length) return;
    if (audio.paused) {
      if (!audio.src) {
        playIndex(currentIndex);
        return;
      }
      audio.play().then(() => {
        isPlaying = true;
        playBtn.textContent = '⏸';
        startProgressLoop();
      }).catch(() => {});
    } else {
      audio.pause();
      isPlaying = false;
      playBtn.textContent = '▶';
      stopProgressLoop();
    }
  }

  function nextSong() {
    if (!musicData.length) return;
    if (mode === 'shuffle') {
      let newIdx = Math.floor(Math.random() * musicData.length);
      while (musicData.length > 1 && newIdx === currentIndex) {
        newIdx = Math.floor(Math.random() * musicData.length);
      }
      playIndex(newIdx);
    } else {
      playIndex(currentIndex + 1);
    }
  }

  function prevSong() {
    if (!musicData.length) return;
    if (mode === 'shuffle') {
      let newIdx = Math.floor(Math.random() * musicData.length);
      while (musicData.length > 1 && newIdx === currentIndex) {
        newIdx = Math.floor(Math.random() * musicData.length);
      }
      playIndex(newIdx);
    } else {
      playIndex(currentIndex - 1);
    }
  }

  function toggleMode() {
    const modes = ['loop', 'repeat', 'shuffle'];
    const icons = ['🔁', '🔂', '🎲'];
    let idx = modes.indexOf(mode);
    idx = (idx + 1) % modes.length;
    mode = modes[idx];
    modeBtn.textContent = icons[idx];
    const modeNames = { 'loop': '顺序循环', 'repeat': '单曲循环', 'shuffle': '随机播放' };
    modeBtn.title = modeNames[mode];
  }

  // ----- 事件绑定 -----
  playBtn.addEventListener('click', function(e) {
    e.stopPropagation();
    togglePlay();
  });

  prevBtn.addEventListener('click', function(e) {
    e.stopPropagation();
    prevSong();
  });

  nextBtn.addEventListener('click', function(e) {
    e.stopPropagation();
    nextSong();
  });

  modeBtn.addEventListener('click', function(e) {
    e.stopPropagation();
    toggleMode();
  });

  listToggleBtn.addEventListener('click', function(e) {
    e.stopPropagation();
    const isVisible = musicListPanel.style.display === 'block';
    musicListPanel.style.display = isVisible ? 'none' : 'block';
    if (!isVisible) updateListActive();
  });

  // 进度条点击跳转
  progressBarBg.addEventListener('click', function(e) {
    if (!audio.duration || isNaN(audio.duration)) return;
    const rect = this.getBoundingClientRect();
    const pct = (e.clientX - rect.left) / rect.width;
    audio.currentTime = pct * audio.duration;
    updateProgress();
  });

  audio.addEventListener('ended', function() {
    if (mode === 'repeat') {
      audio.currentTime = 0;
      audio.play().catch(() => {});
      startProgressLoop();
    } else {
      nextSong();
    }
  });

  audio.addEventListener('loadedmetadata', function() {
    timeDuration.textContent = formatTime(audio.duration);
    updateProgress();
  });

  audio.addEventListener('error', function() {
    if (musicData.length) nextSong();
  });

  // 点击外部关闭歌单
  document.addEventListener('click', function(e) {
    const player = document.getElementById('player');
    if (player && !player.contains(e.target) && !musicListPanel.contains(e.target)) {
      musicListPanel.style.display = 'none';
    }
  });

  // 键盘快捷键
  document.addEventListener('keydown', function(e) {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
    if (e.key === ' ' || e.key === 'Space') {
      e.preventDefault();
      togglePlay();
    } else if (e.key === 'ArrowRight') {
      e.preventDefault();
      nextSong();
    } else if (e.key === 'ArrowLeft') {
      e.preventDefault();
      prevSong();
    } else if (e.key === 'm' || e.key === 'M') {
      toggleMode();
    }
  });

  // ----- 初始化 -----
  if (musicData.length) {
    renderList();
    currentIndex = 0;
    playIndex(0);
    isPlaying = false;
    playBtn.textContent = '▶';
    stopProgressLoop();
    modeBtn.textContent = '🔁';
    mode = 'loop';
    timeDuration.textContent = '0:00';
    timeCurrent.textContent = '0:00';
    progressFill.style.width = '0%';
  } else {
    songNameEl.textContent = '🎵 无音乐数据';
    songArtistEl.textContent = '请检查 music.js';
  }

})();
</script>
