        /* ===== 新增毛玻璃播放器 ===== 置于最上层最中间，保持所有原有样式不变 */
        .music-player-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;      /* 让点击穿透，但内部按钮可点击 */
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .music-player-glass {
            pointer-events: auto;       /* 自身交互 */
            width: 320px;
            max-width: 90vw;
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(16px) saturate(180%);

            transition: all 0.2s;
            border: 1px solid rgba(255, 255, 255, 0.08);
            text-shadow: 0 1px 6px rgba(0,0,0,0.4);
        }
        .music-player-glass .now-playing {
            font-size: 15px;
            font-weight: 400;
            letter-spacing: 0.3px;
            text-align: center;
            padding: 0 6px 6px;
            opacity: 0.8;

            text-overflow: ellipsis;
        }
        .music-player-glass .now-playing strong {
            font-weight: 500;

        /* ===== 新增进度条样式 ===== */

    <!-- ========= 音乐播放器浮层 ========= 最上层中间 -->
    <div class="music-player-overlay" id="musicPlayerOverlay">
        <div class="music-player-glass" id="playerGlass">
            <div class="now-playing">🎵 <strong id="songTitle">选择歌曲</strong></div>
            <!-- 进度条 -->
            <div class="progress-wrap">
                <div class="progress-bar" id="progressBar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <span class="progress-time" id="progressTime">0:00 / 0:00</span>
            </div>
            <div class="controls">
                <button id="prevBtn" title="上一首">⏮</button>
                <button class="play-btn" id="playBtn" title="播放/暂停">▶</button>
                <button id="nextBtn" title="下一首">⏭</button>
            </div>
            <div class="mode-area">
                <span id="modeSequence" class="active-mode">顺序</span>
                <span id="modeRandom">随机</span>
                <span id="modeRepeat">单曲循环</span>
            </div>
            <div class="list-toggle" id="listToggle">📋 播放列表</div>
            <ul class="song-list" id="songList"></ul>
        </div>
    </div>

    <!-- 调用music.js -->
    <script src="music.js"></script>
    <script src="js/parallax.min.js"></script>
    <script>
        (function() {
            // ---------- 播放器核心 ----------
            const audio = new Audio();
            let currentIndex = 0;
            let isPlaying = false;
            let mode = 'sequence'; // 'sequence', 'random', 'repeat'

            // DOM 元素
            const playBtn = document.getElementById('playBtn');
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');
            const songTitle = document.getElementById('songTitle');
            const songListEl = document.getElementById('songList');
            const listToggle = document.getElementById('listToggle');
            const modeSequence = document.getElementById('modeSequence');
            const modeRandom = document.getElementById('modeRandom');
            const modeRepeat = document.getElementById('modeRepeat');
            const progressFill = document.getElementById('progressFill');
            const progressTime = document.getElementById('progressTime');
            const progressBar = document.getElementById('progressBar');

            // 数据来自 music.js
            const playlist = window.MUSIC_DATA || [];
            if (playlist.length === 0) {
                songTitle.textContent = '无音乐';
                return;
            }

            // 格式化时间
            function formatTime(seconds) {
                if (isNaN(seconds) || !isFinite(seconds)) return '0:00';
                const m = Math.floor(seconds / 60);
                const s = Math.floor(seconds % 60);
                return m + ':' + (s < 10 ? '0' : '') + s;
            }

            // 更新进度条
            function updateProgress() {
                if (audio.duration && !isNaN(audio.duration) && isFinite(audio.duration)) {
                    const pct = (audio.currentTime / audio.duration) * 100;
                    progressFill.style.width = Math.min(pct, 100) + '%';
                    progressTime.textContent = formatTime(audio.currentTime) + ' / ' + formatTime(audio.duration);
                } else {
                    progressFill.style.width = '0%';
                    progressTime.textContent = '0:00 / 0:00';
                }
            }

            // 渲染列表
            function renderList() {
                songListEl.innerHTML = '';
                playlist.forEach((item, idx) => {
                    const li = document.createElement('li');
                    li.textContent = item.name || '未命名';
                    li.dataset.index = idx;
                    if (idx === currentIndex) li.classList.add('active-song');
                    li.addEventListener('click', function(e) {
                        const index = parseInt(this.dataset.index);
                        if (!isNaN(index) && index !== currentIndex) {
                            currentIndex = index;
                            loadSong(currentIndex);
                            play();
                        } else if (index === currentIndex) {
                            togglePlay();
                        }
                        document.querySelectorAll('#songList li').forEach(el => el.classList.remove('active-song'));
                        this.classList.add('active-song');
                    });
                    songListEl.appendChild(li);
                });
            }

            // 加载歌曲
            function loadSong(index) {
                const song = playlist[index];
                if (!song) return;
                audio.src = song.url;
                songTitle.textContent = song.name || '未知歌曲';
                // 重置进度显示
                progressFill.style.width = '0%';
                progressTime.textContent = '0:00 / 0:00';
                document.querySelectorAll('#songList li').forEach((el, i) => {
                    el.classList.toggle('active-song', i === index);
                });
            }

            // 播放
            function play() {
                if (!audio.src) {
                    loadSong(currentIndex);
                }
                audio.play().then(() => {
                    isPlaying = true;
                    playBtn.textContent = '⏸';
                }).catch(() => {
                    isPlaying = false;
                    playBtn.textContent = '▶';
                });
            }

            // 暂停
            function pause() {
                audio.pause();
                isPlaying = false;
                playBtn.textContent = '▶';
            }

            function togglePlay() {
                if (isPlaying) {
                    pause();
                } else {
                    play();
                }
            }

            // 下一首
            function nextSong() {
                if (mode === 'random') {
                    let newIdx;
                    do {
                        newIdx = Math.floor(Math.random() * playlist.length);
                    } while (newIdx === currentIndex && playlist.length > 1);
                    currentIndex = newIdx;
                } else {
                    currentIndex = (currentIndex + 1) % playlist.length;
                }
                loadSong(currentIndex);
                if (isPlaying) play();
                document.querySelectorAll('#songList li').forEach((el, i) => {
                    el.classList.toggle('active-song', i === currentIndex);
                });
            }

            // 上一首
            function prevSong() {
                if (mode === 'random') {
                    let newIdx;
                    do {
                        newIdx = Math.floor(Math.random() * playlist.length);
                    } while (newIdx === currentIndex && playlist.length > 1);
                    currentIndex = newIdx;
                } else {
                    currentIndex = (currentIndex - 1 + playlist.length) % playlist.length;
                }
                loadSong(currentIndex);
                if (isPlaying) play();
                document.querySelectorAll('#songList li').forEach((el, i) => {
                    el.classList.toggle('active-song', i === currentIndex);
                });
            }

            // 播放结束处理
            function onEnded() {
                if (mode === 'repeat') {
                    audio.currentTime = 0;
                    play();
                } else {
                    nextSong();
                    if (isPlaying) play();
                }
            }

            // 模式切换
            function setMode(m) {
                mode = m;
                [modeSequence, modeRandom, modeRepeat].forEach(el => el.classList.remove('active-mode'));
                if (m === 'sequence') modeSequence.classList.add('active-mode');
                else if (m === 'random') modeRandom.classList.add('active-mode');
                else if (m === 'repeat') modeRepeat.classList.add('active-mode');
            }

            // 点击进度条跳转
            progressBar.addEventListener('click', function(e) {
                if (!audio.duration || isNaN(audio.duration) || !isFinite(audio.duration)) return;
                const rect = this.getBoundingClientRect();
                const pct = Math.min(Math.max((e.clientX - rect.left) / rect.width, 0), 1);
                audio.currentTime = pct * audio.duration;
                updateProgress();
            });

            // 初始化事件
            function init() {
                if (playlist.length) {
                    currentIndex = 0;
                    loadSong(0);
                    pause();
                }

                playBtn.addEventListener('click', togglePlay);
                prevBtn.addEventListener('click', prevSong);
                nextBtn.addEventListener('click', nextSong);

                audio.addEventListener('timeupdate', updateProgress);
                audio.addEventListener('loadedmetadata', function() {
                    if (audio.duration && isFinite(audio.duration)) {
                        progressTime.textContent = '0:00 / ' + formatTime(audio.duration);
                    }
                });
                audio.addEventListener('ended', onEnded);

                modeSequence.addEventListener('click', function() { setMode('sequence'); });
                modeRandom.addEventListener('click', function() { setMode('random'); });
                modeRepeat.addEventListener('click', function() { setMode('repeat'); });

                listToggle.addEventListener('click', function() {
                    songListEl.classList.toggle('open');
                    listToggle.textContent = songListEl.classList.contains('open') ? '📋 收起列表' : '📋 播放列表';
                });

                renderList();

                document.addEventListener('click', function(e) {
                    const glass = document.getElementById('playerGlass');
                    if (glass && !glass.contains(e.target) && songListEl.classList.contains('open')) {
                        songListEl.classList.remove('open');
                        listToggle.textContent = '📋 播放列表';
                    }
                });

                document.addEventListener('keydown', function(e) {
                    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
                    if (e.code === 'Space') {
                        e.preventDefault();
                        togglePlay();
                    }
                    if (e.code === 'ArrowRight') nextSong();
                    if (e.code === 'ArrowLeft') prevSong();
                });
            }

            if (document.readyState === 'complete' || document.readyState === 'interactive') {
                init();
            } else {
                document.addEventListener('DOMContentLoaded', init);
            }

            window.__player = { audio, play, pause, togglePlay, nextSong, prevSong, setMode, playlist };
        })();
    </script>
