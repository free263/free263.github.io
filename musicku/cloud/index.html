<script src="music.js"></script>
<!-- 内联音乐播放器逻辑 (使用Audio API + 进度条) -->
<script>
    (function() {
      // 从外部 music.js 获取歌单
      if (typeof MUSIC_DATA === 'undefined') {
        console.warn('MUSIC_DATA 未加载，请确认 music.js 已引入');
        return;
      }
      const playlist = MUSIC_DATA;
      if (!playlist || playlist.length === 0) {
        console.warn('歌单为空');
        return;
      }

      // DOM 元素
      const songNameEl = document.getElementById('songName');
      const playBtn = document.getElementById('playBtn');
      const prevBtn = document.getElementById('prevBtn');
      const nextBtn = document.getElementById('nextBtn');
      const modeIndicator = document.getElementById('modeIndicator');
      const progressFill = document.getElementById('progressFill');
      const progressTime = document.getElementById('progressTime');
      const progressBar = document.getElementById('progressBar');

      // 状态
      let currentIndex = 0;
      let isPlaying = false;
      let mode = 'loop'; // 'loop', 'single', 'random'
      
      // 创建 Audio 对象
      const audio = new Audio();
      audio.volume = 0.7;

      // 格式化时间
      function formatTime(seconds) {
        if (isNaN(seconds) || !isFinite(seconds)) return '0:00';
        const m = Math.floor(seconds / 60);
        const s = Math.floor(seconds % 60);
        return m + ':' + (s < 10 ? '0' : '') + s;
      }

      // 更新进度条
      function updateProgress() {
        if (audio.duration && !isNaN(audio.duration) && isFinite(audio.duration)) {
          const pct = (audio.currentTime / audio.duration) * 100;
          progressFill.style.width = Math.min(pct, 100) + '%';
          progressTime.textContent = formatTime(audio.currentTime) + ' / ' + formatTime(audio.duration);
        } else {
          progressFill.style.width = '0%';
          progressTime.textContent = '0:00 / 0:00';
        }
      }

      // 加载歌曲
      function loadSong(index) {
        const song = playlist[index];
        if (!song) return;
        audio.src = song.url;
        songNameEl.textContent = song.name;
        // 重置进度显示
        progressFill.style.width = '0%';
        progressTime.textContent = '0:00 / 0:00';
        if (isPlaying) {
          audio.play().catch(err => {
            console.warn('自动播放被阻止，等待用户交互', err);
            isPlaying = false;
            updatePlayButton();
          });
        }
      }

      function updatePlayButton() {
        playBtn.textContent = isPlaying ? '⏸' : '▶';
      }

      function togglePlay() {
        if (audio.src === '') {
          loadSong(currentIndex);
        }
        if (isPlaying) {
          audio.pause();
          isPlaying = false;
        } else {
          audio.play().catch(err => {
            console.warn('播放失败，可能因自动播放策略', err);
            loadSong(currentIndex);
            audio.play().catch(e => console.warn(e));
          });
          isPlaying = true;
        }
        updatePlayButton();
      }

      function nextSong() {
        if (mode === 'random') {
          let newIndex;
          do {
            newIndex = Math.floor(Math.random() * playlist.length);
          } while (playlist.length > 1 && newIndex === currentIndex);
          currentIndex = newIndex;
        } else {
          currentIndex = (currentIndex + 1) % playlist.length;
        }
        loadSong(currentIndex);
        if (isPlaying) {
          audio.play().catch(() => {});
        }
        updateModeIndicator();
      }

      function prevSong() {
        if (mode === 'random') {
          let newIndex;
          do {
            newIndex = Math.floor(Math.random() * playlist.length);
          } while (playlist.length > 1 && newIndex === currentIndex);
          currentIndex = newIndex;
        } else {
          currentIndex = (currentIndex - 1 + playlist.length) % playlist.length;
        }
        loadSong(currentIndex);
        if (isPlaying) {
          audio.play().catch(() => {});
        }
        updateModeIndicator();
      }

      function toggleMode() {
        if (mode === 'loop') mode = 'single';
        else if (mode === 'single') mode = 'random';
        else if (mode === 'random') mode = 'loop';
        updateModeIndicator();
      }

      function updateModeIndicator() {
        const map = {
          'loop': '🔁 列表循环',
          'single': '🔂 单曲循环',
          'random': '🎲 随机播放'
        };
        modeIndicator.textContent = map[mode] || '🔁 列表循环';
      }

      // 音频事件
      audio.addEventListener('timeupdate', updateProgress);
      audio.addEventListener('loadedmetadata', function() {
        if (audio.duration && isFinite(audio.duration)) {
          progressTime.textContent = '0:00 / ' + formatTime(audio.duration);
        }
      });

      audio.addEventListener('ended', function() {
        if (mode === 'single') {
          audio.currentTime = 0;
          audio.play().catch(() => {});
        } else {
          nextSong();
        }
      });

      // 点击进度条跳转
      progressBar.addEventListener('click', function(e) {
        if (!audio.duration || isNaN(audio.duration) || !isFinite(audio.duration)) return;
        const rect = this.getBoundingClientRect();
        const pct = Math.min(Math.max((e.clientX - rect.left) / rect.width, 0), 1);
        audio.currentTime = pct * audio.duration;
        updateProgress();
      });

      // 初始化
      loadSong(0);
      isPlaying = false;
      updatePlayButton();
      updateModeIndicator();

      // 绑定事件
      playBtn.addEventListener('click', togglePlay);
      prevBtn.addEventListener('click', prevSong);
      nextBtn.addEventListener('click', nextSong);
      modeIndicator.addEventListener('click', toggleMode);
      
      // 键盘快捷键
      document.addEventListener('keydown', (e) => {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
        if (e.code === 'Space') {
          e.preventDefault();
          togglePlay();
        } else if (e.code === 'ArrowRight') {
          e.preventDefault();
          nextSong();
        } else if (e.code === 'ArrowLeft') {
          e.preventDefault();
          prevSong();
        } else if (e.code === 'KeyM') {
          toggleMode();
        }
      });

      console.log('🎵 音乐播放器已初始化，歌单数量:', playlist.length);
    })();
  </script>
