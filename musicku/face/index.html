<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>听松阁 · 音乐播放器</title>
    <!-- 保持原有样式，仅调整结构 -->
    <link rel="stylesheet" href="css/style.css" media="screen" type="text/css" />
    <style>
        /* 保留原 style.css 全部规则，并追加新控件样式，确保布局不变 */
        * { margin: 0; padding: 0; }
        *:before, *:after { box-sizing: border-box; }
        body { margin: 0; min-height: 100%; background: #EEE; font-family: 'Roboto Condensed', sans-serif; font-weight: 300; background: lightblue; }
        a { color: #FFF; text-decoration: none; }
        a:hover { color: #26C5CB; }
        p { margin: 0; }
        @font-face { font-family: 'iconfont'; src: url('../iconfont/iconfont.eot'); src: url('../iconfont/iconfont.eot?#iefix') format('embedded-opentype'), url('./iconfont/iconfont.woff') format('woff'), url('./iconfont/iconfont.ttf') format('truetype'), url('../iconfont/iconfont.svg#iconfont') format('svg'); }

        #container, #progress, #canvas, #player, .cover { position: absolute; margin: auto; top: 0; left: 0; right: 0; bottom: 0; }
        #container { width: 350px; height: 320px; }
        #player { width: 320px; height: 320px; overflow: hidden; z-index: 3; }
        #progress { width: 320px; height: 320px; z-index: 2; transform: rotateY(180deg); -webkit-transform: rotateY(180deg); filter: blur(1.5px); -webkit-filter: blur(1.5px); }
        #canvas { width: 320px; height: 320px; z-index: 1; }

        .cover { top: 30%; z-index: 500; }
        .controls { position: relative; width: 100%; height: 50%; color: #fff; text-align: center; overflow: visible; } /* 改为visible让按钮不截断 */
        .play_pause { position: absolute; left: 0%; top: 0; width: 24px; height: 24px; color: #fff; border: 0; outline: 0; text-align: center; background: #fff; border-radius: 100%; cursor: pointer; z-index: 10; }
        #replay { left: auto; right: 0; background: darkgreen; }
        .play_pause:hover { color: #26C5CB; }
        .play_pause i { display: block; line-height: 24px; font-style: normal; font-family: 'iconfont'; font-size: 24px; color: darkgreen; cursor: pointer; }
        #replay i { font-size: 14px; color: #fff; }
        #times { width: 80px; height: 20px; background: #000; border-radius: 10px; position: absolute; left: 50%; margin-left: -40px; top: 30%; line-height: 20px; font-size: 0.6em; }
        .voice { position: absolute; left: 50%; margin-left: -40px; top: 0; -webkit-appearance: none !important; }
        input[type='range'] { display: block; margin: 20px auto; width: 80px; height: 2px; outline: 0; cursor: pointer; box-shadow: 1px 1px 3px 0 #000; -webkit-appearance: none !important; float: left; }
        input[type='range']::-webkit-slider-thumb { background: #AEAEAE; height: 6px; width: 6px; border-radius: 50%; transition: .3s all linear; -webkit-transition: .3s all linear; -webkit-appearance: none !important; }
        input[type='range']:hover::-webkit-slider-thumb { background: darkgreen; -webkit-transform: scale(2); }

        .info { position: relative; margin-top: 28px; bottom: 10px; color: #fff; text-align: center; }
        .song { font-size: 18px; }
        .author { font-size: 14px; margin-bottom: -8px; }
        .song, .author, .playlist a { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* 新增控制按钮组：上一首、下一首、模式切换，保持与原有风格一致 */
        .extra-controls {
            position: absolute;
            width: 100%;
            top: 50px;  /* 微调位置，不干扰原有布局 */
            left: 0;
            display: flex;
            justify-content: center;
            gap: 18px;
            z-index: 20;
            pointer-events: none; /* 让容器不拦截点击，按钮自己可点 */
        }
        .extra-controls .ctrl-btn {
            pointer-events: auto;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255,255,255,0.3);
            color: #fff;
            font-size: 14px;
            line-height: 28px;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
            font-family: 'iconfont', sans-serif;
            backdrop-filter: blur(2px);
        }
        .extra-controls .ctrl-btn:hover {
            background: darkgreen;
            color: #fff;
            border-color: #26C5CB;
            transform: scale(1.1);
        }
        .extra-controls .ctrl-btn.active-mode {
            background: #26C5CB;
            border-color: #fff;
            color: #000;
        }

        /* 保持响应式 */
        @media all and (max-width: 768px) {
            #container, #player { width: 150px; height: 150px; }
            #progress { width: 160px; height: 160px; margin-top: -5px; margin-left: -5px; }
            label, .lyrics, .scroll { display: none; }
            .cover { padding-top: 46px; }
            button { margin: 4px; }
            button:first-of-type, button:last-of-type { display: none; }
            input[type='range'] { display: block; margin-top: -76px; height: 1px; }
            .info { margin-top: 70px; }
            .song { font-size: 12px; }
            .author { font-size: 10px; }
            .extra-controls { top: 30px; gap: 10px; }
            .extra-controls .ctrl-btn { width: 22px; height: 22px; font-size: 11px; line-height: 22px; }
        }
    </style>
</head>

<div id="container">
    <canvas id="canvas" width="320" height="320">对不起，你的浏览器不支持Canvas标签！</canvas>
    <canvas id="progress" width="320" height="320"></canvas><!-- progress bar -->
    <div id="player">
        <!-- 移除原有 audio 标签，改用 JS 动态创建列表，但保留一个隐藏的 audio 元素 -->
        <audio id="audio" style="display:none;"></audio>
        
        <div class="cover">
            <div class="controls">
                <!-- 原有播放/暂停、重播、音量、时间 -->
                <div class="play_pause" id="play" title="Play" onClick="togglePlay()"><i>&#xe600;</i></div>
                <div class="play_pause" id="replay" onclick="replayAudio()"><i>&#xe607;</i></div>
                <div class="voice"><i>&#xe608;</i><input id="volume" name="volume" min="0" max="1" step="0.1" type="range" onchange="setVolume()" /></div>
                <div id="times">00:00/00:00</div>

                <!-- 新增按钮组：上一首、模式切换、下一首，置于 controls 内部，绝对定位调整位置 -->
                <div class="extra-controls">
                    <span class="ctrl-btn" id="prevBtn" title="上一首">&#xe601;</span>   <!-- 使用 iconfont 占位，实际需映射 -->
                    <span class="ctrl-btn" id="modeBtn" title="循环模式">&#xe602;</span>  <!-- 模式图标 -->
                    <span class="ctrl-btn" id="nextBtn" title="下一首">&#xe604;</span>
                </div>
            </div><!-- #controls -->
            <div class="info">
                <p class="song" id="songTitle"><a href="#" target="_blank">Abitude</a></p>
                <p class="author" id="songArtist"><a href="#" target="_blank">Abi</a></p>
            </div>
        </div><!-- #cover -->
    </div><!-- #player -->
</div><!-- #container -->

    ];

    // 当前索引
    let currentIndex = 0;
    // 播放模式: 0-顺序循环, 1-单曲循环, 2-随机播放
    let playMode = 0; 
    const modeIcons = ['&#xe602;', '&#xe605;', '&#xe606;']; // 对应图标

    // DOM 元素
    const audio = document.getElementById('audio');
    const playBtn = document.getElementById('play');
    const replayBtn = document.getElementById('replay');
    const volumeInput = document.getElementById('volume');
    const timeDisplay = document.getElementById('times');
    const progressCanvas = document.getElementById('progress');
    const ctx = progressCanvas.getContext('2d');
    const canvasBg = document.getElementById('canvas');
    const songTitleEl = document.getElementById('songTitle');
    const songArtistEl = document.getElementById('songArtist');

    // 额外控制按钮
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const modeBtn = document.getElementById('modeBtn');

    // ---------- 加载歌曲 ----------
    function loadSong(index) {
        const song = playlist[index];
        if (!song) return;
        audio.src = song.src;
        audio.load();
        // 更新显示信息
        songTitleEl.innerHTML = `<a href="#" target="_blank">${song.title}</a>`;
        songArtistEl.innerHTML = `<a href="#" target="_blank">${song.artist}</a>`;
        // 重置进度显示
        timeDisplay.textContent = '00:00/00:00';
        ctx.clearRect(0, 0, progressCanvas.width, progressCanvas.height);
        // 如果正在播放，自动播放
        if (!audio.paused) {
            audio.play();
        }
        // 更新播放按钮状态
        updatePlayButton();
    }

    // 更新播放按钮图标
    function updatePlayButton() {
        if (audio.paused || audio.ended) {
            playBtn.innerHTML = '<i>&#xe600;</i>';
            playBtn.title = 'Play';
        } else {
            playBtn.innerHTML = '<i>&#xe603;</i>';
            playBtn.title = 'Pause';
        }
    }

    // ---------- 切换歌曲 ----------
    function playPrev() {
        if (playlist.length === 0) return;
        if (playMode === 2) { // 随机模式
            let newIndex;
            do {
                newIndex = Math.floor(Math.random() * playlist.length);
            } while (newIndex === currentIndex && playlist.length > 1);
            currentIndex = newIndex;
        } else {
            currentIndex = (currentIndex - 1 + playlist.length) % playlist.length;
        }
        loadSong(currentIndex);
        if (audio.paused) audio.play();
    }

    function playNext() {
        if (playlist.length === 0) return;
        if (playMode === 2) {
            let newIndex;
            do {
                newIndex = Math.floor(Math.random() * playlist.length);
            } while (newIndex === currentIndex && playlist.length > 1);
            currentIndex = newIndex;
        } else {
            currentIndex = (currentIndex + 1) % playlist.length;
        }
        loadSong(currentIndex);
        if (audio.paused) audio.play();
    }

    // 模式切换
    function toggleMode() {
        playMode = (playMode + 1) % 3;
        updateModeButton();
    }

    function updateModeButton() {
        // 使用对应图标
        modeBtn.innerHTML = modeIcons[playMode];
        // 可以添加激活样式
        if (playMode === 0) modeBtn.className = 'ctrl-btn';
        else if (playMode === 1) modeBtn.className = 'ctrl-btn active-mode';
        else modeBtn.className = 'ctrl-btn active-mode';
        // 提示文字
        const modeText = ['顺序循环', '单曲循环', '随机播放'];
        modeBtn.title = modeText[playMode];
    }

    // ---------- 原有功能 (保持兼容) ----------
    function togglePlay() {
        if (audio.paused || audio.ended) {
            audio.play();
        } else {
            audio.pause();
        }
        updatePlayButton();
    }

    function replayAudio() {
        audio.currentTime = 0;
        ctx.clearRect(0, 0, progressCanvas.width, progressCanvas.height);
        if (audio.paused) {
            audio.play();
        }
        updatePlayButton();
    }

    function setVolume() {
        audio.volume = volumeInput.value;
    }

    // 时间更新 & 进度环
    audio.addEventListener('timeupdate', function() {
        updateProgress();
        const aTime = parseInt(audio.currentTime);
        const aLength = parseInt(audio.duration);
        if (!isNaN(aLength) && aLength > 0) {
            const fmt = (t) => (t < 10 ? '0' + t : t);
            const min = Math.floor(aTime / 60);
            const sec = aTime % 60;
            const totalMin = Math.floor(aLength / 60);
            const totalSec = aLength % 60;
            timeDisplay.textContent = `${fmt(min)}:${fmt(sec)}/${fmt(totalMin)}:${fmt(totalSec)}`;
        }
    }, false);

    // 更新进度环
    function updateProgress() {
        if (!audio.duration) return;
        const percent = Math.floor((100 / audio.duration) * audio.currentTime);
        const centerX = progressCanvas.width / 2;
        const centerY = progressCanvas.height / 2;
        const radius = 150;
        const circ = Math.PI;
        const cpercent = percent / 100;
        ctx.clearRect(0, 0, progressCanvas.width, progressCanvas.height);
        ctx.beginPath();
        ctx.lineCap = 'round';
        ctx.arc(centerX, centerY, radius, 0, circ * 2 * cpercent, false);
        ctx.lineWidth = 5;
        ctx.strokeStyle = 'yellow';
        ctx.stroke();

        if (audio.ended) {
            resetPlayer();
        }
    }

    function resetPlayer() {
        audio.currentTime = 0;
        ctx.clearRect(0, 0, progressCanvas.width, progressCanvas.height);
        playBtn.innerHTML = '<i>&#xe600;</i>';
        playBtn.title = 'Play';
        // 根据模式决定是否自动下一首
        if (playMode === 1) { // 单曲循环
            audio.play();
        } else {
            // 顺序或随机，自动播放下一首
            playNext();
        }
    }

    // 监听音频结束
    audio.addEventListener('ended', function() {
        // 由 resetPlayer 处理，但 resetPlayer 会在 timeupdate 中调用，这里做保险
        if (audio.ended) {
            if (playMode === 1) {
                audio.currentTime = 0;
                audio.play();
            } else {
                playNext();
            }
        }
    });

    // 初始化加载第一首歌
    window.addEventListener('load', function() {
        // 绘制背景圆弧 (原有)
        const canvas = document.getElementById('canvas');
        if (canvas.getContext) {
            const ctxBg = canvas.getContext('2d');
            ctxBg.beginPath();
            ctxBg.strokeStyle = 'darkgreen';
            ctxBg.lineCap = 'round';
            ctxBg.lineWidth = 6;
            ctxBg.arc(160, 160, 150, 0, Math.PI, false);
            ctxBg.stroke();
        }

        // 加载第一首
        if (playlist.length > 0) {
            loadSong(0);
            currentIndex = 0;
        }
        // 音量默认
        volumeInput.value = 0.8;
        audio.volume = 0.8;
        // 模式按钮初始
        updateModeButton();

        // 绑定额外事件
        prevBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            playPrev();
        });
        nextBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            playNext();
        });
        modeBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            toggleMode();
        });

        // 修复播放暂停事件同步
        audio.addEventListener('play', updatePlayButton);
        audio.addEventListener('pause', updatePlayButton);
        audio.addEventListener('ended', function() {
            // 但由reset或者ended处理
        });
    });

    // 暴露全局函数 (保持原HTML onclick可用)
    window.togglePlay = togglePlay;
    window.replayAudio = replayAudio;
    window.setVolume = setVolume;
</script>
